<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprendre Python - 50 Leçons</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117;
  --surface: #131920;
  --surface2: #1a2332;
  --border: #253040;
  --accent: #3b82f6;
  --accent2: #60a5fa;
  --text: #e2eaf8;
  --muted: #6b80a0;
  --green: #34d399;
  --amber: #fbbf24;
  --red: #f87171;
  --code-bg: #080d14;
  --py-yellow: #f7d14a;
  --py-blue: #4ca3f7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 58px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
  z-index: 10;
}

.logo { display: flex; align-items: center; gap: 10px; }

.logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--py-blue), var(--py-yellow));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; font-weight: 600; color: #0d1117;
}

.logo-text {
  font-size: 16px; font-weight: 700;
  background: linear-gradient(90deg, var(--py-blue), var(--py-yellow));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-info { margin-left: auto; display: flex; align-items: center; gap: 20px; }

.progress-bar-wrap { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }

.progress-track { width: 120px; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--py-blue), var(--py-yellow));
  border-radius: 99px; transition: width 0.4s;
}

.badge {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--muted);
}

.main { display: flex; flex: 1; overflow: hidden; }

.sidebar {
  width: 72px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 0; gap: 8px; flex-shrink: 0;
}

.nav-btn {
  width: 44px; height: 44px; border-radius: 10px; border: none;
  background: transparent; color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; transition: all 0.2s; position: relative;
}

.nav-btn:hover, .nav-btn.active { background: var(--surface2); color: var(--accent2); }

.nav-btn.active::before {
  content: ''; position: absolute; left: -1px; top: 50%;
  transform: translateY(-50%); width: 3px; height: 24px;
  background: var(--accent); border-radius: 0 3px 3px 0;
}

.lessons-panel {
  width: 320px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}

.panel-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  font-size: 13px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
  display: flex; align-items: center; justify-content: space-between;
}

.search-box {
  margin: 12px 16px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 8px;
}

.search-box input {
  background: transparent; border: none; outline: none;
  color: var(--text); font-family: 'Sora', sans-serif; font-size: 13px; width: 100%;
}

.search-box input::placeholder { color: var(--muted); }

.lesson-list { flex: 1; overflow-y: auto; padding: 8px; }
.lesson-list::-webkit-scrollbar { width: 4px; }
.lesson-list::-webkit-scrollbar-track { background: transparent; }
.lesson-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.chapter-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); padding: 14px 12px 6px;
}

.lesson-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: 8px; cursor: pointer; transition: all 0.15s; border: 1px solid transparent;
}

.lesson-item:hover { background: var(--surface2); }

.lesson-item.active {
  background: rgba(59, 130, 246, 0.12);
  border-color: rgba(59, 130, 246, 0.3);
}

.lesson-num {
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  font-size: 10px; font-family: 'JetBrains Mono', monospace;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: var(--muted); transition: all 0.15s;
}

.lesson-item.active .lesson-num, .lesson-item:hover .lesson-num {
  background: var(--accent); border-color: var(--accent); color: white;
}

.lesson-item.done .lesson-num {
  background: rgba(52, 211, 153, 0.15); border-color: var(--green); color: var(--green);
}

.lesson-title { font-size: 13px; color: var(--text); line-height: 1.4; flex: 1; }
.lesson-item.active .lesson-title { color: var(--accent2); }

.content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.lesson-content { flex: 1; overflow-y: auto; padding: 32px 40px; }
.lesson-content::-webkit-scrollbar { width: 4px; }
.lesson-content::-webkit-scrollbar-track { background: transparent; }
.lesson-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.lesson-header { margin-bottom: 28px; }

.lesson-number-badge {
  font-size: 12px; color: var(--accent2); font-family: 'JetBrains Mono', monospace;
  font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
}

.lesson-number-badge::before {
  content: ''; width: 20px; height: 1px; background: var(--accent);
}

.lesson-h1 { font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 6px; line-height: 1.3; }
.lesson-subtitle { font-size: 14px; color: var(--muted); }

.info-block {
  display: flex; gap: 14px; padding: 16px 20px; border-radius: 10px;
  margin: 20px 0; font-size: 14px; line-height: 1.7; border: 1px solid;
}

.info-block.concept { background: rgba(59, 130, 246, 0.08); border-color: rgba(59, 130, 246, 0.25); color: #93c5fd; }
.info-block.tip { background: rgba(52, 211, 153, 0.07); border-color: rgba(52, 211, 153, 0.25); color: #6ee7b7; }
.info-block.warn { background: rgba(251, 191, 36, 0.07); border-color: rgba(251, 191, 36, 0.2); color: #fde68a; }

.info-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }

.prose { font-size: 15px; line-height: 1.85; color: #c0cce0; margin-bottom: 18px; }
.prose strong { color: var(--text); font-weight: 600; }
.prose code {
  font-family: 'JetBrains Mono', monospace; font-size: 13px;
  background: rgba(59, 130, 246, 0.12); color: var(--accent2);
  padding: 1px 6px; border-radius: 4px;
}

.code-block {
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 10px; margin: 20px 0; overflow: hidden;
}

.code-header {
  display: flex; align-items: center; padding: 10px 16px;
  background: var(--surface); border-bottom: 1px solid var(--border); gap: 8px;
}

.code-dots { display: flex; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-r { background: #f87171; }
.dot-y { background: #fbbf24; }
.dot-g { background: #34d399; }

.code-lang {
  margin-left: auto; font-size: 11px; color: var(--muted);
  font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em;
}

.code-copy {
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  font-size: 11px; padding: 3px 8px; border-radius: 4px; cursor: pointer;
  font-family: 'Sora', sans-serif; transition: all 0.15s;
}

.code-copy:hover { color: var(--text); border-color: var(--accent); }

.code-body {
  padding: 20px; font-family: 'JetBrains Mono', monospace;
  font-size: 14px; line-height: 1.7; overflow-x: auto; color: #e2eaf8; white-space: pre;
}

.kw { color: #c084fc; }
.ty { color: #60a5fa; }
.st { color: #34d399; }
.cm { color: #4a5577; }
.nm { color: #fb923c; }
.fn { color: #a78bfa; }
.bi { color: #f7d14a; }

.lesson-nav {
  display: flex; align-items: center; gap: 12px;
  margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--border);
}

.nav-arrow {
  padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-family: 'Sora', sans-serif;
  font-size: 14px; cursor: pointer; transition: all 0.15s;
}

.nav-arrow:hover { border-color: var(--accent); color: var(--accent2); }
.nav-arrow.primary { background: var(--accent); border-color: var(--accent); color: white; margin-left: auto; }
.nav-arrow.primary:hover { background: #2563eb; }

.editor-panel {
  width: 400px; background: var(--surface); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}

.editor-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}

.editor-tabs { display: flex; gap: 2px; }

.etab {
  padding: 6px 14px; font-size: 12px; font-weight: 600; border-radius: 6px;
  cursor: pointer; color: var(--muted); transition: all 0.15s;
  border: none; background: transparent; font-family: 'Sora', sans-serif;
}

.etab.active { background: var(--surface2); color: var(--text); }

.run-btn {
  margin-left: auto; padding: 6px 14px; background: var(--accent); color: white;
  border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
  font-family: 'Sora', sans-serif; display: flex; align-items: center; gap: 6px;
  transition: background 0.15s;
}

.run-btn:hover { background: #2563eb; }

.editor-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.tab-pane { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.tab-pane.active { display: flex; }

textarea#code-editor {
  flex: 1; background: var(--code-bg); border: none;
  border-bottom: 1px solid var(--border); color: var(--text);
  font-family: 'JetBrains Mono', monospace; font-size: 13px;
  padding: 20px; resize: none; outline: none; line-height: 1.7; tab-size: 4;
}

.output-box {
  background: var(--code-bg); flex: 1; overflow: auto; padding: 20px;
  font-family: 'JetBrains Mono', monospace; font-size: 13px;
  line-height: 1.7; color: var(--green); border-bottom: 1px solid var(--border);
}

.output-box.empty { color: var(--muted); }

.ai-pane { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.ai-pane.active { display: flex; }

.ai-messages {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}

.ai-messages::-webkit-scrollbar { width: 3px; }
.ai-messages::-webkit-scrollbar-thumb { background: var(--border); }

.msg {
  padding: 12px 14px; border-radius: 10px;
  font-size: 13px; line-height: 1.65; max-width: 95%;
}

.msg.user {
  background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3);
  color: #bfdbfe; align-self: flex-end;
}

.msg.ai { background: var(--surface2); border: 1px solid var(--border); color: var(--text); align-self: flex-start; }

.msg.ai code {
  font-family: 'JetBrains Mono', monospace; background: rgba(0,0,0,0.4);
  padding: 1px 5px; border-radius: 3px; font-size: 12px; color: var(--accent2);
}

.ai-input-row {
  padding: 12px 16px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: flex-end;
}

.ai-input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; color: var(--text); font-family: 'Sora', sans-serif; font-size: 13px;
  outline: none; resize: none; line-height: 1.5; min-height: 40px; max-height: 100px;
  transition: border 0.15s;
}

.ai-input:focus { border-color: var(--accent); }
.ai-input::placeholder { color: var(--muted); }

.send-btn {
  width: 36px; height: 36px; border-radius: 8px; background: var(--accent); border: none;
  color: white; font-size: 16px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; transition: background 0.15s; flex-shrink: 0;
}

.send-btn:hover { background: #2563eb; }

.typing-indicator {
  display: none; align-items: center; gap: 4px; padding: 10px 14px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; width: fit-content;
}

.typing-indicator span {
  width: 6px; height: 6px; background: var(--muted); border-radius: 50%;
  animation: bounce 1.2s infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-5px); opacity: 1; }
}

.concept-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }

.concept-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px;
}

.cc-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
.cc-value { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--accent2); }
.cc-desc { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

.section-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  font-weight: 600; margin: 28px 0 12px; display: flex; align-items: center; gap: 10px;
}

.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.done-btn {
  padding: 8px 16px; border-radius: 8px; background: rgba(52, 211, 153, 0.1);
  border: 1px solid rgba(52, 211, 153, 0.3); color: var(--green);
  font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all 0.15s;
}

.done-btn:hover { background: rgba(52, 211, 153, 0.2); }

@media (max-width: 1100px) {
  .editor-panel { width: 340px; }
  .lessons-panel { width: 280px; }
}

@media (max-width: 800px) {
  .sidebar { display: none; }
  .lessons-panel { width: 100%; position: absolute; z-index: 5; transform: translateX(-100%); transition: transform 0.3s; }
  .lessons-panel.open { transform: none; }
  .editor-panel { display: none; }
}

.quiz-block {
  border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 10px; padding: 18px;
  margin: 20px 0; background: rgba(59, 130, 246, 0.05);
}

.quiz-q { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text); }

.quiz-opt {
  padding: 9px 14px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--surface2); margin-bottom: 8px; cursor: pointer;
  font-size: 13px; color: var(--text); transition: all 0.15s;
  display: block; width: 100%; text-align: left; font-family: 'Sora', sans-serif;
}

.quiz-opt:hover { border-color: var(--accent); color: var(--accent2); }
.quiz-opt.correct { border-color: var(--green); background: rgba(52, 211, 153, 0.1); color: var(--green); }
.quiz-opt.wrong { border-color: var(--red); background: rgba(248, 113, 113, 0.1); color: var(--red); }

.quiz-feedback { margin-top: 10px; font-size: 13px; display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">Py</div>
    <span class="logo-text">Python Academy</span>
  </div>
  <div class="header-info">
    <div class="progress-bar-wrap">
      <span id="progress-text">0 / 50 leçons</span>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <div class="badge" id="xp-badge">0 XP</div>
  </div>
</div>

<div class="main">

  <div class="sidebar">
    <button class="nav-btn active" title="Leçons" onclick="setTab(event)">📚</button>
    <button class="nav-btn" title="Éditeur" onclick="setTab(event)">⌨️</button>
    <button class="nav-btn" title="Assistant IA" onclick="setTab(event)">✨</button>
  </div>

  <div class="lessons-panel" id="lessons-panel">
    <div class="panel-header">
      <span>50 Leçons</span>
      <span id="done-count" style="font-size:11px;color:var(--green)">0 complétées</span>
    </div>
    <div class="search-box">
      <span style="color:var(--muted);font-size:14px">🔍</span>
      <input type="text" id="search-input" placeholder="Rechercher une leçon..." oninput="filterLessons()">
    </div>
    <div class="lesson-list" id="lesson-list"></div>
  </div>

  <div class="content-area">
    <div class="lesson-content" id="lesson-content"></div>
  </div>

  <div class="editor-panel">
    <div class="editor-header">
      <div class="editor-tabs">
        <button class="etab active" onclick="switchEditorTab('code')">Éditeur</button>
        <button class="etab" onclick="switchEditorTab('output')">Sortie</button>
        <button class="etab" onclick="switchEditorTab('ai')">✨ IA</button>
      </div>
      <button class="run-btn" onclick="showCode()">▶ Afficher</button>
    </div>
    <div class="editor-body">
      <div class="tab-pane active" id="tab-code">
        <textarea id="code-editor"># Votre premier programme Python
print("Bonjour et bienvenue en Python !")</textarea>
      </div>
      <div class="tab-pane" id="tab-output">
        <div class="output-box empty" id="output-box">▶ Cliquez "Afficher" pour voir le résultat...</div>
      </div>
      <div class="ai-pane" id="tab-ai">
        <div class="ai-messages" id="ai-messages">
          <div class="msg ai">🐍 Bonjour ! Je suis ton assistant Python. Pose-moi n'importe quelle question sur Python, sur la leçon actuelle, ou demande-moi d'expliquer ton code !</div>
        </div>
        <div class="typing-indicator" id="typing" style="margin: 0 16px 8px;">
          <span></span><span></span><span></span>
        </div>
        <div class="ai-input-row">
          <textarea class="ai-input" id="ai-input" placeholder="Pose une question en Python..." rows="1" onkeydown="handleAiKey(event)"></textarea>
          <button class="send-btn" onclick="sendAI()">➤</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const lessons = [
  {
    title: "Introduction à Python",
    chapter: "🏁 Démarrage",
    subtitle: "Histoire, philosophie et écosystème Python",
    content: `
<p class="prose">Python est un langage de programmation <strong>simple, lisible et polyvalent</strong>, créé par Guido van Rossum en 1991. Il est aujourd'hui le langage le plus populaire au monde, utilisé en data science, IA, web, scripts, et bien plus.</p>

<div class="info-block concept"><span class="info-icon">💡</span><div>Le nom "Python" vient des <strong>Monty Python</strong>, groupe comique britannique. La philosophie de Python tient en une phrase : "Il devrait y avoir une — et de préférence une seule — façon évidente de faire les choses."</div></div>

<div class="section-title">Pourquoi Python ?</div>
<div class="concept-grid">
  <div class="concept-card"><div class="cc-label">Lisibilité</div><div class="cc-value">Syntaxe claire</div><div class="cc-desc">Code lisible comme du pseudo-code anglais</div></div>
  <div class="concept-card"><div class="cc-label">Polyvalence</div><div class="cc-value">Tout usage</div><div class="cc-desc">Web, IA, Data, Scripts, Jeux, IoT...</div></div>
  <div class="concept-card"><div class="cc-label">Communauté</div><div class="cc-value">Immense</div><div class="cc-desc">Millions de bibliothèques sur PyPI</div></div>
  <div class="concept-card"><div class="cc-label">Typage</div><div class="cc-value">Dynamique</div><div class="cc-desc">Pas besoin de déclarer les types</div></div>
</div>

<div class="section-title">Le Zen de Python</div>
<p class="prose">Python a une philosophie officielle appelée "The Zen of Python". Les règles clés : <strong>Simple vaut mieux que complexe</strong>, la lisibilité compte, les erreurs ne doivent jamais passer silencieusement.</p>`,
    code: `# Le Zen de Python (aperçu)
# Tapez "import this" dans Python pour le voir complet

print("Bienvenue en Python !")
print("Version Python : 3.x")

# Python peut faire des calculs directement
print(2 + 2)          # 4
print(10 / 3)         # 3.333...
print(10 ** 3)        # 1000 (puissance)

# La lisibilité de Python
nom = "Thierno"
age = 22
print(f"Bonjour {nom}, tu as {age} ans !")

# Sans accolades, sans point-virgule
# L'indentation structure le code`,
    quiz: { q: "Qui a créé Python ?", opts: ["Bill Gates", "Guido van Rossum", "Linus Torvalds", "James Gosling"], ans: 1, exp: "✅ Guido van Rossum a créé Python en 1991. Il a été surnommé 'Benevolent Dictator For Life' (BDFL) de la communauté Python." }
  },
  {
    title: "print() et Affichage",
    chapter: "🏁 Démarrage",
    subtitle: "Afficher des données — toutes les formes de print()",
    content: `
<p class="prose">La fonction <code>print()</code> est votre premier outil en Python. Elle affiche du texte, des nombres, des variables, et bien plus dans la console. Elle est beaucoup plus flexible que son équivalent dans d'autres langages.</p>

// ─── STATE ─────────────────────────────────────────
let currentLesson = 0;
let completedLessons = new Set();

// ─── BUILD LIST ─────────────────────────────────────
function buildLessonList() {
  const container = document.getElementById('lesson-list');
  let lastChapter = '';
  let html = '';
  lessonsFull.forEach((lesson, i) => {
    if (lesson.chapter !== lastChapter) {
      html += `<div class="chapter-label">${lesson.chapter}</div>`;
      lastChapter = lesson.chapter;
    }
    const done = completedLessons.has(i) ? 'done' : '';
    const active = i === currentLesson ? 'active' : '';
    const num = completedLessons.has(i) ? '✓' : (i + 1);
    html += `<div class="lesson-item ${active} ${done}" onclick="goToLesson(${i})" id="li-${i}">
      <div class="lesson-num">${num}</div>
      <div class="lesson-title">${lesson.title}</div>
    </div>`;
  });
  container.innerHTML = html;
}

// ─── RENDER LESSON ──────────────────────────────────
function renderLesson(i) {
  const lesson = lessonsFull[i];
  document.getElementById('code-editor').value = lesson.code || '';

  const quizHTML = lesson.quiz ? `
    <div class="section-title">Mini Quiz</div>
    <div class="quiz-block" id="quiz-${i}">
      <div class="quiz-q">🎯 ${lesson.quiz.q}</div>
      ${lesson.quiz.opts.map((opt, j) => `<button class="quiz-opt" onclick="checkQuiz(${i},${j})">${opt}</button>`).join('')}
      <div class="quiz-feedback" id="qf-${i}"></div>
    </div>` : '';

  document.getElementById('lesson-content').innerHTML = `
    <div class="lesson-header">
      <div class="lesson-number-badge">Leçon ${i + 1} / ${lessonsFull.length}</div>
      <h1 class="lesson-h1">${lesson.title}</h1>
      <p class="lesson-subtitle">${lesson.subtitle}</p>
    </div>
    ${lesson.content}
    <div class="section-title">Code Complet</div>
    <div class="code-block">
      <div class="code-header">
        <div class="code-dots"><div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div></div>
        <span class="code-lang">Python</span>
        <button class="code-copy" onclick="copyCode(${i})">Copier</button>
      </div>
      <div class="code-body">${highlightPython(lesson.code)}</div>
    </div>
    ${quizHTML}
    <div class="lesson-nav">
      ${i > 0 ? `<button class="nav-arrow" onclick="goToLesson(${i-1})">← Précédent</button>` : ''}
      <button class="done-btn" onclick="markDone(${i})">✓ Marquer comme apprise</button>
      ${i < lessonsFull.length - 1 ? `<button class="nav-arrow primary" onclick="goToLesson(${i+1})">Suivant →</button>` : '<span style="margin-left:auto;color:var(--green);font-weight:600">🎉 Cours terminé !</span>'}
    </div>
  `;
  document.getElementById('lesson-content').scrollTop = 0;
}

function highlightPython(code) {
  return code
    .replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/#.*/g, m => `<span class="cm">${m}</span>`)
    .replace(/"""[\s\S]*?"""|'''[\s\S]*?'''/g, m => `<span class="st">${m}</span>`)
    .replace(/"([^"]*)"|'([^']*)'/g, m => `<span class="st">${m}</span>`)
    .replace(/\b(def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|try|except|finally|raise|with|pass|break|continue|yield|lambda|del|global|nonlocal|async|await|match|case)\b/g, m => `<span class="kw">${m}</span>`)
    .replace(/\b(int|str|float|bool|list|dict|tuple|set|None|True|False|type|len|range|print|input|super|self|open|zip|map|filter|sorted|reversed|enumerate|sum|min|max|abs|round)\b/g, m => `<span class="bi">${m}</span>`)
    .replace(/\b(\d+\.?\d*)\b/g, m => `<span class="nm">${m}</span>`);
}

function goToLesson(i) {
  currentLesson = i;
  renderLesson(i);
  buildLessonList();
  document.getElementById(`li-${i}`)?.scrollIntoView({ block: 'nearest' });
}

function markDone(i) {
  if (!completedLessons.has(i)) {
    completedLessons.add(i);
    xp += 20;
    document.getElementById('xp-badge').textContent = xp + ' XP';
    updateProgress();
    buildLessonList();
  }
}

function updateProgress() {
  const pct = (completedLessons.size / lessonsFull.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${completedLessons.size} / ${lessonsFull.length} leçons`;
  document.getElementById('done-count').textContent = completedLessons.size + ' complétées';
}

function copyCode(i) { navigator.clipboard.writeText(lessonsFull[i].code); }

function checkQuiz(li, oi) {
  const q = lessonsFull[li].quiz;
  const block = document.getElementById(`quiz-${li}`);
  const feedback = document.getElementById(`qf-${li}`);
  const btns = block.querySelectorAll('.quiz-opt');
  btns.forEach(b => b.disabled = true);
  btns[oi].classList.add(oi === q.ans ? 'correct' : 'wrong');
  if (oi !== q.ans) btns[q.ans].classList.add('correct');
  feedback.style.display = 'block';
  feedback.textContent = q.exp;
  feedback.style.color = oi === q.ans ? 'var(--green)' : 'var(--red)';
  if (oi === q.ans) { xp += 10; document.getElementById('xp-badge').textContent = xp + ' XP'; }
}

function filterLessons() {
  const q = document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.lesson-item').forEach((el, i) => {
    el.style.display = lessonsFull[i].title.toLowerCase().includes(q) ? '' : 'none';
  });
  document.querySelectorAll('.chapter-label').forEach(el => {
    el.style.display = q ? 'none' : '';
  });
}

function showCode() {
  const code = document.getElementById('code-editor').value;
  const out = document.getElementById('output-box');
  out.className = 'output-box';
  out.innerHTML = `<div style="color:var(--muted);font-size:11px;margin-bottom:12px"># Votre code Python :</div>` + highlightPython(code);
  switchEditorTab('output');
}

function switchEditorTab(tab) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.etab').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.querySelectorAll('.etab').forEach(b => {
    if (b.textContent.toLowerCase().includes(tab) || (tab === 'ai' && b.textContent.includes('IA'))) {
      b.classList.add('active');
    }
  });
}

async function sendAI() {
  const input = document.getElementById('ai-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  const lesson = lessonsFull[currentLesson];
  appendMsg(msg, 'user');
  document.getElementById('typing').style.display = 'flex';

  const sys = `Tu es un assistant pédagogique expert en Python, répondant en français. L'utilisateur apprend Python et est à la leçon "${lesson.title}" (${lesson.subtitle}). Réponds de façon claire, concise et pédagogique. Utilise des exemples courts. Si du code est collé, explique-le.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', max_tokens: 1000,
        system: sys,
        messages: [{ role: 'user', content: msg }]
      })
    });
    const data = await res.json();
    const reply = data.content?.map(c => c.text || '').join('') || "Désolé, je n'ai pas pu répondre.";
    document.getElementById('typing').style.display = 'none';
    appendMsg(reply, 'ai');
  } catch {
    document.getElementById('typing').style.display = 'none';
    appendMsg("Erreur de connexion. Vérifiez votre connexion internet.", 'ai');
  }
}

function appendMsg(text, role) {
  const c = document.getElementById('ai-messages');
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  d.innerHTML = text.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

function handleAiKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAI(); }
}

function setTab(e) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  e.currentTarget.classList.add('active');
}
