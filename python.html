<style>
:root {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --surface2: #F4F3EF;
  --surface3: #EDECEA;
  --border: #E5E4DF;
  --border2: #D0CFC9;
  --accent: #1A6B3C;
  --accent2: #2D9D5C;
  --accent-bg: #EBF5EF;
  --text: #1A1915;
  --text2: #4A4840;
  --muted: #8A8880;
  --muted2: #B5B3AE;
  --green: #2D9D5C;
  --green-bg: #EBF5EF;
  --amber: #C47A1E;
  --amber-bg: #FDF3E3;
  --blue: #1B5FAA;
  --blue-bg: #EBF2FB;
  --red: #C0392B;
  --red-bg: #FDECEA;
  --code-bg: #F7F6F3;
  --code-border: #E5E4DF;
  --py-yellow: #F0C040;
  --py-blue: #2B7CC1;
  --shadow-sm: 0 1px 3px rgba(26,25,21,0.06), 0 1px 2px rgba(26,25,21,0.04);
  --shadow-md: 0 4px 12px rgba(26,25,21,0.08), 0 2px 4px rgba(26,25,21,0.04);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
  z-index: 10;
}

.logo { display: flex; align-items: center; gap: 10px; }

.logo-icon {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--py-blue) 0%, var(--py-yellow) 100%);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 11px; font-weight: 500; color: white;
  letter-spacing: -0.03em;
}

.logo-text {
  font-size: 15px; font-weight: 600; color: var(--text);
  letter-spacing: -0.02em;
}

.logo-sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }

.header-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }

.progress-wrap { display: flex; align-items: center; gap: 10px; }
.progress-label { font-size: 12px; color: var(--muted); }
.progress-track { width: 100px; height: 3px; background: var(--surface3); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--py-blue), var(--accent)); border-radius: 99px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }

.xp-badge {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 3px 12px; font-size: 12px;
  color: var(--text2); font-weight: 500;
}

/* ── MAIN LAYOUT ── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width: 56px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  padding: 14px 0; gap: 4px; flex-shrink: 0;
}

.nav-btn {
  width: 40px; height: 40px; border-radius: 10px; border: none;
  background: transparent; color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; transition: all 0.15s; position: relative;
}

.nav-btn:hover { background: var(--surface2); color: var(--text2); }
.nav-btn.active { background: var(--accent-bg); color: var(--accent); }

.nav-btn.active::before {
  content: ''; position: absolute; left: 0; top: 50%;
  transform: translateY(-50%); width: 2px; height: 20px;
  background: var(--accent); border-radius: 0 2px 2px 0;
}

/* ── LESSONS PANEL ── */
.lessons-panel {
  width: 300px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}

.panel-header {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}

.panel-title { font-size: 12px; font-weight: 600; color: var(--text); text-transform: uppercase; letter-spacing: 0.07em; }
.done-count { font-size: 11px; color: var(--green); font-weight: 500; }

.search-wrap { padding: 10px 14px; border-bottom: 1px solid var(--border); }

.search-box {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 11px; display: flex; align-items: center; gap: 7px;
  transition: border-color 0.15s;
}

.search-box:focus-within { border-color: var(--border2); }

.search-box input {
  background: transparent; border: none; outline: none;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; width: 100%;
}

.search-box input::placeholder { color: var(--muted2); }

.lesson-list { flex: 1; overflow-y: auto; padding: 8px 8px; }
.lesson-list::-webkit-scrollbar { width: 3px; }
.lesson-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

.chapter-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.09em; color: var(--muted2); padding: 14px 10px 5px;
}

.lesson-item {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px;
  border-radius: 8px; cursor: pointer; transition: all 0.12s; border: 1px solid transparent;
  margin-bottom: 1px;
}

.lesson-item:hover { background: var(--surface2); }
.lesson-item.active { background: var(--accent-bg); border-color: rgba(45,157,92,0.25); }

.lesson-num {
  width: 20px; height: 20px; border-radius: 5px;
  background: var(--surface2); border: 1px solid var(--border);
  font-size: 9px; font-family: 'DM Mono', monospace;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: var(--muted); transition: all 0.12s;
}

.lesson-item.active .lesson-num { background: var(--accent); border-color: var(--accent); color: white; }
.lesson-item.done .lesson-num { background: var(--green-bg); border-color: var(--green); color: var(--green); font-size: 10px; }

.lesson-title { font-size: 13px; color: var(--text2); line-height: 1.35; font-weight: 400; }
.lesson-item.active .lesson-title { color: var(--accent); font-weight: 500; }
.lesson-item.done .lesson-title { color: var(--text); }

/* ── CONTENT AREA ── */
.content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

.lesson-content { flex: 1; overflow-y: auto; padding: 36px 48px 48px; max-width: 780px; width: 100%; margin: 0 auto; }
.lesson-content::-webkit-scrollbar { width: 3px; }
.lesson-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

/* ── LESSON TYPOGRAPHY ── */
.lesson-header { margin-bottom: 32px; }

.lesson-meta {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
}

.lesson-tag {
  font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace;
  background: var(--surface2); border: 1px solid var(--border);
  padding: 2px 8px; border-radius: 4px;
}

.lesson-h1 {
  font-family: 'Instrument Serif', serif;
  font-size: 30px; color: var(--text); margin-bottom: 6px;
  line-height: 1.25; letter-spacing: -0.02em;
  font-weight: 400;
}

.lesson-subtitle { font-size: 15px; color: var(--muted); line-height: 1.5; font-weight: 300; }

/* ── INFO BLOCKS ── */
.info-block {
  display: flex; gap: 12px; padding: 14px 16px; border-radius: 10px;
  margin: 20px 0; font-size: 14px; line-height: 1.7; border-left: 3px solid;
}

.info-block.concept {
  background: var(--blue-bg); border-color: var(--blue); color: #1B4C8A;
}
.info-block.tip {
  background: var(--green-bg); border-color: var(--green); color: #1A5C38;
}
.info-block.warn {
  background: var(--amber-bg); border-color: var(--amber); color: #8A4A0A;
}
.info-block.info {
  background: var(--surface2); border-color: var(--border2); color: var(--text2);
}

.info-icon { font-size: 15px; flex-shrink: 0; margin-top: 2px; line-height: 1.7; }

/* ── KEY CONCEPT BOX ── */
.key-concept {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px 24px; margin: 20px 0;
  box-shadow: var(--shadow-sm);
}

.kc-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.kc-badge { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--blue); background: var(--blue-bg); padding: 2px 8px; border-radius: 4px; }

/* ── PROSE ── */
.prose { font-size: 15px; line-height: 1.8; color: var(--text2); margin-bottom: 16px; }
.prose strong { color: var(--text); font-weight: 600; }
.prose code {
  font-family: 'DM Mono', monospace; font-size: 13px;
  background: var(--surface3); color: var(--accent);
  padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border);
}

/* ── CONCEPT GRID ── */
.concept-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0; }

.concept-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
  box-shadow: var(--shadow-sm);
}

.cc-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--muted); margin-bottom: 6px; font-weight: 600;
}

.cc-value {
  font-family: 'DM Mono', monospace; font-size: 14px;
  color: var(--accent); margin-bottom: 4px; font-weight: 500;
}

.cc-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }

/* ── SECTION TITLE ── */
.section-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted);
  font-weight: 600; margin: 28px 0 12px; display: flex; align-items: center; gap: 10px;
}

.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── CODE BLOCK ── */
.code-block {
  background: var(--code-bg); border: 1px solid var(--code-border);
  border-radius: 12px; margin: 20px 0; overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.code-header {
  display: flex; align-items: center; padding: 10px 16px;
  background: var(--surface); border-bottom: 1px solid var(--border); gap: 8px;
}

.code-dots { display: flex; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-r { background: #FF6059; }
.dot-y { background: #FFBE2E; }
.dot-g { background: #28C840; }

.code-fname {
  font-family: 'DM Mono', monospace; font-size: 11px;
  color: var(--muted); margin-left: 4px;
}

.code-lang {
  margin-left: auto; font-size: 10px; color: var(--muted2);
  font-family: 'DM Mono', monospace; text-transform: uppercase;
  letter-spacing: 0.06em; background: var(--surface2);
  padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border);
}

.code-copy {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  font-size: 11px; padding: 3px 9px; border-radius: 5px; cursor: pointer;
  font-family: 'DM Sans', sans-serif; transition: all 0.15s; margin-left: 6px;
}
.code-copy:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }

.code-body {
  padding: 20px 24px; font-family: 'DM Mono', monospace;
  font-size: 13px; line-height: 1.75; overflow-x: auto;
  color: #2C2B28; white-space: pre;
}

/* Syntax highlighting for light theme */
.kw { color: #8B00A3; font-weight: 500; }
.ty { color: #0550AE; }
.st { color: #1A6A30; }
.cm { color: #9BA0A8; font-style: italic; }
.nm { color: #C24E09; }
.fn { color: #6F3FA0; }
.bi { color: #0369A1; font-weight: 500; }
.op { color: #6B7280; }

/* ── QUIZ ── */
.quiz-block {
  border: 1px solid var(--border); border-radius: 12px; padding: 20px;
  margin: 20px 0; background: var(--surface); box-shadow: var(--shadow-sm);
}

.quiz-header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.quiz-badge { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--amber); background: var(--amber-bg); padding: 2px 8px; border-radius: 4px; }
.quiz-q { font-size: 14px; font-weight: 500; color: var(--text); }

.quiz-opts { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }

.quiz-opt {
  padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface2); cursor: pointer;
  font-size: 13px; color: var(--text2); transition: all 0.15s;
  text-align: left; font-family: 'DM Sans', sans-serif; width: 100%;
  display: flex; align-items: center; gap: 10px;
}

.quiz-opt:hover { border-color: var(--accent2); color: var(--accent); background: var(--accent-bg); }
.quiz-opt.correct { border-color: var(--green); background: var(--green-bg); color: var(--accent); }
.quiz-opt.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); }

.quiz-opt-letter {
  width: 22px; height: 22px; border-radius: 50%; background: var(--surface3);
  border: 1px solid var(--border); font-size: 11px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: var(--muted); font-family: 'DM Mono', monospace;
}

.quiz-opt.correct .quiz-opt-letter { background: var(--green); border-color: var(--green); color: white; }
.quiz-opt.wrong .quiz-opt-letter { background: var(--red); border-color: var(--red); color: white; }

.quiz-feedback {
  margin-top: 12px; font-size: 13px; display: none;
  padding: 10px 14px; border-radius: 8px; line-height: 1.6;
}

.quiz-feedback.correct { background: var(--green-bg); color: #1A5C38; border: 1px solid rgba(45,157,92,0.25); }
.quiz-feedback.wrong { background: var(--red-bg); color: var(--red); border: 1px solid rgba(192,57,43,0.25); }

/* ── LESSON NAV ── */
.lesson-nav {
  display: flex; align-items: center; gap: 10px;
  margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border);
}

.nav-btn-l {
  padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text2); font-family: 'DM Sans', sans-serif;
  font-size: 13px; cursor: pointer; transition: all 0.15s; font-weight: 500;
}
.nav-btn-l:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }

.nav-btn-primary {
  padding: 9px 20px; border-radius: 8px; border: 1px solid var(--accent);
  background: var(--accent); color: white; font-family: 'DM Sans', sans-serif;
  font-size: 13px; cursor: pointer; transition: all 0.15s; font-weight: 500;
  margin-left: auto;
}
.nav-btn-primary:hover { background: #145C33; border-color: #145C33; }

.done-btn-nav {
  padding: 9px 16px; border-radius: 8px; background: var(--green-bg);
  border: 1px solid rgba(45,157,92,0.3); color: var(--green);
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px;
}
.done-btn-nav:hover { background: rgba(45,157,92,0.2); }

/* ── EDITOR PANEL ── */
.editor-panel {
  width: 400px; background: var(--surface); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}

.editor-header {
  padding: 0 16px; border-bottom: 1px solid var(--border); height: 46px;
  display: flex; align-items: center; gap: 0;
}

.editor-tabs { display: flex; gap: 0; height: 100%; }

.etab {
  padding: 0 14px; font-size: 12px; font-weight: 500; cursor: pointer;
  color: var(--muted); transition: all 0.15s; border: none; background: transparent;
  font-family: 'DM Sans', sans-serif; border-bottom: 2px solid transparent;
  display: flex; align-items: center;
}
.etab:hover { color: var(--text2); }
.etab.active { color: var(--accent); border-bottom-color: var(--accent); }

.run-btn {
  margin-left: auto; padding: 6px 14px; background: var(--accent); color: white;
  border: none; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer;
  font-family: 'DM Sans', sans-serif; display: flex; align-items: center; gap: 5px;
  transition: background 0.15s; letter-spacing: 0.01em;
}
.run-btn:hover { background: #145C33; }

.editor-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.tab-pane { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.tab-pane.active { display: flex; }

textarea#code-editor {
  flex: 1; background: var(--code-bg); border: none;
  border-bottom: 1px solid var(--border); color: #2C2B28;
  font-family: 'DM Mono', monospace; font-size: 13px;
  padding: 18px 20px; resize: none; outline: none; line-height: 1.75; tab-size: 4;
}

.output-box {
  background: var(--code-bg); flex: 1; overflow: auto; padding: 18px 20px;
  font-family: 'DM Mono', monospace; font-size: 13px;
  line-height: 1.75; color: var(--accent); border-bottom: 1px solid var(--border);
}
.output-box.empty { color: var(--muted2); font-style: italic; }

/* ── AI PANEL ── */
.ai-pane { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.ai-pane.active { display: flex; }

.ai-messages {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.ai-messages::-webkit-scrollbar { width: 3px; }
.ai-messages::-webkit-scrollbar-thumb { background: var(--border); }

.msg { padding: 11px 14px; border-radius: 10px; font-size: 13px; line-height: 1.65; max-width: 96%; }

.msg.user {
  background: var(--accent-bg); border: 1px solid rgba(45,157,92,0.25);
  color: #1A5C38; align-self: flex-end;
}

.msg.ai {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text2); align-self: flex-start; box-shadow: var(--shadow-sm);
}

.msg.ai code {
  font-family: 'DM Mono', monospace; background: var(--surface2);
  border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px;
  font-size: 12px; color: var(--accent);
}

.typing-indicator {
  display: none; align-items: center; gap: 4px;
  padding: 10px 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; width: fit-content; box-shadow: var(--shadow-sm);
}
.typing-indicator span {
  width: 5px; height: 5px; background: var(--muted2); border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-4px); opacity: 1; }
}

.ai-input-row {
  padding: 12px 14px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: flex-end;
}

.ai-input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  outline: none; resize: none; line-height: 1.5;
  min-height: 38px; max-height: 100px; transition: border 0.15s;
}
.ai-input:focus { border-color: var(--border2); }
.ai-input::placeholder { color: var(--muted2); }

.send-btn {
  width: 34px; height: 34px; border-radius: 8px; background: var(--accent);
  border: none; color: white; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s; flex-shrink: 0;
}
.send-btn:hover { background: #145C33; }

/* ── WHAT YOU'LL LEARN BOX ── */
.learn-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 20px; margin: 20px 0;
  box-shadow: var(--shadow-sm);
}

.learn-box-title {
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--text); margin-bottom: 12px;
  display: flex; align-items: center; gap: 7px;
}

.learn-item {
  display: flex; align-items: flex-start; gap: 9px;
  font-size: 13px; color: var(--text2); line-height: 1.5; margin-bottom: 7px;
}

.learn-dot {
  width: 18px; height: 18px; border-radius: 50%; background: var(--accent-bg);
  border: 1px solid rgba(45,157,92,0.3); color: var(--accent); font-size: 9px;

// ─── STATE ─────────────────────────────────────
let currentLesson = 0;
let completedLessons = new Set();
let xp = 0;

// ─── BUILD LIST ────────────────────────────────
function buildLessonList() {
  const container = document.getElementById('lesson-list');
  let lastChapter = '';
  let html = '';
  lessonsFull.forEach((lesson, i) => {
    if (lesson.chapter !== lastChapter) {
      html += `<div class="chapter-label">${lesson.chapter}</div>`;
      lastChapter = lesson.chapter;
    }
    const done = completedLessons.has(i) ? 'done' : '';
    const active = i === currentLesson ? 'active' : '';
    const num = completedLessons.has(i) ? '✓' : (i + 1);
    html += `<div class="lesson-item ${active} ${done}" onclick="goToLesson(${i})" id="li-${i}">
      <div class="lesson-num">${num}</div>
      <div class="lesson-title">${lesson.title}</div>
    </div>`;
  });
  container.innerHTML = html;
}

// ─── RENDER LESSON ─────────────────────────────
function renderLesson(i) {
  const lesson = lessonsFull[i];
  document.getElementById('code-editor').value = lesson.code || '';

  const quizHTML = lesson.quiz ? `
    <div class="section-title">Mini Quiz</div>
    <div class="quiz-block" id="quiz-${i}">
      <div class="quiz-header">
        <span class="quiz-badge">Quiz</span>
        <span class="quiz-q">${lesson.quiz.q}</span>
      </div>
      <div class="quiz-opts">
        ${lesson.quiz.opts.map((opt, j) =>
          `<button class="quiz-opt" onclick="checkQuiz(${i},${j})">
            <span class="quiz-opt-letter">${LETTERS[j]}</span>${opt}
          </button>`
        ).join('')}
      </div>
      <div class="quiz-feedback" id="qf-${i}"></div>
    </div>` : '';

  document.getElementById('lesson-content').innerHTML = `
    <div class="lesson-header">
      <div class="lesson-meta">
        <span class="lesson-tag">Leçon ${i + 1} / ${lessonsFull.length}</span>
        <span class="lesson-tag">${lesson.chapter}</span>
      </div>
      <h1 class="lesson-h1">${lesson.title}</h1>
      <p class="lesson-subtitle">${lesson.subtitle}</p>
    </div>
    ${lesson.content}
    <div class="section-title">Code d'exemple</div>
    <div class="code-block">
      <div class="code-header">
        <div class="code-dots">
          <div class="dot dot-r"></div>
          <div class="dot dot-y"></div>
          <div class="dot dot-g"></div>
        </div>
        <span class="code-fname">exemple_${String(i+1).padStart(2,'0')}.py</span>
        <span class="code-lang">Python 3</span>
        <button class="code-copy" onclick="copyCode(${i})" id="copy-btn-${i}">Copier</button>
      </div>
      <div class="code-body">${highlightPython(lesson.code)}</div>
    </div>
    ${quizHTML}
    <div class="lesson-nav">
      ${i > 0 ? `<button class="nav-btn-l" onclick="goToLesson(${i-1})">← Précédente</button>` : ''}
      <button class="done-btn-nav" onclick="markDone(${i})">
        ${completedLessons.has(i) ? '✓ Apprise' : '○ Marquer apprise'}
      </button>
      ${i < lessonsFull.length - 1
        ? `<button class="nav-btn-primary" onclick="goToLesson(${i+1})">Suivante →</button>`
        : `<div style="margin-left:auto;padding:9px 16px;color:var(--green);font-weight:600;font-size:14px">🎉 Cours terminé !</div>`}

  `;

}

function highlightPython(code) {
  return code
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/#[^\n]*/g, m => `<span class="cm">${m}</span>`)
    .replace(/"""[\s\S]*?"""|'''[\s\S]*?'''/g, m => `<span class="st">${m}</span>`)
    .replace(/"([^"]*)"|'([^']*)'/g, m => `<span class="st">${m}</span>`)
    .replace(/\b(def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|try|except|finally|raise|with|pass|break|continue|yield|lambda|del|global|nonlocal|async|await|match|case)\b/g, m => `<span class="kw">${m}</span>`)
    .replace(/\b(int|str|float|bool|list|dict|tuple|set|None|True|False|type|len|range|print|input|super|self|open|zip|map|filter|sorted|reversed|enumerate|sum|min|max|abs|round|isinstance|issubclass|hasattr|getattr|setattr|staticmethod|classmethod|property)\b/g, m => `<span class="bi">${m}</span>`)
    .replace(/\b(\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?)\b/g, m => `<span class="nm">${m}</span>`);
}

function goToLesson(i) {
  currentLesson = i;
  renderLesson(i);
  buildLessonList();
  setTimeout(() => {
    document.getElementById(`li-${i}`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 50);
}

function markDone(i) {
  if (!completedLessons.has(i)) {
    completedLessons.add(i);
    xp += 20;
    document.getElementById('xp-badge').textContent = `✦ ${xp} XP`;
    updateProgress();
    buildLessonList();
    renderLesson(i);
  }
}

function updateProgress() {
  const n = completedLessons.size;
  const pct = (n / lessonsFull.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${n} / ${lessonsFull.length}`;
  document.getElementById('done-count').textContent = `${n} / ${lessonsFull.length} faites`;
}

function copyCode(i) {
  navigator.clipboard.writeText(lessonsFull[i].code).then(() => {
    const btn = document.getElementById(`copy-btn-${i}`);
    if (btn) { btn.textContent = 'Copié !'; setTimeout(() => btn.textContent = 'Copier', 1500); }
  });
}

function checkQuiz(li, oi) {
  const q = lessonsFull[li].quiz;
  const block = document.getElementById(`quiz-${li}`);
  const feedback = document.getElementById(`qf-${li}`);
  const btns = block.querySelectorAll('.quiz-opt');
  btns.forEach(b => b.disabled = true);
  btns[oi].classList.add(oi === q.ans ? 'correct' : 'wrong');
  if (oi !== q.ans) btns[q.ans].classList.add('correct');
  feedback.style.display = 'block';
  feedback.textContent = q.exp;
  feedback.className = `quiz-feedback ${oi === q.ans ? 'correct' : 'wrong'}`;
  if (oi === q.ans) { xp += 10; document.getElementById('xp-badge').textContent = `✦ ${xp} XP`; }
}

function filterLessons() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const items = document.querySelectorAll('.lesson-item');
  const labels = document.querySelectorAll('.chapter-label');
  items.forEach((el, i) => {
    el.style.display = !q || lessonsFull[i].title.toLowerCase().includes(q) ? '' : 'none';
  });
  labels.forEach(el => el.style.display = q ? 'none' : '');
}

function showCode() {
  const code = document.getElementById('code-editor').value;
  const out = document.getElementById('output-box');
  out.className = 'output-box';
  out.innerHTML = `<div style="color:var(--muted);font-size:11px;margin-bottom:12px;font-family:'DM Sans',sans-serif"># Votre code Python</div>` + highlightPython(code);
  switchEditorTab('output', null);
}

function switchEditorTab(tab, clickedBtn) {
  document.querySelectorAll('.tab-pane, .ai-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.etab').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  if (clickedBtn) clickedBtn.classList.add('active');
  else {
    document.querySelectorAll('.etab').forEach(b => {
      const txt = b.textContent.toLowerCase();
      if (tab === 'code' && txt.includes('édit')) b.classList.add('active');
      if (tab === 'output' && txt.includes('sort')) b.classList.add('active');
      if (tab === 'ai' && txt.includes('ia')) b.classList.add('active');
    });
  }
}

async function sendAI() {
  const input = document.getElementById('ai-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  const lesson = lessonsFull[currentLesson];
  appendMsg(msg, 'user');
  document.getElementById('typing').style.display = 'flex';
  switchEditorTab('ai', null);

  const sys = `Tu es un tuteur expert Python, patient et pédagogique. Réponds toujours en français. L'apprenant est à la leçon "${lesson.title}" (${lesson.subtitle}). 
  
  Style : clair, concis, structuré. Utilise des exemples courts. Si code : montre le résultat. Longueur : 3-6 paragraphes maximum. Utilise du markdown léger (backticks pour le code).`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: sys,
        messages: [{ role: 'user', content: msg }]
      })
    });
    const data = await res.json();
    const reply = data.content?.map(c => c.text || '').join('') || "Désolé, erreur de réponse.";
    document.getElementById('typing').style.display = 'none';
    appendMsg(reply, 'ai');
  } catch {
    document.getElementById('typing').style.display = 'none';
    appendMsg("Erreur de connexion à l'API. Vérifiez votre connexion internet.", 'ai');
  }
}

function appendMsg(text, role) {
  const c = document.getElementById('ai-messages');
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  d.innerHTML = text
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

function handleAiKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAI(); }
}

function setNavTab(e) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  e.currentTarget.classList.add('active');
}
