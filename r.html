<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sencode — Éditeur en ligne</title>
<style>
  * { box-sizing: border-box; }

  body{
    margin:0;
    background:#fafafa;
    color:#1a1a1a;
    font-family: Arial, Helvetica, sans-serif;
  }

  .container{
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  .section-heading{
    margin-bottom: 24px;
  }

  .eyebrow{
    color:#d4a017;
    font-size: 14px;
    font-weight: 600;
  }

  .section-heading h2{
    font-size: 28px;
    margin: 8px 0;
  }

  .section-heading p{
    color:#555;
    font-size: 15px;
    margin: 0;
  }

  /* --- éditeur --- */

  .code-editor{
    background:#fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
  }

  .editor-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 16px;
    background:#f0f0f0;
    border-bottom: 1px solid #ddd;
  }

  .dot{
    display:inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background:#ccc;
    margin-right: 5px;
  }

  .btn{
    font-size: 14px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }

  .btn-primary{
    background:#d4a017;
    color:#fff;
  }
  .btn-primary:hover{ background:#c2910f; }

  .editor-body{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
  }

  .code-panel{
    border-right: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
    display:flex;
    flex-direction:column;
  }
  .code-panel:last-child{ border-right:none; }

  .code-title{
    font-size: 12px;
    font-weight: 600;
    color:#666;
    padding: 8px 12px;
    background:#f7f7f7;
    border-bottom: 1px solid #ddd;
  }

  .code-panel textarea{
    flex:1;
    min-height: 160px;
    resize: vertical;
    border: none;
    outline: none;
    padding: 12px;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.5;
  }

  .preview-title{
    font-size: 12px;
    font-weight: 600;
    color:#666;
    padding: 8px 12px;
    background:#f7f7f7;
    border-bottom: 1px solid #ddd;
  }

  #preview{
    width: 100%;
    height: 260px;
    border: none;
    display: block;
  }

  @media (max-width: 700px){
    .editor-body{ grid-template-columns: 1fr; }
    .code-panel{ border-right:none; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="section-heading">
    <span class="eyebrow">Éditeur en ligne</span>
    <h2>Écris et teste ton code</h2>
    <p>Modifie le code ci-dessous et clique sur Exécuter pour voir le résultat.</p>
  </div>

  <div class="code-editor">

    <div class="editor-toolbar">
      <div>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <button onclick="runCode()" class="btn btn-primary">▶ Exécuter</button>
    </div>

    <div class="editor-body">

      <div class="code-panel">
        <div class="code-title">HTML</div>
        <textarea id="htmlCode">&lt;h1&gt;Bonjour Sencode 👋&lt;/h1&gt;
&lt;p&gt;Ma première page web.&lt;/p&gt;</textarea>
      </div>

      <div class="code-panel">
        <div class="code-title">CSS</div>
        <textarea id="cssCode">body {
  font-family: Arial;
  text-align: center;
}

h1 {
  color: #d4a017;
}</textarea>
      </div>

      <div class="code-panel">
        <div class="code-title">JavaScript</div>
        <textarea id="jsCode">console.log("Bienvenue sur Sencode !");</textarea>
      </div>

    </div>

    <div class="preview-title">Aperçu</div>
    <iframe id="preview"></iframe>

  </div>

</div>

<script>
  function runCode(){
    const html = document.getElementById('htmlCode').value;
    const css  = document.getElementById('cssCode').value;
    const js   = document.getElementById('jsCode').value;

    const doc = `<!DOCTYPE html>
<html>
<head><style>${css}</style></head>
<body>
${html}
<script>
  try { ${js} } catch(e) { console.log('Erreur :', e.message); }
<\/script>
</body>
</html>`;

    document.getElementById('preview').srcdoc = doc;
  }

  runCode();
</script>

</body>
</html>
