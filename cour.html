<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprendre HTML — 50 Leçons Complètes | HTML.cours</title>
<meta name="description" content="Apprenez le HTML de zéro avec 50 leçons progressives. Titres, liens, formulaires, balises sémantiques — exercices pratiques inclus avec playground interactif.">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7220960902615393"
     crossorigin="anonymous"></script>
<style>

:root {
  --bg: #fafaf8;
  --bg2: #f4f3ef;
  --surface: #ffffff;
  --surface2: #f8f7f4;
  --border: #e8e5de;
  --border2: #d6d2c8;
  --accent: #1a6b3c;
  --accent-light: #e8f5ee;
  --accent-mid: #2d9e5c;
  --accent2: #1a4b8c;
  --accent2-light: #e8f0fc;
  --text: #1c1a16;
  --text2: #4a4640;
  --text3: #8a8278;
  --green: #2d9e5c;
  --red: #c0392b;
  --red-light: #fdf2f2;
  --yellow: #f5a623;
  --yellow-light: #fef9ec;
  --code-bg: #1e1c18;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.06);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ─── HEADER ─── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  box-shadow: 0 1px 0 var(--border);
}

.logo {
  font-family: 'Fraunces', serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
}

.logo-dot { color: var(--accent-mid); }

.logo-badge {
  background: var(--accent);
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.8px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.progress-bar-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  color: var(--text3);
  font-weight: 500;
}

.progress-bar {
  width: 140px;
  height: 5px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-mid), #4ade80);
  border-radius: 99px;
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  width: 0%;
}

.progress-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  font-weight: 600;
}

/* ─── LAYOUT ─── */
.workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ─── SIDEBAR ─── */
.sidebar {
  width: 230px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  padding: 8px 0 20px;
}

.sidebar::-webkit-scrollbar { width: 3px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.sidebar-section {
  padding: 16px 16px 5px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 1.4px;
  color: var(--text3);
  text-transform: uppercase;
  font-family: 'DM Sans', sans-serif;
}

.sidebar-section:first-child { padding-top: 10px; }

.sidebar-item {
  padding: 7px 16px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 9px;
  border-left: 2px solid transparent;
  transition: all 0.12s;
  margin: 1px 0;
}

.sidebar-item:hover { color: var(--text); background: var(--bg2); }
.sidebar-item.active {
  color: var(--accent);
  border-left-color: var(--accent-mid);
  background: var(--accent-light);
  font-weight: 600;
}
.sidebar-item.done .num {
  background: var(--accent);
  color: #fff;
}

.num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  background: var(--bg2);
  color: var(--text3);
  padding: 1px 5px;
  border-radius: 4px;
  flex-shrink: 0;
  min-width: 28px;
  text-align: center;
  border: 1px solid var(--border);
  transition: all 0.12s;
}

.sidebar-item.active .num {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* ─── LESSON PANEL ─── */
.lesson-panel {
  flex: 1;
  overflow-y: auto;
  padding: 0;
  background: var(--bg);
}

.lesson-panel::-webkit-scrollbar { width: 4px; }
.lesson-panel::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.lesson-inner {
  padding: 32px 40px 40px;
  max-width: 660px;
}

/* ─── LESSON META BAR ─── */
.lesson-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.lesson-number {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--accent-mid);
  letter-spacing: 1.2px;
  text-transform: uppercase;
  background: var(--accent-light);
  padding: 3px 9px;
  border-radius: 4px;
  font-weight: 600;
}

.lesson-category-badge {
  font-size: 11px;
  color: var(--text3);
  background: var(--bg2);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 500;
}

.lesson-difficulty {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
}
.diff-debutant { background: #e8f5ee; color: #1a6b3c; }
.diff-intermediaire { background: #fff8e8; color: #92600a; }
.diff-avance { background: #fdf2f2; color: #c0392b; }

.lesson-title {
  font-family: 'Fraunces', serif;
  font-size: 30px;
  font-weight: 900;
  line-height: 1.15;
  margin-bottom: 6px;
  letter-spacing: -0.8px;
  color: var(--text);
}

.lesson-subtitle {
  font-size: 14.5px;
  color: var(--text3);
  margin-bottom: 22px;
  line-height: 1.5;
}

/* ─── OBJECTIFS ─── */
.lesson-objectives {
  background: var(--accent-light);
  border: 1px solid #b6e4cc;
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 18px;
}

.lesson-objectives-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.lesson-objectives ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.lesson-objectives li {
  font-size: 13px;
  color: var(--accent);
  display: flex;
  align-items: flex-start;
  gap: 7px;
  line-height: 1.4;
}

.lesson-objectives li::before {
  content: "✓";
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 1px;
}

/* ─── DESC ─── */
.lesson-desc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 22px;
  margin-bottom: 20px;
  line-height: 1.85;
  color: var(--text);
  font-size: 14.5px;
  box-shadow: var(--shadow);
}

.lesson-desc p { margin-bottom: 12px; }
.lesson-desc p:last-child { margin-bottom: 0; }
.lesson-desc strong { color: var(--text); font-weight: 700; }

.lesson-desc code {
  background: var(--bg2);
  color: var(--accent2);
  padding: 1px 6px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  border: 1px solid var(--border);
}

.lesson-desc .tip {
  background: var(--yellow-light);
  border-left: 3px solid var(--yellow);
  padding: 11px 14px;
  border-radius: 0 8px 8px 0;
  margin-top: 14px;
  font-size: 13.5px;
  color: #7a5c00;
  line-height: 1.6;
}

.lesson-desc .warning {
  background: var(--red-light);
  border-left: 3px solid var(--red);
  padding: 11px 14px;
  border-radius: 0 8px 8px 0;
  margin-top: 14px;
  font-size: 13.5px;
  color: #8b2019;
  line-height: 1.6;
}

/* ─── SYNTAX TABLE ─── */
.syntax-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 20px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.syntax-box-header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 9px 16px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  letter-spacing: 0.8px;
  text-transform: uppercase;
}

.syntax-table {
  width: 100%;
  border-collapse: collapse;
}

.syntax-table td {
  padding: 9px 16px;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  line-height: 1.5;
}

.syntax-table tr:last-child td { border-bottom: none; }
.syntax-table td:first-child {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--accent2);
  white-space: nowrap;
  width: 200px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
}

.syntax-table td:last-child { color: var(--text2); }

/* ─── CODE BLOCK ─── */
.code-block {
  background: var(--code-bg);
  border-radius: 12px;
  margin-bottom: 20px;
  overflow: hidden;
  box-shadow: var(--shadow-md);
}

.code-header {
  background: #2a2820;
  border-bottom: 1px solid #3a3830;
  padding: 9px 16px;
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  color: #8a8278;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.code-dots { display: flex; gap: 5px; }
.code-dot { width: 10px; height: 10px; border-radius: 50%; }
.code-dot.r { background: #ff5f56; }
.code-dot.y { background: #ffbd2e; }
.code-dot.g { background: #27c93f; }
.code-filename { color: #aaa8a0; }

.try-btn {
  background: rgba(45,158,92,0.2);
  color: #4ade80;
  border: 1px solid rgba(45,158,92,0.3);
  padding: 4px 12px;
  border-radius: 5px;
  font-size: 11px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  transition: all 0.12s;
}

.try-btn:hover { background: rgba(45,158,92,0.35); }

.code-block pre {
  padding: 18px 20px;
  line-height: 1.75;
  color: #d4d0c8;
  overflow-x: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
}

.tag { color: #7cb8ff; }
.attr { color: #e6c56a; }
.val  { color: #a8e6a0; }
.cmt  { color: #5a5850; font-style: italic; }
.str  { color: #a8e6a0; }

/* ─── KEY POINTS ─── */
.key-points {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.key-points-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.key-points-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.key-point-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  color: var(--text2);
  line-height: 1.4;
}

.key-point-item strong {
  display: block;
  color: var(--text);
  font-weight: 600;
  margin-bottom: 2px;
  font-size: 12.5px;
}

/* ─── NAV ─── */
.nav-buttons {
  display: flex;
  gap: 10px;
  margin-top: 4px;
  align-items: center;
}

.nav-btn {
  padding: 10px 22px;
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  font-family: 'DM Sans', sans-serif;
}

.nav-btn.prev {
  background: var(--surface);
  color: var(--text2);
  border: 1px solid var(--border2);
  box-shadow: var(--shadow);
}
.nav-btn.prev:hover { background: var(--bg2); color: var(--text); }

.nav-btn.next {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(26,107,60,0.3);
}
.nav-btn.next:hover { background: var(--accent-mid); transform: translateY(-1px); }

.nav-lesson-title {
  font-size: 12px;
  color: var(--text3);
  margin-left: auto;
  font-style: italic;
  max-width: 200px;
  text-overflow: ellipsis;
  overflow: hidden;
  white-space: nowrap;
}

/* ─── EDITOR ─── */
.editor-panel {
  width: 390px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--surface);
}

.editor-topbar {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg2);
}

.editor-topbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.editor-topbar-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  color: var(--text3);
}

.editor-badge {
  font-size: 10px;
  background: #fff8e8;
  color: #92600a;
  border: 1px solid #f5d98a;
  padding: 1px 7px;
  border-radius: 4px;
  font-weight: 600;
}

.run-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 6px 16px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 5px;
  box-shadow: 0 1px 4px rgba(26,107,60,0.3);
}

.run-btn:hover { background: var(--accent-mid); transform: translateY(-1px); }

textarea#editor {
  flex: 1;
  background: #1e1c18;
  color: #d4d0c8;
  border: none;
  border-bottom: 1px solid var(--border);
  padding: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  line-height: 1.7;
  resize: none;
  outline: none;
  min-height: 200px;
  max-height: 280px;
}

.output-label {
  padding: 7px 14px;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text3);
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.8px;
  background: var(--bg2);
  display: flex;
  align-items: center;
  gap: 6px;
}

.output-dot {
  width: 6px;
  height: 6px;
  background: #2d9e5c;
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

iframe#result {
  flex: 1;
  border: none;
  background: white;
}

/* ─── SCROLLBARS ─── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ─── RESPONSIVE ─── */
@media(max-width:960px){
  .sidebar { display: none; }
  .workspace { flex-direction: column; overflow: auto; height: auto; }
  body { overflow: auto; height: auto; }
  .lesson-inner { padding: 20px; max-width: 100%; }
  .editor-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); }
  textarea#editor { max-height: 180px; }
  .key-points-grid { grid-template-columns: 1fr; }
  .lesson-title { font-size: 24px; }
}

</style>
</head>
<body>

<header>
  <div class="logo">
    <span>HTML<span class="logo-dot">.</span>cours</span>
    <span class="logo-badge">50 LEÇONS</span>
  </div>
  <div class="header-right">
    <div class="progress-bar-wrap">
      <span id="progress-text">0 / 50 leçons</span>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-pct" id="progress-pct">0%</span>
    </div>
  </div>
</header>

<div class="workspace">
  <div class="sidebar" id="sidebar"></div>
  <div class="lesson-panel" id="lesson-panel"><div class="lesson-inner" id="lesson-inner"></div></div>
  <div class="editor-panel">
    <div class="editor-topbar">
      <div class="editor-topbar-left">
        <span class="editor-topbar-title">playground.html</span>
        <span class="editor-badge">✎ Modifiable</span>
      </div>
      <button class="run-btn" onclick="runCode()">▶ Exécuter</button>
    </div>
    <textarea id="editor" spellcheck="false"><h1>Bonjour !</h1>
<p>Bienvenue dans le <strong>playground HTML</strong>.</p>
<p>Modifiez ce code et cliquez sur <em>Exécuter</em>.</p>
<button>Cliquez ici</button></textarea>
    <div class="output-label"><span class="output-dot"></span> RÉSULTAT EN DIRECT</div>
    <iframe id="result"></iframe>
  </div>
</div>

<script>

/* ════════════════════════════════════════════
   DONNÉES DES LEÇONS
═══════════════════════════════════════════════ */
const lessons = [
  {
    title: "Les Titres h1 à h6",
    subtitle: "Structurez vos pages avec une hiérarchie visuelle claire",
    category: "Texte & Structure",
    difficulty: "debutant",
    objectives: [
      "Connaître les 6 niveaux de titres HTML",
      "Comprendre la hiérarchie sémantique des titres",
      "Appliquer la bonne pratique : un seul h1 par page",
      "Distinguer mise en page visuelle et rôle SEO"
    ],
    syntaxItems: [
      { tag: "<h1>Titre</h1>", desc: "Titre principal — le plus important, un seul par page" },
      { tag: "<h2>Titre</h2>", desc: "Titre de section importante" },
      { tag: "<h3>Titre</h3>", desc: "Sous-section d'un h2" },
      { tag: "<h4> à <h6>", desc: "Niveaux de sous-sections plus profonds" }
    ],
    desc: `
      <p>HTML propose <strong>six niveaux de titres</strong>, de <code>&lt;h1&gt;</code> à <code>&lt;h6&gt;</code>. Le <code>&lt;h1&gt;</code> est le titre principal — le plus grand et le plus important de la page. Le <code>&lt;h6&gt;</code> est le plus petit.</p>
      <p>Les titres jouent un double rôle : la <strong>mise en page visuelle</strong> (hiérarchie du contenu visible par le lecteur) et le <strong>référencement SEO</strong> (Google lit vos titres pour comprendre le sujet de la page et décider de son classement).</p>
      <p>Bonne pratique : utilisez <strong>un seul h1 par page</strong> pour le titre principal, des <code>&lt;h2&gt;</code> pour les sections, des <code>&lt;h3&gt;</code> pour les sous-sections, et ainsi de suite — comme les chapitres d'un livre.</p>
      <div class="tip">💡 <strong>Astuce importante :</strong> N'utilisez pas les titres uniquement pour leur taille visuelle — pour ça, utilisez CSS. Choisissez le niveau selon la hiérarchie logique du contenu. Un h3 dans une section h2 signifie "sous-section de", pas simplement "texte plus petit".</div>
    `,
    code: `<h1>Titre Principal (le plus grand)</h1>
<h2>Section importante</h2>
<h3>Sous-section</h3>
<h4>Détail de section</h4>
<h5>Sous-détail</h5>
<h6>Le plus petit titre</h6>`,
    keyPoints: [
      { title: "SEO & Accessibilité", desc: "Le h1 est lu en premier par Google et les lecteurs d'écran" },
      { title: "Règle d'or", desc: "Un seul h1 par page, puis h2 → h3 → h4 dans l'ordre" },
      { title: "Ne pas sauter de niveaux", desc: "Évitez h1 → h3 sans h2 intermédiaire" },
      { title: "Différence avec CSS", desc: "font-size contrôle la taille visuelle, pas la sémantique" }
    ],
    starter: `<h1>Mon Blog Tech</h1>
<h2>Articles récents</h2>
<h3>JavaScript pour débutants</h3>
<p>Un guide complet pour commencer le JavaScript.</p>

      <p>Son utilité principale est de <strong>cibler une portion de texte</strong> à l'intérieur d'un paragraphe pour lui appliquer un style CSS spécifique (colorier un mot, le mettre en valeur, changer sa police) ou pour le manipuler avec JavaScript (compter des clics, changer sa couleur dynamiquement).</p>

function buildSidebar() {
  const sb = document.getElementById("sidebar")
  sb.innerHTML = ""
  CATEGORIES.forEach(cat => {
    const sec = document.createElement("div")
    sec.className = "sidebar-section"
    sec.textContent = cat.label
    sb.appendChild(sec)
    for (let i = cat.range[0]; i <= cat.range[1] && i < lessons.length; i++) {
      const item = document.createElement("div")
      item.className = "sidebar-item" + (i === currentLesson ? " active" : "") + (doneLessons.has(i) ? " done" : "")
      item.dataset.idx = i
      const title = lessons[i].title.replace(/🎓 /,"")
      item.innerHTML = `<span class="num">${String(i+1).padStart(2,"0")}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${title}</span>`
      item.addEventListener("click", () => goTo(i))
      sb.appendChild(item)
    }
  })
}

/* ════════════════════════════════════════════
   HIGHLIGHT
═══════════════════════════════════════════════ */
function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")
}

function highlightHtml(code) {
  let e = escapeHtml(code)
  e = e.replace(/&lt;!--[\s\S]*?--&gt;/g, m => `<span class="cmt">${m}</span>`)
  e = e.replace(/(&lt;\/?)([\w-]+)/g, (m,sl,tag) => `<span class="tag">${sl}${tag}</span>`)
  e = e.replace(/([\w-]+)(=)(&quot;[^&]*&quot;)/g, (m,a,eq,v) => `<span class="attr">${a}</span>${eq}<span class="val">${v}</span>`)
  e = e.replace(/\s(required|checked|disabled|multiple|open|controls|autoplay|loop|muted|selected|defer|async)(?=[>\s\/])/g, m => ` <span class="attr">${m.trim()}</span>`)
  return e
}

   RENDU LEÇON
═══════════════════════════════════════════════ */
function renderLesson() {
  const l = lessons[currentLesson]
  const inner = document.getElementById("lesson-inner")

  const diffLabel = { debutant: "Débutant", intermediaire: "Intermédiaire", avance: "Avancé" }[l.difficulty]
  const diffClass = { debutant: "diff-debutant", intermediaire: "diff-intermediaire", avance: "diff-avance" }[l.difficulty]

  // Objectifs
  const objHTML = l.objectives ? `
    <div class="lesson-objectives">
      <div class="lesson-objectives-title">🎯 Ce que vous allez apprendre</div>
      <ul>${l.objectives.map(o => `<li>${o}</li>`).join("")}</ul>
    </div>
  ` : ""

  // Syntax table
  const synHTML = l.syntaxItems ? `
    <div class="syntax-box">
      <div class="syntax-box-header">📖 Référence syntaxique</div>
      <table class="syntax-table">
        ${l.syntaxItems.map(s => `<tr><td>${escapeHtml(s.tag)}</td><td>${s.desc}</td></tr>`).join("")}
      </table>
    </div>
  ` : ""

  // Key points
  const kpHTML = l.keyPoints ? `
    <div class="key-points">
      <div class="key-points-title">💡 Points clés à retenir</div>
      <div class="key-points-grid">
        ${l.keyPoints.map(k => `<div class="key-point-item"><strong>${k.title}</strong>${k.desc}</div>`).join("")}
      </div>
    </div>
  ` : ""

  // Boutons nav
  const nextLesson = currentLesson < lessons.length - 1 ? lessons[currentLesson + 1].title.replace(/🎓 /,"") : ""
  const navHTML = `
    <div class="nav-buttons">
      ${currentLesson > 0 ? `<button class="nav-btn prev" onclick="goTo(${currentLesson-1})">← Précédent</button>` : ""}
      ${currentLesson < lessons.length-1
        ? `<button class="nav-btn next" onclick="markAndNext()">Suivant →</button>`
        : `<button class="nav-btn next" onclick="markDone()">✅ Terminer le cours</button>`}
      ${nextLesson ? `<span class="nav-lesson-title">Suivant : ${nextLesson}</span>` : ""}
    </div>
  `

  inner.innerHTML = `
    <div class="lesson-meta">
      <span class="lesson-number">Leçon ${String(currentLesson+1).padStart(2,"0")} / ${lessons.length}</span>
      <span class="lesson-category-badge">${l.category}</span>
      <span class="lesson-difficulty ${diffClass}">${diffLabel}</span>
    </div>
    <h1 class="lesson-title">${l.title}</h1>
    ${l.subtitle ? `<p class="lesson-subtitle">${l.subtitle}</p>` : ""}
    ${objHTML}
    <div class="lesson-desc">${l.desc}</div>
    ${synHTML}
    <div class="code-block">
      <div class="code-header">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="code-dots"><span class="code-dot r"></span><span class="code-dot y"></span><span class="code-dot g"></span></div>
          <span class="code-filename">exemple.html</span>
        </div>
        <button class="try-btn" onclick="loadExample()">Essayer →</button>
      </div>
      <pre>${highlightHtml(l.code)}</pre>
    </div>
    ${kpHTML}
    ${navHTML}
  `

  document.getElementById("lesson-panel").scrollTop = 0
  document.getElementById("editor").value = l.starter
  runCode()
  updateProgress()
}

/* ════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════ */
function goTo(idx) {
  currentLesson = idx
  buildSidebar()
  renderLesson()
}

function markAndNext() {
  doneLessons.add(currentLesson)
  try { localStorage.setItem("doneLessons_html2", JSON.stringify([...doneLessons])) } catch(e) {}
  goTo(currentLesson + 1)
}

function markDone() {
  doneLessons.add(currentLesson)
  try { localStorage.setItem("doneLessons_html2", JSON.stringify([...doneLessons])) } catch(e) {}
  buildSidebar()
  updateProgress()
  const btn = document.querySelector(".nav-btn.next")
  if (btn) btn.textContent = "🎓 Cours terminé !"
}

function loadExample() {
  document.getElementById("editor").value = lessons[currentLesson].code
  runCode()
}

function updateProgress() {
  const pct = Math.round(doneLessons.size / lessons.length * 100)
  document.getElementById("progress-fill").style.width = pct + "%"
  document.getElementById("progress-text").textContent = `${doneLessons.size} / ${lessons.length} leçons`
  document.getElementById("progress-pct").textContent = pct + "%"
}

/* ════════════════════════════════════════════
   PLAYGROUND
═══════════════════════════════════════════════ */
function runCode() {
  const code = document.getElementById("editor").value
  const iframe = document.getElementById("result").contentWindow.document
  iframe.open()
  iframe.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
    body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:14px;line-height:1.65;font-size:14px;color:#1c1a16}
    h1{font-size:20px;margin-bottom:10px} h2{font-size:17px;margin:14px 0 8px} h3{font-size:15px;margin:10px 0 6px}
    p{margin-bottom:8px} ul,ol{padding-left:20px;margin-bottom:8px} li{margin-bottom:4px}
    table{border-collapse:collapse;width:100%} td,th{padding:8px;border:1px solid #ddd} th{background:#f4f3ef}
    input,select,textarea,button{margin:4px 0;box-sizing:border-box}
    progress{width:100%;height:10px}
    details{border:1px solid #e8e5de;border-radius:6px;padding:10px;margin:5px 0}
    summary{cursor:pointer;font-weight:600}
    nav a{margin-right:12px} a{color:#1a6b3c}
    address{font-style:normal}
  </style></head><body>${code}</body></html>`)
  iframe.close()
}

/* ════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
buildSidebar()
renderLesson()
</script>
</body>
</html>
