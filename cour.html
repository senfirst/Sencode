<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprendre HTML — 50 Leçons</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #0b1220;
  --surface: #111827;
  --surface2: #1a2235;
  --border: #253047;
  --accent: #04AA6D;
  --accent2: #3b82f6;
  --text: #e2e8f0;
  --text-muted: #7a90b0;
  --green: #34d399;
  --red: #f87171;
  --code-bg: #070d18;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ─── HEADER ─── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-badge {
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}

.progress-bar-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--text-muted);
}

.progress-bar {
  width: 160px;
  height: 6px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width 0.4s ease;
  width: 0%;
}

/* ─── LAYOUT ─── */
.workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ─── SIDEBAR ─── */
.sidebar {
  width: 220px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  padding: 12px 0;
}

.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sidebar-section {
  padding: 8px 14px 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  color: var(--text-muted);
  text-transform: uppercase;
}

.sidebar-item {
  padding: 7px 14px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  border-left: 2px solid transparent;
  transition: all 0.15s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-item:hover { color: var(--text); background: var(--surface2); }
.sidebar-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(4,170,109,0.07); }
.sidebar-item.done .num { background: var(--green); color: #000; }

.num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  background: var(--border);
  color: var(--text-muted);
  padding: 1px 5px;
  border-radius: 3px;
  flex-shrink: 0;
  min-width: 26px;
  text-align: center;
}

/* ─── LESSON PANEL ─── */
.lesson-panel {
  flex: 1;
  overflow-y: auto;
  padding: 36px 40px;
  max-width: 620px;
}

.lesson-panel::-webkit-scrollbar { width: 4px; }
.lesson-panel::-webkit-scrollbar-track { background: transparent; }
.lesson-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.lesson-number {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.lesson-title {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 20px;
  letter-spacing: -0.5px;
}

.lesson-desc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 22px;
  margin-bottom: 20px;
  line-height: 1.8;
  color: var(--text);
  font-size: 14.5px;
}

.lesson-desc p { margin-bottom: 10px; }
.lesson-desc p:last-child { margin-bottom: 0; }
.lesson-desc strong { color: var(--accent); font-weight: 600; }

.lesson-desc code {
  background: rgba(4,170,109,0.12);
  color: #6ee7b7;
  padding: 1px 5px;
  border-radius: 3px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
}

.lesson-desc .tip {
  background: rgba(59,130,246,0.1);
  border-left: 3px solid var(--accent2);
  padding: 10px 14px;
  border-radius: 0 6px 6px 0;
  margin-top: 12px;
  font-size: 13.5px;
  color: #93c5fd;
}

.lesson-desc .warning {
  background: rgba(248,113,113,0.1);
  border-left: 3px solid var(--red);
  padding: 10px 14px;
  border-radius: 0 6px 6px 0;
  margin-top: 12px;
  font-size: 13.5px;
  color: #fca5a5;
}

.code-block {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 20px;
  overflow: hidden;
}

.code-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.try-btn {
  background: rgba(4,170,109,0.15);
  color: var(--accent);
  border: 1px solid rgba(4,170,109,0.3);
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  transition: all 0.15s;
}

.try-btn:hover { background: rgba(4,170,109,0.25); }

code, pre {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13.5px;
}

.code-block pre {
  padding: 18px 20px;
  line-height: 1.7;
  color: #e0e6f8;
  overflow-x: auto;
}

.tag { color: #60a5fa; }
.attr { color: #fbbf24; }
.val  { color: #86efac; }
.cmt  { color: #4b5563; font-style: italic; }

.nav-buttons {
  display: flex;
  gap: 12px;
  margin-top: 12px;
}

.nav-btn {
  padding: 10px 20px;
  border-radius: 7px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  font-family: 'Inter', sans-serif;
}

.nav-btn.prev { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
.nav-btn.prev:hover { color: var(--text); }
.nav-btn.next { background: var(--accent); color: #fff; }
.nav-btn.next:hover { background: #05c27d; transform: translateY(-1px); }

/* ─── EDITOR ─── */
.editor-panel {
  width: 400px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--surface);
}

.editor-topbar {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.editor-topbar-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
}

.run-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 6px 16px;
  border-radius: 5px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.run-btn:hover { background: #05c27d; transform: translateY(-1px); }

textarea#editor {
  flex: 1;
  background: var(--code-bg);
  color: #e0e6f8;
  border: none;
  border-bottom: 1px solid var(--border);
  padding: 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
  resize: none;
  outline: none;
  min-height: 220px;
  max-height: 300px;
}

.output-label {
  padding: 8px 16px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.5px;
}

iframe#result {
  flex: 1;
  border: none;
  background: white;
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media(max-width:900px){
  .sidebar { display: none; }
  .workspace { flex-direction: column; overflow: auto; height: auto; }
  body { overflow: auto; height: auto; }
  .lesson-panel { max-width: 100%; padding: 24px 20px; }
  .editor-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); }
  textarea#editor { max-height: 200px; }
}

</style>
</head>
<body>

<header>
  <div class="logo">
    <span>HTML<span style="color:var(--accent)">.</span>cours</span>
    <span class="logo-badge">50 LEÇONS</span>
  </div>
  <div class="progress-bar-wrap">
    <span id="progress-text">0 / 50</span>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>
</header>

<div class="workspace">
  <div class="sidebar" id="sidebar"></div>
  <div class="lesson-panel" id="lesson-panel"></div>
  <div class="editor-panel">
    <div class="editor-topbar">
      <span class="editor-topbar-title">▶ playground.html</span>
      <button class="run-btn" onclick="runCode()">⚡ Exécuter</button>
    </div>
    <textarea id="editor" spellcheck="false"><h1>Bonjour</h1>
<p>Bienvenue sur mon site HTML</p>
<button>Clique ici</button></textarea>
    <div class="output-label">RÉSULTAT</div>
    <iframe id="result"></iframe>
  </div>
</div>

<script>

const lessons = [
  {
    title: "Les Titres h1 à h6",
    desc: `
      <p>HTML propose <strong>six niveaux de titres</strong>, de <code>&lt;h1&gt;</code> à <code>&lt;h6&gt;</code>. Le <code>&lt;h1&gt;</code> est le plus important — c'est le titre principal de la page, le plus grand. Le <code>&lt;h6&gt;</code> est le plus petit.</p>
      <p>Les titres ont deux rôles : la <strong>mise en page visuelle</strong> (hiérarchie du contenu) et le <strong>référencement SEO</strong> (Google les lit pour comprendre le sujet de la page).</p>
      <p>Bonne pratique : utilisez <strong>un seul h1 par page</strong>, puis des h2 pour les sections, h3 pour les sous-sections, etc.</p>
      <div class="tip">💡 N'utilisez pas les titres pour leur taille — utilisez CSS pour ça. Choisissez le niveau de titre selon la hiérarchie du contenu.</div>
    `,
    code: `<h1>Titre Principal (le plus grand)</h1>
<h2>Section importante</h2>
<h3>Sous-section</h3>
<h4>Détail de section</h4>
<h5>Sous-détail</h5>
<h6>Le plus petit titre</h6>`,
    starter: `<h1>Mon Blog</h1>
<h2>Articles récents</h2>
<h3>JavaScript pour débutants</h3>
<p>Un article sur les bases du JS.</p>
<h3>CSS avancé</h3>
<p>Les techniques modernes de CSS.</p>`
  },
  {
    title: "Les Paragraphes",
    desc: `
      <p>La balise <strong><code>&lt;p&gt;</code></strong> (paragraph) est la balise de base pour tout texte courant. Le navigateur ajoute automatiquement une marge au-dessus et en dessous de chaque paragraphe.</p>
      <p>Un paragraphe s'ouvre avec <code>&lt;p&gt;</code> et se ferme avec <code>&lt;/p&gt;</code>. Tout le texte à l'intérieur forme un seul bloc.</p>
      <p>Contrairement à ce qu'on pourrait croire, <strong>les retours à la ligne dans le code HTML sont ignorés</strong> par le navigateur. Pour forcer un saut de ligne, il faut utiliser la balise <code>&lt;br&gt;</code>.</p>
      <div class="tip">💡 Structurez votre contenu en paragraphes courts et lisibles. Cela améliore la lecture et le SEO.</div>
    `,
    code: `<p>Premier paragraphe. Le navigateur ajoute
automatiquement de l'espace entre les paragraphes.</p>

<p>Deuxième paragraphe. Même si le code
est sur plusieurs lignes, tout reste collé.</p>`,
    starter: `<h1>À propos de moi</h1>
<p>Je m'appelle Aminata et j'apprends le développement web.</p>
<p>J'habite à Dakar, au Sénégal. Je suis passionnée par le HTML et le CSS.</p>
<p>Mon objectif est de créer de beaux sites web.</p>`
  },
  {
    title: "Les Liens hypertexte",
    desc: `
      <p>La balise <strong><code>&lt;a&gt;</code></strong> (anchor = ancre) crée un lien cliquable. L'attribut <strong><code>href</code></strong> (Hypertext REFerence) indique la destination du lien.</p>
      <p>L'attribut <strong><code>target="_blank"</code></strong> ouvre le lien dans un nouvel onglet. Sans cet attribut, la page s'ouvre dans le même onglet.</p>
      <p>On peut faire un lien vers : une URL externe, un autre fichier HTML, une section de la même page (avec <code>#id</code>), ou même déclencher un email (<code>href="mailto:..."</code>).</p>
      <div class="tip">💡 Ajoutez toujours <code>rel="noopener"</code> avec <code>target="_blank"</code> pour des raisons de sécurité : cela empêche la page ouverte d'accéder à votre page.</div>
    `,
    code: `<!-- Lien externe -->
<a href="https://google.com">Visiter Google</a>

<!-- Nouveau onglet -->
<a href="https://google.com" target="_blank">
  Ouvrir dans un nouvel onglet
</a>

<!-- Lien email -->
<a href="mailto:contact@exemple.com">Nous contacter</a>

<!-- Lien vers section -->
<a href="#contact">Aller à la section Contact</a>`,
    starter: `<h1>Mes Liens Favoris</h1>
<p>Voici quelques ressources utiles :</p>
<ul>
  <li><a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a></li>
  <li><a href="https://www.w3schools.com" target="_blank">W3Schools</a></li>
</ul>
<p><a href="mailto:moi@exemple.com">Contactez-moi par email</a></p>`
  },
  {
    title: "Les Images",
    desc: `
      <p>La balise <strong><code>&lt;img&gt;</code></strong> affiche une image. C'est une <strong>balise auto-fermante</strong> (pas de <code>&lt;/img&gt;</code>). Ses deux attributs essentiels sont <code>src</code> (le chemin de l'image) et <code>alt</code> (texte alternatif).</p>
      <p>L'attribut <strong><code>alt</code></strong> est crucial : il s'affiche si l'image ne charge pas, est lu par les lecteurs d'écran pour les malvoyants, et aide le SEO. Ne le laissez jamais vide !</p>
      <p>Les attributs <strong><code>width</code></strong> et <strong><code>height</code></strong> définissent la taille en pixels. Mais en pratique, on préfère utiliser CSS pour contrôler la taille.</p>
      <div class="tip">💡 Utilisez des images légères pour votre site (format WebP ou JPEG compressé). Une image trop lourde ralentit le chargement.</div>
    `,
    code: `<!-- Image avec chemin relatif -->
<img src="photo.jpg" alt="Ma photo de profil">

<!-- Image avec URL externe -->
<img src="https://picsum.photos/300/200" alt="Image aléatoire">

<!-- Avec taille définie -->
<img src="logo.png" alt="Logo" width="100" height="100">`,
    starter: `<h1>Galerie Photos</h1>
<img src="https://picsum.photos/400/200?random=1" alt="Paysage 1" width="400">
<br><br>
<img src="https://picsum.photos/400/200?random=2" alt="Paysage 2" width="400">
<p>Des images chargées depuis internet.</p>`
  },
  {
    title: "Les Boutons",
    desc: `
      <p>La balise <strong><code>&lt;button&gt;</code></strong> crée un bouton cliquable. Par défaut dans un formulaire, il soumet le formulaire. En dehors d'un formulaire, il ne fait rien sans JavaScript.</p>
      <p>L'attribut <strong><code>type</code></strong> contrôle son comportement : <code>type="button"</code> (action JS), <code>type="submit"</code> (envoyer formulaire), <code>type="reset"</code> (vider le formulaire).</p>
      <p>On peut mettre <strong>n'importe quoi à l'intérieur</strong> d'un bouton : texte, icônes, images. C'est plus flexible que <code>&lt;input type="button"&gt;</code>.</p>
      <div class="tip">💡 Utilisez toujours <code>type="button"</code> si le bouton n'est pas dans un formulaire. Cela évite des comportements inattendus.</div>
    `,
    code: `<!-- Bouton simple -->
<button>Clique ici</button>

<!-- Bouton avec type -->
<button type="button">Action JavaScript</button>

<!-- Bouton désactivé -->
<button disabled>Indisponible</button>

<!-- Bouton avec style inline -->
<button style="background:green; color:white; padding:10px">
  Valider
</button>`,
    starter: `<h1>Mes Boutons</h1>
<button style="background:#04AA6D;color:white;padding:10px 20px;border:none;border-radius:5px;font-size:16px;cursor:pointer">
  ✅ Confirmer
</button>
<button style="background:#e74c3c;color:white;padding:10px 20px;border:none;border-radius:5px;font-size:16px;cursor:pointer;margin-left:10px">
  ❌ Annuler
</button>`
  },
  {
    title: "Les Listes",
    desc: `
      <p>HTML propose deux types de listes : <strong><code>&lt;ul&gt;</code></strong> (unordered list = liste à puces) et <strong><code>&lt;ol&gt;</code></strong> (ordered list = liste numérotée). Dans les deux cas, chaque élément est une balise <strong><code>&lt;li&gt;</code></strong> (list item).</p>
      <p>L'attribut <code>type</code> de <code>&lt;ol&gt;</code> permet de changer la numérotation : <code>type="A"</code> (lettres majuscules), <code>type="a"</code> (minuscules), <code>type="I"</code> (chiffres romains).</p>
      <p>Les listes peuvent être <strong>imbriquées</strong> : une liste à l'intérieur d'un <code>&lt;li&gt;</code> pour créer des sous-listes.</p>
      <div class="tip">💡 Les listes sont très utilisées pour les menus de navigation, les étapes d'un tutoriel, les ingrédients d'une recette, etc.</div>
    `,
    code: `<!-- Liste à puces -->
<ul>
  <li>HTML</li>
  <li>CSS</li>
  <li>JavaScript</li>
</ul>

<!-- Liste numérotée -->
<ol>
  <li>Apprendre HTML</li>
  <li>Apprendre CSS</li>
  <li>Apprendre JavaScript</li>
</ol>`,
    starter: `<h2>Compétences</h2>
<ul>
  <li>HTML5</li>
  <li>CSS3</li>
  <li>JavaScript</li>
</ul>
<h2>Étapes pour créer un site</h2>
<ol>
  <li>Créer la structure HTML</li>
  <li>Ajouter le style CSS</li>
  <li>Ajouter l'interactivité JS</li>
  <li>Publier en ligne</li>
</ol>`
  },
  {
    title: "Les Tableaux",
    desc: `
      <p>Un tableau HTML utilise plusieurs balises imbriquées : <strong><code>&lt;table&gt;</code></strong> (conteneur), <strong><code>&lt;tr&gt;</code></strong> (table row = ligne), <strong><code>&lt;td&gt;</code></strong> (table data = cellule), et <strong><code>&lt;th&gt;</code></strong> (table header = en-tête, texte en gras et centré).</p>
      <p>Pour une meilleure structure, on utilise <code>&lt;thead&gt;</code> pour l'en-tête, <code>&lt;tbody&gt;</code> pour le corps, et <code>&lt;tfoot&gt;</code> pour le pied de tableau.</p>
      <p>Les attributs <strong><code>colspan</code></strong> et <strong><code>rowspan</code></strong> permettent de fusionner des cellules horizontalement ou verticalement.</p>
      <div class="tip">💡 N'utilisez jamais les tableaux pour la mise en page (layout). Les tableaux sont uniquement pour les données tabulaires.</div>
    `,
    code: `<table border="1" style="border-collapse:collapse;width:100%">
  <thead>
    <tr>
      <th style="padding:8px">Nom</th>
      <th style="padding:8px">Note</th>
      <th style="padding:8px">Mention</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td style="padding:8px">Fatou</td>
      <td style="padding:8px">17/20</td>
      <td style="padding:8px">Très Bien</td>
    </tr>
    <tr>
      <td style="padding:8px">Moussa</td>
      <td style="padding:8px">12/20</td>
      <td style="padding:8px">Passable</td>
    </tr>
  </tbody>
</table>`,
    starter: `<h2>Planning de la semaine</h2>
<table border="1" style="border-collapse:collapse;width:100%">
  <tr style="background:#04AA6D;color:white">
    <th style="padding:10px">Jour</th>
    <th style="padding:10px">Cours</th>
    <th style="padding:10px">Durée</th>
  </tr>
  <tr>
    <td style="padding:8px">Lundi</td>
    <td style="padding:8px">HTML</td>
    <td style="padding:8px">2h</td>
  </tr>
  <tr>
    <td style="padding:8px">Mardi</td>
    <td style="padding:8px">CSS</td>
    <td style="padding:8px">2h</td>
  </tr>
</table>`
  },
  {
    title: "Les Formulaires",
    desc: `
      <p>La balise <strong><code>&lt;form&gt;</code></strong> est le conteneur de tous les champs de saisie. Ses deux attributs principaux sont <strong><code>action</code></strong> (URL où envoyer les données) et <strong><code>method</code></strong> (méthode d'envoi : GET ou POST).</p>

const CATEGORIES = [
  { label: "Texte & Structure", range: [0, 5] },
  { label: "Données & Médias", range: [6, 10] },
  { label: "Mise en page", range: [11, 15] },
  { label: "Formatage", range: [16, 21] },
  { label: "Sémantique", range: [22, 29] },
  { label: "Formulaires", range: [30, 37] },
  { label: "Inputs avancés", range: [38, 43] },
  { label: "Inputs spéciaux", range: [44, 48] },
  { label: "Interactif & Projet", range: [49, 49] }
]

let currentLesson = 0
let doneLessons = new Set(JSON.parse(localStorage.getItem("doneLessons_html") || "[]"))

function buildSidebar() {
  const sb = document.getElementById("sidebar")
  sb.innerHTML = ""
  CATEGORIES.forEach(cat => {
    let section = document.createElement("div")
    section.className = "sidebar-section"
    section.textContent = cat.label
    sb.appendChild(section)
    for (let i = cat.range[0]; i <= cat.range[1]; i++) {
      let item = document.createElement("div")
      item.className = "sidebar-item" + (i === currentLesson ? " active" : "") + (doneLessons.has(i) ? " done" : "")
      item.dataset.idx = i
      item.innerHTML = `<span class="num">${String(i+1).padStart(2,"0")}</span><span>${lessons[i].title.replace(/🎓 /,"")}</span>`
      item.addEventListener("click", () => goTo(i))
      sb.appendChild(item)
    }
  })
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")
}

function highlightHtml(code) {
  let e = escapeHtml(code)
  // Comments
  e = e.replace(/&lt;!--[\s\S]*?--&gt;/g, m => `<span class="cmt">${m}</span>`)
  // Tags
  e = e.replace(/(&lt;\/?)([\w-]+)/g, (m,slash,tag) => `<span class="tag">${slash}${tag}</span>`)
  // Attributes with values
  e = e.replace(/([\w-]+)(=)(&quot;[^&]*&quot;)/g, (m,attr,eq,val) => `<span class="attr">${attr}</span>${eq}<span class="val">${val}</span>`)
  // Lone attributes
  e = e.replace(/\s(required|checked|disabled|multiple|open|controls|autoplay|loop|muted)(?=[>\s])/g, m => ` <span class="attr">${m.trim()}</span>`)
  return e
}

function renderLesson() {
  const l = lessons[currentLesson]
  const panel = document.getElementById("lesson-panel")
  panel.innerHTML = `
    <div class="lesson-number">Leçon ${String(currentLesson+1).padStart(2,"0")} / 50</div>
    <div class="lesson-title">${l.title}</div>
    <div class="lesson-desc">${l.desc}</div>
    <div class="code-block">
      <div class="code-header">
        <span>Exemple HTML</span>
        <button class="try-btn" onclick="loadExample()">Essayer dans le playground →</button>
      </div>
      <pre>${highlightHtml(l.code)}</pre>
    </div>
    <div class="nav-buttons">
      ${currentLesson > 0 ? `<button class="nav-btn prev" onclick="goTo(${currentLesson-1})">← Précédent</button>` : ""}
      ${currentLesson < lessons.length-1 ? `<button class="nav-btn next" onclick="markAndNext()">Suivant →</button>` : `<button class="nav-btn next" onclick="markDone()">✅ Terminer</button>`}
    </div>
  `
  panel.scrollTop = 0
  document.getElementById("editor").value = lessons[currentLesson].starter
  runCode()
  updateProgress()
}

function goTo(idx) {
  currentLesson = idx
  buildSidebar()
  renderLesson()
}

function markAndNext() {
  doneLessons.add(currentLesson)
  localStorage.setItem("doneLessons_html", JSON.stringify([...doneLessons]))
  goTo(currentLesson + 1)
}

function markDone() {
  doneLessons.add(currentLesson)
  localStorage.setItem("doneLessons_html", JSON.stringify([...doneLessons]))
  buildSidebar()
  updateProgress()
  document.querySelector(".nav-btn.next").innerHTML = "✅ Terminé !"
}

function loadExample() {
  document.getElementById("editor").value = lessons[currentLesson].code
  runCode()
}

function updateProgress() {
  const pct = (doneLessons.size / 50 * 100).toFixed(0)
  document.getElementById("progress-fill").style.width = pct + "%"
  document.getElementById("progress-text").textContent = `${doneLessons.size} / 50`
}

function runCode() {
  const code = document.getElementById('editor').value
  const iframe = document.getElementById('result').contentWindow.document
  iframe.open()
  iframe.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
    body{font-family:Arial,sans-serif;padding:16px;line-height:1.6;font-size:14px}
    h1{font-size:22px} h2{font-size:18px} h3{font-size:16px}
    table{border-collapse:collapse;width:100%}
    td,th{padding:8px;border:1px solid #ddd}
    th{background:#f3f4f6}
    input,select,textarea,button{margin:4px 0;box-sizing:border-box}
    progress{width:100%;height:12px}
    details{border:1px solid #e2e8f0;border-radius:6px;padding:10px;margin:5px 0}
    summary{cursor:pointer;font-weight:bold}
    nav a{margin-right:12px}
  </style></head><body>${code}</body></html>`)
  iframe.close()
}

buildSidebar()
renderLesson()
