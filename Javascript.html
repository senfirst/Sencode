<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprendre JavaScript — 50 Leçons</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #0d0f14;
  --surface: #151820;
  --surface2: #1e2230;
  --border: #2a2f40;
  --accent: #f0c040;
  --accent2: #7c6af5;
  --text: #e8eaf0;
  --text-muted: #8890aa;
  --green: #4ade80;
  --red: #f87171;
  --code-bg: #0a0c10;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ─── HEADER ─── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-badge {
  background: var(--accent);
  color: #000;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}

.progress-bar-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--text-muted);
}

.progress-bar {
  width: 160px;
  height: 6px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width 0.4s ease;
  width: 0%;
}

/* ─── LAYOUT ─── */
.workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ─── SIDEBAR ─── */
.sidebar {
  width: 220px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  padding: 12px 0;
}

.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sidebar-section {
  padding: 8px 14px 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  color: var(--text-muted);
  text-transform: uppercase;
}

.sidebar-item {
  padding: 7px 14px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  border-left: 2px solid transparent;
  transition: all 0.15s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-item:hover { color: var(--text); background: var(--surface2); }
.sidebar-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(240,192,64,0.07); }
.sidebar-item.done .num { background: var(--green); color: #000; }

.num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  background: var(--border);
  color: var(--text-muted);
  padding: 1px 5px;
  border-radius: 3px;
  flex-shrink: 0;
  min-width: 26px;
  text-align: center;
}

/* ─── LESSON PANEL ─── */
.lesson-panel {
  flex: 1;
  overflow-y: auto;
  padding: 36px 40px;
  max-width: 620px;
}

.lesson-panel::-webkit-scrollbar { width: 4px; }
.lesson-panel::-webkit-scrollbar-track { background: transparent; }
.lesson-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.lesson-number {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.lesson-title {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 20px;
  letter-spacing: -0.5px;
}

.lesson-desc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 22px;
  margin-bottom: 20px;
  line-height: 1.8;
  color: var(--text);
  font-size: 14.5px;
}

.lesson-desc p { margin-bottom: 10px; }
.lesson-desc p:last-child { margin-bottom: 0; }

.lesson-desc strong {
  color: var(--accent);
  font-weight: 600;
}

.lesson-desc .tip {
  background: rgba(124,106,245,0.12);
  border-left: 3px solid var(--accent2);
  padding: 10px 14px;
  border-radius: 0 6px 6px 0;
  margin-top: 12px;
  font-size: 13.5px;
  color: #c0baff;
}

.lesson-desc .warning {
  background: rgba(248,113,113,0.1);
  border-left: 3px solid var(--red);
  padding: 10px 14px;
  border-radius: 0 6px 6px 0;
  margin-top: 12px;
  font-size: 13.5px;
  color: #fca5a5;
}

.code-block {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 20px;
  overflow: hidden;
}

.code-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.try-btn {
  background: rgba(240,192,64,0.15);
  color: var(--accent);
  border: 1px solid rgba(240,192,64,0.3);
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  transition: all 0.15s;
}

.try-btn:hover { background: rgba(240,192,64,0.25); }

code, pre {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13.5px;
}

.code-block pre {
  padding: 18px 20px;
  line-height: 1.7;
  color: #e0e6f8;
  overflow-x: auto;
}

/* Syntax colors */
.kw { color: #c084fc; }
.fn { color: #60a5fa; }
.str { color: #86efac; }
.num-lit { color: #fb923c; }
.cmt { color: #4b5563; font-style: italic; }
.op { color: var(--accent); }

.nav-buttons {
  display: flex;
  gap: 12px;
  margin-top: 12px;
}

.nav-btn {
  padding: 10px 20px;
  border-radius: 7px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  font-family: 'Inter', sans-serif;
}

.nav-btn.prev { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
.nav-btn.prev:hover { color: var(--text); }
.nav-btn.next { background: var(--accent); color: #000; }
.nav-btn.next:hover { background: #f5d060; transform: translateY(-1px); }

/* ─── EDITOR ─── */
.editor-panel {
  width: 400px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--surface);
}

.editor-topbar {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.editor-topbar-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
}

.run-btn {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 6px 16px;
  border-radius: 5px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.run-btn:hover { background: #f5d060; transform: translateY(-1px); }

textarea#editor {
  flex: 1;
  background: var(--code-bg);
  color: #e0e6f8;
  border: none;
  border-bottom: 1px solid var(--border);
  padding: 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
  resize: none;
  outline: none;
  min-height: 220px;
  max-height: 300px;
}

.output-label {
  padding: 8px 16px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.5px;
}

iframe#result {
  flex: 1;
  border: none;
  background: white;
}

/* SCROLLBARS */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media(max-width:900px){
  .sidebar { display: none; }
  .workspace { flex-direction: column; overflow: auto; height: auto; }
  body { overflow: auto; height: auto; }
  .lesson-panel { max-width: 100%; padding: 24px 20px; }
  .editor-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); }
  textarea#editor { max-height: 200px; }
}

</style>
</head>
<body>

<header>
  <div class="logo">
    <span>JS<span style="color:var(--accent)">.</span>cours</span>
    <span class="logo-badge">50 LEÇONS</span>
  </div>
  <div class="progress-bar-wrap">
    <span id="progress-text">0 / 50</span>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>
</header>

<div class="workspace">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar"></div>

  <!-- LESSON PANEL -->
  <div class="lesson-panel" id="lesson-panel"></div>

  <!-- EDITOR -->
  <div class="editor-panel">
    <div class="editor-topbar">
      <span class="editor-topbar-title">▶ playground.js</span>
      <button class="run-btn" onclick="runCode()">⚡ Exécuter</button>
    </div>
    <textarea id="editor" spellcheck="false">// Modifiez ce code et cliquez sur Exécuter !
let message = "Bonjour JavaScript"
document.querySelector("h1").innerHTML = message
document.body.style.background = "#111"
document.body.style.color = "white"</textarea>
    <div class="output-label">RÉSULTAT</div>
    <iframe id="result"></iframe>
  </div>

</div>

<script>

const lessons = [
  {
    title: "Introduction à JavaScript",
    desc: `
      <p>JavaScript est le <strong>langage de programmation du web</strong>. Il permet d'ajouter de l'interactivité à vos pages HTML : animations, boutons, formulaires dynamiques, jeux, et bien plus encore.</p>
      <p>Il s'exécute directement dans le navigateur, sans installation. C'est pourquoi c'est l'un des langages les plus populaires au monde.</p>
      <p><strong>console.log()</strong> est la première instruction à connaître : elle affiche un message dans la console du navigateur (ouvrez les DevTools avec F12 pour la voir).</p>
      <div class="tip">💡 JavaScript est différent de Java. Ce sont deux langages distincts malgré leur nom similaire.</div>
    `,
    code: `// Afficher un message dans la console
console.log("Bonjour le monde !")

// Vous pouvez afficher des nombres aussi
console.log(42)`,
    starter: `console.log("Bonjour JavaScript")\nconsole.log("Mon premier programme")`
  },
  {
    title: "Variables avec let",
    desc: `
      <p>Une <strong>variable</strong> est une boîte qui stocke une valeur. Le mot-clé <strong>let</strong> permet de créer une variable dont la valeur peut changer au cours du programme.</p>
      <p>On utilise le symbole <code>=</code> pour <strong>assigner</strong> une valeur. Ce n'est pas une égalité mathématique, c'est une affectation : « mets cette valeur dans cette boîte ».</p>
      <div class="tip">💡 Vous pouvez changer la valeur d'une variable <code>let</code> à n'importe quel moment.</div>
    `,
    code: `let nom = "Ali"
console.log(nom) // Affiche : Ali

// Modifier la variable
nom = "Fatou"
console.log(nom) // Affiche : Fatou`,
    starter: `let prenom = "Votre prénom"\nlet ville = "Dakar"\nconsole.log(prenom)\nconsole.log(ville)`
  },
  {
    title: "Constantes avec const",
    desc: `
      <p><strong>const</strong> crée une variable dont la valeur <strong>ne peut pas être changée</strong> après sa création. On l'utilise pour les valeurs fixes comme l'âge de majorité, un taux de TVA, une couleur de thème.</p>
      <p>Si vous essayez de modifier une <code>const</code>, JavaScript affichera une erreur.</p>
      <div class="warning">⚠️ const ne peut pas être réassignée. Utilisez let si vous devez modifier la valeur plus tard.</div>
      <div class="tip">💡 Bonne pratique : utilisez const par défaut, et let seulement si vous avez besoin de modifier la valeur.</div>
    `,
    code: `const age = 20
console.log(age) // 20

// Ceci provoquerait une erreur :
// age = 21  → TypeError !

const PI = 3.14159
console.log(PI)`,
    starter: `const pays = "Sénégal"\nconst annee = 2025\nconsole.log(pays)\nconsole.log(annee)`
  },
  {
    title: "Alert — Boîte de dialogue",
    desc: `
      <p><strong>alert()</strong> affiche une boîte de dialogue dans le navigateur avec un message. L'utilisateur doit cliquer sur OK pour continuer.</p>
      <p>C'est utile pour tester rapidement, mais à éviter dans les vraies applications car c'est intrusif et bloque l'exécution du code.</p>
      <div class="tip">💡 Dans la sandbox de ce cours, alert() s'affiche dans la zone de résultat. Dans un vrai navigateur, c'est une popup qui bloque tout.</div>
    `,
    code: `alert("Bienvenue sur mon site !")

// Vous pouvez alerter avec des variables
let nom = "Ali"
alert("Bonjour " + nom)`,
    starter: `alert("Bonjour !")`
  },
  {
    title: "console.log en détail",
    desc: `
      <p><strong>console.log()</strong> est l'outil numéro 1 du développeur pour déboguer son code. Il affiche n'importe quelle valeur dans la console.</p>
      <p>Vous pouvez passer plusieurs arguments séparés par des virgules, et JavaScript les affichera tous sur la même ligne.</p>
      <div class="tip">💡 Pour voir la console : appuyez sur F12 dans Chrome/Firefox → onglet "Console".</div>
    `,
    code: `console.log("Un seul message")
console.log("Plusieurs", "valeurs", "séparées")
console.log("Résultat :", 5 + 3)

let x = 10
console.log("La valeur de x est :", x)`,
    starter: `let a = 5\nlet b = 3\nconsole.log("a =", a)\nconsole.log("b =", b)\nconsole.log("Somme =", a + b)`
  },
  {
    title: "Les Nombres",
    desc: `
      <p>JavaScript gère deux types de nombres : les <strong>entiers</strong> (1, 42, -5) et les <strong>décimaux</strong> (3.14, -0.5). Il n'y a pas de distinction de type entre eux, ils sont tous de type <code>number</code>.</p>
      <p>Les opérations de base sont disponibles : <strong>+</strong> (addition), <strong>-</strong> (soustraction), <strong>*</strong> (multiplication), <strong>/</strong> (division), <strong>%</strong> (modulo = reste de la division).</p>
      <div class="tip">💡 Le modulo <code>%</code> est très utile : <code>10 % 3</code> donne <code>1</code> car 10 = 3×3 + 1.</div>
    `,
    code: `let entier = 42
let decimal = 3.14

console.log(entier + decimal)  // 45.14
console.log(10 * 5)            // 50
console.log(10 / 3)            // 3.333...
console.log(10 % 3)            // 1 (reste)`,
    starter: `let prix = 1500\nlet quantite = 3\nlet total = prix * quantite\nconsole.log("Total :", total, "FCFA")`
  },
  {
    title: "Les Chaînes de caractères",
    desc: `
      <p>Une <strong>chaîne de caractères</strong> (string) est un texte entouré de guillemets simples <code>'...'</code>, doubles <code>"..."</code> ou backticks <code>\`...\`</code>.</p>
      <p>L'opérateur <strong>+</strong> permet de <strong>concatener</strong> (coller) des chaînes ensemble. La propriété <code>.length</code> donne la longueur du texte.</p>
      <div class="tip">💡 <code>"5" + 3</code> donne <code>"53"</code> (concatenation) et non <code>8</code> ! Faites attention aux types.</div>
    `,
    code: `let prenom = "Aminata"
let nom = "Diallo"
let nomComplet = prenom + " " + nom
console.log(nomComplet)     // Aminata Diallo

console.log(nomComplet.length)  // 14 (nb de caractères)
console.log(prenom.toUpperCase()) // AMINATA`,
    starter: `let salutation = "Bonjour"\nlet prenom = "Moussa"\nconsole.log(salutation + " " + prenom + " !")`
  },
  {
    title: "Opérations mathématiques",
    desc: `
      <p>Au-delà des 4 opérations, JavaScript offre l'objet <strong>Math</strong> pour des calculs avancés. Voici les plus utiles :</p>
      <p><strong>Math.round()</strong> arrondit, <strong>Math.floor()</strong> arrondit vers le bas, <strong>Math.ceil()</strong> vers le haut, <strong>Math.abs()</strong> donne la valeur absolue, <strong>Math.pow()</strong> calcule une puissance.</p>
      <div class="tip">💡 <code>**</code> est un raccourci pour les puissances : <code>2 ** 10</code> = 1024.</div>
    `,
    code: `console.log(5 + 3)        // 8
console.log(10 - 4)       // 6
console.log(3 * 7)        // 21
console.log(15 / 4)       // 3.75
console.log(Math.round(3.7)) // 4
console.log(2 ** 8)       // 256`,
    starter: `let base = 5\nlet hauteur = 12\nlet aire = (base * hauteur) / 2\nconsole.log("Aire du triangle :", aire)`
  },
  {
    title: "Condition if",
    desc: `
      <p>La structure <strong>if</strong> permet d'exécuter du code uniquement si une condition est vraie. La condition est entre parenthèses, le code à exécuter entre accolades.</p>
      <p>Les opérateurs de comparaison : <strong>></strong> (supérieur), <strong><</strong> (inférieur), <strong>>=</strong> (supérieur ou égal), <strong><=</strong> (inférieur ou égal), <strong>===</strong> (strictement égal), <strong>!==</strong> (différent).</p>
      <div class="tip">💡 Utilisez <code>===</code> et non <code>==</code>. Le triple égal vérifie aussi le type : <code>"5" == 5</code> est vrai, mais <code>"5" === 5</code> est faux.</div>
    `,
    code: `let age = 20

if (age >= 18) {
  console.log("Vous êtes majeur")
}

if (age >= 65) {
  console.log("Vous êtes senior")
}`,
    starter: `let note = 14\nif (note >= 10) {\n  console.log("Admis !")\n}\nif (note >= 16) {\n  console.log("Félicitations !")\n}`
  },
  {
    title: "Condition if / else",
    desc: `
      <p><strong>else</strong> s'exécute quand la condition du <code>if</code> est <strong>fausse</strong>. On peut enchaîner avec <strong>else if</strong> pour gérer plusieurs cas.</p>
      <p>L'ordre des conditions est important : JavaScript s'arrête dès qu'il en trouve une vraie.</p>
      <div class="tip">💡 Les opérateurs logiques : <code>&&</code> (ET), <code>||</code> (OU), <code>!</code> (NON). Exemple : <code>age > 12 && age < 18</code>.</div>
    `,
    code: `let note = 14

if (note >= 16) {
  console.log("Très bien")
} else if (note >= 10) {
  console.log("Passable")
} else {
  console.log("Insuffisant")
}`,
    starter: `let heure = 14\nif (heure < 12) {\n  console.log("Bonjour !")\n} else if (heure < 18) {\n  console.log("Bon après-midi !")\n} else {\n  console.log("Bonsoir !")\n}`
  },
  {
    title: "Les Fonctions",
    desc: `
      <p>Une <strong>fonction</strong> est un bloc de code réutilisable. On la définit une fois avec le mot-clé <strong>function</strong>, puis on peut l'appeler autant de fois qu'on veut.</p>
      <p>Cela évite de répéter du code (principe <strong>DRY</strong> : Don't Repeat Yourself) et rend le code plus lisible et maintenable.</p>
      <div class="tip">💡 Nommez vos fonctions avec un verbe : <code>calculerTotal()</code>, <code>afficherMessage()</code>, <code>validerFormulaire()</code>.</div>
    `,
    code: `function direBonjour() {
  console.log("Bonjour tout le monde !")
}

// Appeler la fonction (3 fois)
direBonjour()
direBonjour()
direBonjour()`,
    starter: `function afficherBienvenue() {\n  console.log("Bienvenue !")\n  console.log("Bonne chance dans l'apprentissage.")\n}\n\nafficherBienvenue()`
  },
  {
    title: "Paramètres de fonctions",
    desc: `
      <p>Les <strong>paramètres</strong> sont des variables passées à une fonction pour la rendre dynamique. On les déclare dans les parenthèses lors de la définition.</p>
      <p>Quand on appelle la fonction, on passe des <strong>arguments</strong> (les valeurs réelles). On peut avoir plusieurs paramètres séparés par des virgules.</p>
      <div class="tip">💡 Vous pouvez définir des valeurs par défaut : <code>function salut(nom = "ami")</code> — si aucun argument n'est passé, nom vaut "ami".</div>
    `,
    code: `function saluer(prenom, ville) {
  console.log("Bonjour " + prenom + " de " + ville + " !")
}

saluer("Aminata", "Dakar")
saluer("Moussa", "Thiès")
saluer("Fatou", "Saint-Louis")`,
    starter: `function calculerSurface(longueur, largeur) {\n  let surface = longueur * largeur\n  console.log("Surface :", surface, "m²")\n}\n\ncalculerSurface(5, 3)\ncalculerSurface(10, 7)`
  },
  {
    title: "Return — retourner une valeur",
    desc: `
      <p><strong>return</strong> permet à une fonction de <strong>renvoyer un résultat</strong> qu'on peut stocker dans une variable ou utiliser dans une expression. Sans return, la fonction renvoie <code>undefined</code>.</p>
      <p>Le code après un <code>return</code> n'est jamais exécuté — return quitte immédiatement la fonction.</p>
      <div class="tip">💡 Une fonction avec return est plus flexible qu'une fonction qui fait juste un console.log, car le résultat peut être réutilisé.</div>
    `,
    code: `function additionner(a, b) {
  return a + b
}

  { label: "Fonctions", range: [12, 14] },
  { label: "Structures", range: [15, 17] },
  { label: "DOM", range: [18, 21] },
  { label: "Événements", range: [22, 25] },
  { label: "Manipulation", range: [26, 29] },
  { label: "Temps & Dates", range: [30, 33] },
  { label: "Avancé", range: [34, 40] },
  { label: "Asynchrone", range: [41, 43] },
  { label: "Moderne ES6+", range: [44, 47] },
  { label: "APIs & POO", range: [48, 49] }
]

let currentLesson = 0
let doneLessons = new Set(JSON.parse(localStorage.getItem("doneLessons") || "[]"))

function buildSidebar() {
  const sb = document.getElementById("sidebar")
  sb.innerHTML = ""
  CATEGORIES.forEach(cat => {
    let section = document.createElement("div")
    section.className = "sidebar-section"
    section.textContent = cat.label
    sb.appendChild(section)
    for (let i = cat.range[0]; i <= cat.range[1]; i++) {
      let item = document.createElement("div")
      item.className = "sidebar-item" + (i === currentLesson ? " active" : "") + (doneLessons.has(i) ? " done" : "")
      item.dataset.idx = i
      item.innerHTML = `<span class="num">${String(i+1).padStart(2,"0")}</span><span>${lessons[i].title.replace(/🎓 /,"")}</span>`
      item.addEventListener("click", () => goTo(i))
      sb.appendChild(item)
    }
  })
}

function renderLesson() {
  const l = lessons[currentLesson]
  const panel = document.getElementById("lesson-panel")
  panel.innerHTML = `
    <div class="lesson-number">Leçon ${String(currentLesson+1).padStart(2,"0")} / 50</div>
    <div class="lesson-title">${l.title}</div>
    <div class="lesson-desc">${l.desc}</div>
    <div class="code-block">
      <div class="code-header">
        <span>Exemple</span>
        <button class="try-btn" onclick="loadExample()">Essayer dans le playground →</button>
      </div>
      <pre>${highlight(l.code)}</pre>
    </div>
    <div class="nav-buttons">
      ${currentLesson > 0 ? `<button class="nav-btn prev" onclick="goTo(${currentLesson-1})">← Précédent</button>` : ""}
      ${currentLesson < lessons.length-1 ? `<button class="nav-btn next" onclick="markAndNext()">Suivant →</button>` : `<button class="nav-btn next" onclick="markDone()">✅ Terminer</button>`}
    </div>
  `
  panel.scrollTop = 0
  document.getElementById("editor").value = lessons[currentLesson].starter
  runCode()
  updateProgress()
}

function highlight(code) {
  return code
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\/\/.*/g, m => `<span class="cmt">${m}</span>`)
    .replace(/\b(let|const|var|function|return|if|else|for|while|class|new|this|async|await|import|export|default|switch|case|break|try|catch|finally|extends|super|typeof|of|in)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(console|document|Math|Date|localStorage|JSON|fetch|alert|setTimeout|setInterval|clearInterval)\b/g, '<span class="fn">$1</span>')
    .replace(/"([^"]*)"/g, '<span class="str">"$1"</span>')
    .replace(/`([^`]*)`/g, (m, s) => `<span class="str">\`${s}\`</span>`)
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="num-lit">$1</span>')
}

function goTo(idx) {
  currentLesson = idx
  buildSidebar()
  renderLesson()
}

function markAndNext() {
  doneLessons.add(currentLesson)
  localStorage.setItem("doneLessons", JSON.stringify([...doneLessons]))
  goTo(currentLesson + 1)
}

function markDone() {
  doneLessons.add(currentLesson)
  localStorage.setItem("doneLessons", JSON.stringify([...doneLessons]))
  buildSidebar()
  updateProgress()
  document.getElementById("lesson-panel").querySelector(".nav-btn.next").innerHTML = "✅ Terminé !"
}

function loadExample() {
  document.getElementById("editor").value = lessons[currentLesson].code
  runCode()
}

function updateProgress() {
  const pct = (doneLessons.size / 50 * 100).toFixed(0)
  document.getElementById("progress-fill").style.width = pct + "%"
  document.getElementById("progress-text").textContent = `${doneLessons.size} / 50`
}

function runCode() {
  let js = document.getElementById('editor').value
  let iframe = document.getElementById('result')
  iframe.srcdoc = `<!DOCTYPE html><html><head><style>
body{font-family:Arial;padding:16px;font-size:14px;line-height:1.6}
h1{font-size:20px;margin-bottom:8px}
button{padding:8px 16px;cursor:pointer;border:none;background:#f0c040;border-radius:5px;font-weight:bold}
input{padding:8px;border:1px solid #ddd;border-radius:4px;font-size:14px}
ul{padding-left:20px}
</style></head><body>
<h1>Bienvenue</h1>
<p>Apprenez JavaScript facilement.</p>
<button>Bouton</button>
<script>${js}<\/script>
</body></html>`
}

// Init
buildSidebar()
renderLesson()

</script>
</body>
</html>
