<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Learn — 50 Leçons JavaScript</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0; --surface: #ffffff; --surface2: #f8f7f4; --surface3: #eeede9;
  --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);
  --accent: #d97706; --accent2: #b45309; --accent-dim: rgba(217,119,6,0.09);
  --accent-light: #fef3c7;
  --text: #1a1915; --text2: #5a5750; --text3: #999690; --green: #16a34a;
  --green-dim: rgba(22,163,74,0.1); --red: #dc2626; --blue: #2563eb;
  --code-bg: #1e1e2e; --code-text: #cdd6f4;
  --sans: 'Inter', sans-serif; --mono: 'IBM Plex Mono', monospace;
  --radius: 8px; --radius-lg: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);
  --editor-width: 560px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-size: 14px; }

/* HEADER */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; height: 56px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; z-index: 100; box-shadow: var(--shadow); }
.logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.logo-mark { width: 32px; height: 32px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; font-weight: 600; color: #fff; letter-spacing: -0.5px; box-shadow: 0 2px 6px rgba(217,119,6,0.3); }
.logo-text { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.03em; }
.logo-text span { color: var(--accent); }
.header-mid { flex: 1; display: flex; align-items: center; justify-content: center; gap: 20px; }
.progress-wrap { display: flex; align-items: center; gap: 10px; }
.progress-track { width: 200px; height: 4px; background: var(--surface3); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #f59e0b, #d97706); border-radius: 99px; transition: width 0.6s ease; }
.progress-label { font-size: 12px; color: var(--text3); font-family: var(--mono); font-weight: 500; white-space: nowrap; }
.streak-badge { display: flex; align-items: center; gap: 5px; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 20px; padding: 5px 12px; font-size: 12px; color: #c2410c; font-weight: 600; }

/* LAYOUT */
.main { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 272px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
.sidebar-top { padding: 14px 14px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.search-row { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 12px; }
.search-row svg { flex-shrink: 0; color: var(--text3); }
.search-row input { background: transparent; border: none; outline: none; color: var(--text); font-family: var(--sans); font-size: 13px; width: 100%; }
.search-row input::placeholder { color: var(--text3); }
.lesson-list-wrap { flex: 1; overflow-y: auto; padding: 6px 8px; }
.lesson-list-wrap::-webkit-scrollbar { width: 4px; }
.lesson-list-wrap::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }
.chapter-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent2); padding: 14px 8px 5px; display: flex; align-items: center; gap: 8px; }
.chapter-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.lesson-item { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 7px; cursor: pointer; transition: all 0.12s; border: 1px solid transparent; }
.lesson-item:hover { background: var(--surface2); }
.lesson-item.active { background: var(--accent-light); border-color: rgba(217,119,6,0.25); }
.lesson-num { width: 22px; height: 22px; border-radius: 5px; background: var(--surface3); font-size: 9px; font-family: var(--mono); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text3); font-weight: 600; }
.lesson-item.active .lesson-num { background: var(--accent); color: #fff; }
.lesson-item.done .lesson-num { background: #dcfce7; color: var(--green); font-size: 11px; }
.lesson-title-text { font-size: 12.5px; color: var(--text2); line-height: 1.35; flex: 1; }
.lesson-item.active .lesson-title-text { color: var(--accent2); font-weight: 500; }
.lesson-item.done .lesson-title-text { color: var(--text3); }

/* CONTENT */
.content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.content-scroll { flex: 1; overflow-y: auto; padding: 32px 44px 44px; }
.content-scroll::-webkit-scrollbar { width: 5px; }
.content-scroll::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

.lesson-eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.lesson-num-badge { font-family: var(--mono); font-size: 11px; color: var(--accent2); background: var(--accent-light); border: 1px solid rgba(217,119,6,0.2); border-radius: 5px; padding: 2px 9px; font-weight: 600; }
.cat-tag { font-size: 11px; color: var(--text3); background: var(--surface); border: 1px solid var(--border2); border-radius: 5px; padding: 2px 9px; font-weight: 500; }
.lesson-h1 { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 20px; }

.prose { font-size: 14px; line-height: 1.8; color: var(--text2); margin-bottom: 14px; }
.prose strong { color: var(--text); font-weight: 600; }
.prose code { font-family: var(--mono); font-size: 12px; background: #f1f0ec; color: #b45309; padding: 2px 6px; border-radius: 4px; border: 1px solid #e5e3dc; }
.prose ul { padding-left: 20px; margin-bottom: 14px; }
.prose li { margin-bottom: 6px; color: var(--text2); }
.prose ol { padding-left: 20px; margin-bottom: 14px; }

.callout { display: flex; gap: 12px; padding: 13px 16px; border-radius: var(--radius-lg); margin: 18px 0; font-size: 13px; line-height: 1.7; border-left: 3px solid; background: var(--surface); box-shadow: var(--shadow); }
.callout.tip { border-color: var(--green); }
.callout.warn { border-color: #f59e0b; }
.callout.info { border-color: var(--blue); }
.callout.danger { border-color: var(--red); background: #fff8f8; }
.callout-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.callout-body { color: var(--text2); }
.callout-body strong { color: var(--text); }

.section-divider { display: flex; align-items: center; gap: 10px; margin: 28px 0 14px; }
.section-divider span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text3); font-weight: 700; white-space: nowrap; }
.section-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* COMPARISON TABLE */
.compare-table { width: 100%; border-collapse: collapse; margin: 16px 0 20px; font-size: 13px; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
.compare-table th { background: var(--surface3); padding: 10px 14px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); font-weight: 700; }
.compare-table td { padding: 10px 14px; border-top: 1px solid var(--border); color: var(--text2); vertical-align: top; }
.compare-table td code { font-family: var(--mono); font-size: 11.5px; background: #f1f0ec; color: #b45309; padding: 1px 5px; border-radius: 3px; }
.compare-table tr:hover td { background: var(--surface2); }
.badge-green { display: inline-block; background: #dcfce7; color: #15803d; font-size: 10px; padding: 1px 7px; border-radius: 99px; font-weight: 700; }
.badge-red { display: inline-block; background: #fee2e2; color: #b91c1c; font-size: 10px; padding: 1px 7px; border-radius: 99px; font-weight: 700; }
.badge-yellow { display: inline-block; background: #fef9c3; color: #854d0e; font-size: 10px; padding: 1px 7px; border-radius: 99px; font-weight: 700; }

/* STEPS / RECIPE */
.steps-list { counter-reset: step; list-style: none; padding: 0; margin: 16px 0 20px; }
.steps-list li { counter-increment: step; display: flex; gap: 14px; margin-bottom: 12px; align-items: flex-start; }
.steps-list li::before { content: counter(step); width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; font-family: var(--mono); }
.steps-list li .step-text { color: var(--text2); font-size: 13.5px; line-height: 1.7; padding-top: 2px; }
.steps-list li .step-text code { font-family: var(--mono); font-size: 11.5px; background: #f1f0ec; color: #b45309; padding: 1px 5px; border-radius: 3px; }

/* PITFALLS */
.pitfall-box { background: #fff8f8; border: 1px solid #fecaca; border-radius: var(--radius-lg); padding: 14px 16px; margin: 16px 0; font-size: 13px; line-height: 1.7; }
.pitfall-box .pitfall-title { font-weight: 700; color: var(--red); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.pitfall-box code { font-family: var(--mono); font-size: 11.5px; background: #fee2e2; color: #b91c1c; padding: 1px 5px; border-radius: 3px; }

/* MINI QUIZ */
.quiz-block { border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 20px; margin: 0; background: var(--surface); box-shadow: var(--shadow); }
.quiz-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent2); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.quiz-label::before { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }
.quiz-q { font-size: 14.5px; font-weight: 600; margin-bottom: 14px; color: var(--text); line-height: 1.5; }
.quiz-opt { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface2); margin-bottom: 8px; cursor: pointer; font-size: 13px; color: var(--text2); text-align: left; width: 100%; display: flex; align-items: center; gap: 10px; transition: all 0.15s; font-family: var(--sans); }
.quiz-opt::before { content: attr(data-letter); font-family: var(--mono); font-size: 11px; font-weight: 700; background: var(--surface3); color: var(--text3); width: 22px; height: 22px; border-radius: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.quiz-opt:hover:not(:disabled) { border-color: var(--accent); color: var(--text); background: var(--accent-light); }
.quiz-opt.correct { border-color: var(--green); background: #f0fdf4; color: #15803d; }
.quiz-opt.correct::before { background: #dcfce7; color: var(--green); }
.quiz-opt.wrong { border-color: var(--red); background: #fef2f2; color: #b91c1c; }
.quiz-opt.wrong::before { background: #fee2e2; color: var(--red); }
.quiz-feedback { margin-top: 12px; font-size: 13px; display: none; padding: 10px 14px; border-radius: 8px; font-weight: 500; }
.quiz-feedback.show { display: flex; align-items: center; gap: 8px; }
.quiz-feedback.ok { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
.quiz-feedback.ko { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
.quiz-explanation { margin-top: 10px; font-size: 12.5px; color: var(--text2); padding: 10px 14px; background: var(--surface2); border-radius: 8px; line-height: 1.7; display: none; }
.quiz-explanation.show { display: block; }
.quiz-explanation code { font-family: var(--mono); font-size: 11px; background: #f1f0ec; color: #b45309; padding: 1px 5px; border-radius: 3px; }

/* LESSON NAV */
.lesson-nav { display: flex; align-items: center; gap: 10px; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); }
.nav-prev { padding: 9px 18px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--sans); transition: all 0.15s; }
.nav-prev:hover:not(:disabled) { border-color: var(--text3); color: var(--text); }
.nav-next { padding: 9px 18px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--sans); transition: all 0.15s; margin-left: auto; }
.nav-next.primary { background: var(--text); border-color: var(--text); color: #fff; font-weight: 600; }
.nav-next.primary:hover { background: #2c2b26; }
.mark-done-btn { padding: 9px 18px; border-radius: var(--radius); border: 1px solid #bbf7d0; background: #f0fdf4; color: var(--green); font-size: 13px; cursor: pointer; font-family: var(--sans); font-weight: 500; transition: all 0.15s; }
.mark-done-btn:hover { background: #dcfce7; }

/* ============================================
   EDITOR PANEL — WIDER & ENHANCED
   ============================================ */
.editor-panel { width: var(--editor-width); background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }

.editor-topbar { padding: 0 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; height: 46px; background: var(--surface2); gap: 2px; }
.etab { padding: 0 12px; height: 46px; line-height: 46px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--text3); background: transparent; border: none; border-bottom: 2px solid transparent; font-family: var(--sans); transition: all 0.15s; }
.etab.active { color: var(--accent2); border-bottom-color: var(--accent); }
.editor-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.run-btn { padding: 7px 16px; background: var(--text); color: #fff; border: none; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--sans); display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
.run-btn:hover { background: #2c2b26; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
.clear-btn { padding: 7px 11px; background: transparent; color: var(--text3); border: 1px solid var(--border2); border-radius: 7px; font-size: 12px; cursor: pointer; font-family: var(--sans); transition: all 0.15s; }
.clear-btn:hover { color: var(--red); border-color: #fca5a5; background: #fff8f8; }
.font-size-ctrl { display: flex; align-items: center; gap: 3px; }
.font-sz-btn { width: 26px; height: 26px; background: var(--surface3); border: 1px solid var(--border2); border-radius: 5px; font-size: 11px; cursor: pointer; color: var(--text2); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; }
.font-sz-btn:hover { background: var(--accent-light); color: var(--accent2); }

/* EDITOR BODY */
.editor-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.tab-pane { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.tab-pane.active { display: flex; }

/* CODE EDITOR */
.editor-container { flex: 1; display: flex; overflow: hidden; background: var(--code-bg); position: relative; }
.gutter { display: flex; flex-direction: column; padding: 16px 10px; min-width: 46px; border-right: 1px solid rgba(255,255,255,0.06); user-select: none; background: rgba(255,255,255,0.02); overflow: hidden; }
.gutter-line { font-family: var(--mono); font-size: var(--editor-font-size, 13px); line-height: 1.8; color: rgba(205,214,244,0.2); text-align: right; white-space: nowrap; }
.gutter-line.active-line { color: rgba(205,214,244,0.55); }
textarea#code-editor { flex: 1; background: var(--code-bg); border: none; color: var(--code-text); font-family: var(--mono); font-size: var(--editor-font-size, 13px); padding: 16px 18px; resize: none; outline: none; line-height: 1.8; tab-size: 2; }
.editor-statusbar { display: flex; align-items: center; gap: 12px; padding: 5px 14px; background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.05); font-family: var(--mono); font-size: 10px; color: rgba(205,214,244,0.35); flex-shrink: 0; }
.statusbar-item { display: flex; align-items: center; gap: 4px; }
.statusbar-item .dot { width: 5px; height: 5px; border-radius: 50%; background: #28c840; }

/* CONSOLE */
.console-header { padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.03); font-family: var(--mono); font-size: 11px; color: rgba(205,214,244,0.4); text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0; }
.console-dot { width: 6px; height: 6px; border-radius: 50%; background: #28c840; }
.console-dot.active { animation: pulse 1.2s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.console-log-box { background: var(--code-bg); padding: 14px 16px; font-family: var(--mono); font-size: var(--editor-font-size, 13px); line-height: 1.75; flex: 1; overflow-y: auto; }
.console-log-box::-webkit-scrollbar { width: 4px; }
.console-log-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
.console-line { margin-bottom: 4px; white-space: pre-wrap; display: flex; align-items: flex-start; gap: 10px; color: #a6e3a1; padding: 2px 0; }
.console-line::before { content: '>'; color: rgba(205,214,244,0.25); flex-shrink: 0; margin-top: 1px; }
.console-line.error { color: #f38ba8; }
.console-line.warn { color: #f9e2af; }
.console-line.info { color: #89dceb; }
.console-line.log-obj { color: #cba6f7; }
.console-empty { color: rgba(205,214,244,0.2); font-style: italic; font-size: 12px; }
.console-separator { height: 1px; background: rgba(255,255,255,0.06); margin: 8px 0; }
.exec-time { font-size: 10px; color: rgba(205,214,244,0.3); margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.05); }

/* CHEATSHEET TAB */
.cheatsheet-pane { background: var(--code-bg); flex: 1; overflow-y: auto; padding: 16px; }
.cheatsheet-pane::-webkit-scrollbar { width: 4px; }
.cheatsheet-pane::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
.cs-section { margin-bottom: 18px; }
.cs-title { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(205,214,244,0.4); margin-bottom: 8px; }
.cs-item { font-family: var(--mono); font-size: 11.5px; color: #cdd6f4; line-height: 1.9; display: flex; gap: 8px; }
.cs-item .cs-key { color: #89b4fa; min-width: 140px; flex-shrink: 0; }
.cs-item .cs-val { color: #a6adc8; }

/* CODE BLOCK in lesson */
.code-block { background: var(--code-bg); border-radius: var(--radius-lg); margin: 0 0 20px; overflow: hidden; box-shadow: var(--shadow-md); }
.code-header { display: flex; align-items: center; padding: 10px 16px; background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.06); }
.code-dots { display: flex; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-r { background: #ff5f57; } .dot-y { background: #febc2e; } .dot-g { background: #28c840; }
.code-lang { font-family: var(--mono); font-size: 11px; color: rgba(205,214,244,0.4); margin-left: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.try-btn { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); color: #f59e0b; font-size: 11px; padding: 4px 11px; border-radius: 5px; cursor: pointer; margin-left: auto; font-weight: 500; transition: all 0.15s; font-family: var(--sans); }
.try-btn:hover { background: rgba(245,158,11,0.28); }
.code-body { padding: 18px 20px; font-family: var(--mono); font-size: 12.5px; line-height: 1.8; overflow-x: auto; white-space: pre; color: var(--code-text); }

/* Concept pills */
.concept-pills { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0 20px; }
.concept-pill { font-size: 11.5px; background: var(--surface); border: 1px solid var(--border2); color: var(--text2); padding: 4px 11px; border-radius: 99px; font-weight: 500; }
.concept-pill.accent { background: var(--accent-light); border-color: rgba(217,119,6,0.25); color: var(--accent2); }

/* Keyword highlight grid */
.keyword-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin: 16px 0 20px; }
.keyword-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 12px; font-size: 12px; }
.keyword-card .kw-name { font-family: var(--mono); color: #b45309; font-weight: 600; margin-bottom: 4px; font-size: 12px; }
.keyword-card .kw-desc { color: var(--text3); font-size: 11px; line-height: 1.5; }

@media (max-width: 1100px) { :root { --editor-width: 420px; } }
@media (max-width: 900px) { .sidebar { display: none; } .editor-panel { width: 100%; } }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">JS</div>
    <div class="logo-text">JS Learn <span>50</span></div>
  </div>

    desc:`
<p class="prose">JavaScript utilise une compilation <strong>Just-In-Time (JIT)</strong>. Le moteur (V8, SpiderMonkey) compile le code source en code machine natif juste avant son exécution, offrant des performances proches du code compilé.</p>
<p class="prose">JS est <strong>monothread</strong> : il n'exécute qu'une tâche à la fois. Mais il délègue les tâches asynchrones aux <strong>Web APIs</strong> du navigateur, puis les récupère via la <strong>Event Loop</strong> dès que le thread principal est libre.</p>

<div class="section-divider"><span>Les 3 composants clés</span></div>
<div class="keyword-grid">
  <div class="keyword-card"><div class="kw-name">Call Stack</div><div class="kw-desc">Pile LIFO — exécute le code synchrone séquentiellement</div></div>

  <div class="keyword-card"><div class="kw-name">Event Loop</div><div class="kw-desc">Surveille la pile vide et pousse les callbacks en attente</div></div>
  <div class="keyword-card"><div class="kw-name">Microtask Queue</div><div class="kw-desc">Promises — priorité haute, vidée avant les macrotâches</div></div>
  <div class="keyword-card"><div class="kw-name">Macrotask Queue</div><div class="kw-desc">setTimeout, setInterval, I/O callbacks</div></div>
  <div class="keyword-card"><div class="kw-name">JIT Compiler</div><div class="kw-desc">Compile à la volée les chemins chauds en code machine</div></div>
</div>

<div class="callout info"><div class="callout-icon">ℹ</div><div class="callout-body"><strong>Ordre d'exécution garanti :</strong> Code synchrone → Microtâches (Promises) → Macrotâches (setTimeout). Ce modèle est défini par la spécification ECMA-262.</div></div>

<div class="pitfall-box"><div class="pitfall-title">⚠ Piège fréquent</div>Croire que <code>setTimeout(fn, 0)</code> exécute <code>fn</code> immédiatement. En réalité, le callback passe d'abord dans la file des macrotâches — il attendra que toutes les microtâches soient résolues.</div>`,
    code:`console.log("① Synchrone A");\nsetTimeout(() => console.log("③ Macrotâche (0ms)"), 0);\nPromise.resolve().then(() => console.log("② Microtâche"));\nconsole.log("① Synchrone B");`,

<p class="prose">Le mot-clé <code>let</code> introduit une <strong>portée de bloc</strong> (délimitée par <code>{}</code>). Contrairement à <code>var</code> dont la portée remonte à la fonction entière, <code>let</code> est strictement limité à son bloc.</p>

<div class="callout warn"><div class="callout-icon">⚠</div><div class="callout-body"><strong>Temporal Dead Zone (TDZ) :</strong> Contrairement à <code>var</code> qui renvoie <code>undefined</code>, accéder à une variable <code>let</code> avant sa déclaration lance une <code>ReferenceError</code>. La TDZ commence au début du bloc et se termine à la ligne de déclaration.</div></div>

<div class="callout tip"><div class="callout-icon">✓</div><div class="callout-body"><strong>Pour une vraie immutabilité :</strong> utilisez <code>Object.freeze(obj)</code>. Attention : le gel est <strong>superficiel</strong> — les objets imbriqués restent mutables. Pour un gel profond, il faut une fonction récursive.</div></div>

<div class="callout info"><div class="callout-icon">ℹ</div><div class="callout-body"><strong>Bonne pratique :</strong> Utilisez <code>const</code> par défaut, <code>let</code> uniquement si la variable doit être réassignée, et n'utilisez plus <code>var</code> dans du nouveau code.</div></div>`,
    code:`const user = { nom: "Alice", role: "admin" };\nuser.nom = "Bob";  // ✓ Autorisé\nconsole.log(user);\n// user = {};  // ✗ TypeError\n\nconst liste = [1, 2, 3];\nliste.push(4);\nconsole.log("Tableau modifié :", liste);\n\n// Vraie immutabilité\nconst config = Object.freeze({ debug: true, env: "prod" });\ntry {\n  config.debug = false; // silencieux (ou error en strict mode)\n} catch(e) { console.log(e.message); }\nconsole.log("Config après freeze :", config);`,

    desc:`
<p class="prose"><code>undefined</code> = absence <strong>involontaire</strong> (variable déclarée mais non initialisée, propriété inexistante, paramètre manquant, retour implicite d'une fonction). <code>null</code> = absence <strong>intentionnelle</strong> (vous assignez null pour indiquer « aucune valeur »).</p>

<table class="compare-table">

  <tbody>
    <tr><td>Variable déclarée non initialisée</td><td><code>undefined</code></td></tr>

    <tr><td>Paramètre non fourni</td><td><code>undefined</code></td></tr>
    <tr><td>Retour sans return explicite</td><td><code>undefined</code></td></tr>
    <tr><td>Réinitialisation intentionnelle</td><td><code>null</code></td></tr>
    <tr><td><code>typeof null</code></td><td><code>"object"</code> (bug historique 1995)</td></tr>
  </tbody>
</table>

<div class="callout info"><div class="callout-icon">ℹ</div><div class="callout-body"><strong>Opérateur nullish <code>??</code> :</strong> Retourne le membre droit <strong>uniquement</strong> si le gauche est <code>null</code> ou <code>undefined</code> (pas pour <code>0</code> ou <code>""</code>). Différence clé avec <code>||</code> qui réagit à toute valeur falsy.</div></div>`,
    code:`let a;\nlet b = null;\nconsole.log(typeof a);   // "undefined"\nconsole.log(typeof b);   // "object" (bug !)\nconsole.log(a == b);     // true  (égalité laxiste)\nconsole.log(a === b);    // false (stricte)\n\n// Nullish coalescing\nconst port = 0;\nconsole.log(port || 3000);   // 3000 (0 est falsy)\nconsole.log(port ?? 3000);   // 0 (0 n'est pas null/undefined)`,

    concepts:["Égalité stricte","Coercition implicite","SameValueZero","Object.is"],
    why:"L'usage de == au lieu de === est responsable de nombreux bugs en production.",
    desc:`
<p class="prose"><code>==</code> applique des règles de <strong>coercition complexes</strong> (Abstract Equality Comparison). <code>===</code> compare la valeur ET le type sans conversion — prévisible et sûr. Cas piégeux : <code>NaN === NaN</code> est <code>false</code> !</p>

<table class="compare-table">
  <thead><tr><th>Expression</th><th>== (laxiste)</th><th>=== (stricte)</th></tr></thead>
  <tbody>
    <tr><td><code>5 == "5"</code></td><td><span class="badge-yellow">true</span></td><td><span class="badge-red">false</span></td></tr>
    <tr><td><code>null == undefined</code></td><td><span class="badge-yellow">true</span></td><td><span class="badge-red">false</span></td></tr>
    <tr><td><code>false == 0</code></td><td><span class="badge-yellow">true</span></td><td><span class="badge-red">false</span></td></tr>

    <tr><td><code>NaN === NaN</code></td><td><span class="badge-red">false</span></td><td><span class="badge-red">false</span></td></tr>
    <tr><td><code>Object.is(NaN, NaN)</code></td><td colspan="2"><span class="badge-green">true</span></td></tr>
  </tbody>
</table>

<div class="callout tip"><div class="callout-icon">✓</div><div class="callout-body"><strong>Règle d'or :</strong> Utilisez toujours <code>===</code>. Seule exception admise : <code>val == null</code> teste en une fois <code>null</code> ET <code>undefined</code> (cas documenté et intentionnel).</div></div>`,
    code:`console.log(5 == "5");          // true\nconsole.log(5 === "5");         // false\nconsole.log(null == undefined); // true\nconsole.log(NaN === NaN);       // false !\nconsole.log(Number.isNaN(NaN)); // true (méthode correcte)\nconsole.log(Object.is(NaN, NaN)); // true\nconsole.log(Object.is(0, -0));  // false (distinction !!)`,
    starter:`console.log(false == 0);\nconsole.log(false === 0);\n\n// Tester la maîtrise des égalités\nconsole.log([] == false);  // ?\nconsole.log([] == 0);      // ?\nconsole.log("" == false);  // ?`,
    quiz:{
      q:"Pourquoi préférer === ?",

      answer:1,
      explanation:"<code>===</code> (égalité stricte) ne fait aucune conversion de type — il compare directement la valeur et le type. Son comportement est <strong>prévisible</strong>. <code>==</code> suit un algorithme complexe de coercition qui produit des surprises comme <code>[] == false</code> → <code>true</code>."
    }

    desc:`
<p class="prose">Le <code>switch</code> compare par identité stricte (<code>===</code>). L'omission de <code>break</code> provoque un <strong>fall-through</strong> : le code continue dans les cases suivants jusqu'au prochain break.</p>

<div class="callout tip"><div class="callout-icon">✓</div><div class="callout-body"><strong>Pattern lookup object :</strong> Au lieu d'un long <code>switch</code>, créez un objet <code>{ case1: fn1, case2: fn2 }</code> et appelez <code>handlers[val]?.()</code>. Plus maintenable et extensible.</div></div>`,
    code:`const role = "admin";\nswitch(role) {\n  case "admin": console.log("Accès total"); break;\n  case "user":  console.log("Accès limité"); break;\n  default:      console.log("Refusé");\n}\n\n// Pattern lookup (meilleure pratique)\nconst droits = {\n  admin: () => "Accès total",\n  user:  () => "Accès limité",\n};\nconsole.log((droits[role] ?? (() => "Refusé"))());\n\nconst nom = null ?? "Anonyme";\nconsole.log(nom);`,

    code:`const panier = [{ nom: "Livre", prix: 12 }, { nom: "Stylo", prix: 3 }];\nconst total = panier.reduce((acc, item) => acc + item.prix, 0);\nconsole.log("Total :", total, "€");\n\n// reduce → objet (groupement)\nconst votes = ["A","B","A","C","A","B"];\nconst résultat = votes.reduce((acc, v) => {\n  acc[v] = (acc[v] || 0) + 1;\n  return acc;\n}, {});\nconsole.log(résultat);`,

    code:`function A() { console.log("→ A"); B(); console.log("← A"); }\nfunction B() { console.log("  → B"); C(); console.log("  ← B"); }\nfunction C() { console.log("    → C (feuille)"); }\nA();\n\n// Stack depth : récursion sécurisée\nfunction fact(n, acc = 1) {\n  if (n <= 1) return acc;\n  return fact(n - 1, n * acc); // tail call (si optimisé)\n}\nconsole.log(fact(10));`,

    code:`function présenter(ville, pays) {\n  console.log(\`\${this.nom} — \${ville}, \${pays}\`);\n}\nconst user = { nom: "Sophie" };\nprésenter.call(user, "Paris", "FR");\nprésenter.apply(user, ["Lyon", "FR"]);\nconst prés = présenter.bind(user, "Bordeaux");\nprés("FR"); // arg partiel`,

    code:`const API = id => Promise.resolve({ id, score: id * 10 });\nAPI(5)\n  .then(data => { console.log("Reçu :", data); return data.score; })\n  .then(score => score * 2)\n  .then(final => { if (final > 50) throw new Error("Trop grand !"); return final; })\n  .then(f => console.log("Score x2 :", f))\n  .catch(err => console.error("Erreur :", err.message));`,

    code:`async function charger(id) {\n  await new Promise(r => setTimeout(r, 50));\n  return { id, nom: "Alice" + id };\n}\nasync function main() {\n  console.log("Début");\n  const user = await charger(1);\n  console.log("Utilisateur :", user);\n  \n  // Parallèle\n  const [u2, u3] = await Promise.all([charger(2), charger(3)]);\n  console.log("Parallèle :", u2.nom, u3.nom);\n  console.log("Fin");\n}\nmain();`,

    code:`async function récupérer(url) {\n  try {\n    if (!url) throw new Error("URL manquante");\n    const data = { données: "Contenu de " + url };\n    return data;\n  } catch (e) {\n    console.error("Erreur :", e.message);\n    return null;\n  } finally {\n    console.log("Requête terminée (finally)");\n  }\n}\nasync function main() {\n  const res = await récupérer("");\n  console.log("Résultat :", res);\n  const res2 = await récupérer("api/data");\n  console.log("Résultat :", res2);\n}\nmain();`,

    code:`const r = new Promise(r => setTimeout(() => r("Rapide"), 50));\nconst l = new Promise(r => setTimeout(() => r("Lent"), 200));\nPromise.race([r, l]).then(v => console.log("Race :", v));\nPromise.all([r, l]).then(v => console.log("All :", v));\nPromise.allSettled([Promise.resolve("OK"), Promise.reject("KO")])\n  .then(res => res.forEach(r => console.log(r.status, r.value ?? r.reason)));`,

  <tbody>
    <tr><td>Debounce</td><td>Exécute après N ms d'inactivité</td><td>Recherche, auto-save, validation</td></tr>
    <tr><td>Throttle</td><td>Max 1 exécution par N ms</td><td>Scroll, resize, mousemove, jeux</td></tr>
  </tbody>
</table>`,
    code:`function debounce(fn, délai) {\n  let timer;\n  return (...args) => {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn(...args), délai);\n  };\n}\nfunction throttle(fn, limite) {\n  let dernierAppel = 0;\n  return (...args) => {\n    const now = Date.now();\n    if (now - dernierAppel >= limite) {\n      dernierAppel = now; fn(...args);\n    }\n  };\n}\nconst log = debounce(console.log, 300);\nlog("Appel 1"); log("Appel 2"); log("Appel 3"); // Seul "Appel 3" passe`,

    code:`const animal = { respire: true, manger() { return "Miam"; } };\nconst chien = Object.create(animal);\nchien.aboyer = function() { return "Wouf"; };\nconsole.log(chien.respire); // true (hérité)\nconsole.log(chien.hasOwnProperty("respire")); // false\nconsole.log(chien.hasOwnProperty("aboyer"));  // true\n\n// Chaîne complète d'un tableau\nconsole.log(Object.getPrototypeOf([]) === Array.prototype); // true\nconsole.log(Object.getPrototypeOf(Array.prototype) === Object.prototype); // true`,

    }
    const item = document.createElement('div');
    item.className = `lesson-item ${idx === currentLessonIdx ? 'active' : ''} ${userProgress.has(idx) ? 'done' : ''}`;
    item.onclick = () => { currentLessonIdx = idx; loadLesson(idx); renderLessonList(LESSONS); };
    const num = document.createElement('div');
    num.className = 'lesson-num';
    num.innerText = userProgress.has(idx) ? '✓' : (idx + 1);
    const title = document.createElement('div');
    title.className = 'lesson-title-text';
    title.innerText = lesson.title;
    item.appendChild(num); item.appendChild(title);
    container.appendChild(item);
  });
}

function filterLessons(q) {
  renderLessonList(LESSONS.filter(l => l.title.toLowerCase().includes(q.toLowerCase()) || l.cat.toLowerCase().includes(q.toLowerCase())));
}

// ─── LESSON RENDERING ─────────────────────────────────────────────────
function loadLesson(idx) {
  const L = LESSONS[idx];
  const isDone = userProgress.has(idx);
  const panel = document.getElementById('lesson-panel');
  const pills = L.concepts.map((c, i) => `<span class="concept-pill ${i===0?'accent':''}">${c}</span>`).join('');
  panel.innerHTML = `
    <div class="lesson-eyebrow">
      <span class="lesson-num-badge">Leçon ${idx+1} / 50</span>
      <span class="cat-tag">${L.cat}</span>
    </div>
    <h1 class="lesson-h1">${L.title}</h1>
    <div class="concept-pills">${pills}</div>
    <div class="callout info" style="margin-top:0;margin-bottom:18px;">
      <div class="callout-icon">💡</div>
      <div class="callout-body"><strong>Pourquoi l'apprendre ?</strong> ${L.why}</div>
    </div>
    ${L.desc}
    <div class="section-divider"><span>Exemple de code</span></div>
    <div class="code-block">
      <div class="code-header">
        <div class="code-dots"><div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div></div>
        <span class="code-lang">JavaScript</span>
        <button class="try-btn" onclick="injectExample(${idx})">▶ Ouvrir dans l'éditeur</button>
      </div>
      <div class="code-body">${escapeHTML(L.code)}</div>
    </div>
    <div class="section-divider"><span>Quiz d'assimilation</span></div>
    <div class="quiz-block">
      <div class="quiz-label">Testez votre compréhension</div>
      <div class="quiz-q">${L.quiz.q}</div>
      <div id="quiz-opts">
        ${L.quiz.opts.map((opt,i)=>`<button class="quiz-opt" data-letter="${String.fromCharCode(65+i)}" onclick="checkAnswer(this,${i},${L.quiz.answer})">${opt}</button>`).join('')}
      </div>
      <div class="quiz-feedback" id="quiz-fb"></div>
      <div class="quiz-explanation" id="quiz-exp"></div>
    </div>
    <div class="lesson-nav">
      <button class="nav-prev" onclick="navigateLesson(-1)" ${idx===0?'disabled style="opacity:0.35;cursor:not-allowed;"':''}>← Précédente</button>
      <button class="mark-done-btn" onclick="toggleDone(${idx})">${isDone?'✓ Acquise — annuler':'✓ Marquer acquise'}</button>
      <button class="nav-next primary" onclick="navigateLesson(1)" ${idx===LESSONS.length-1?'disabled style="opacity:0.35;"':''}>Suivante →</button>
    </div>`;
  document.getElementById('code-editor').value = L.starter;
  onEditorInput();
  clearConsole();
  document.getElementById('content-scroll').scrollTop = 0;
  updateCheatsheetForLesson(L);
}

function injectExample(idx) {
  document.getElementById('code-editor').value = LESSONS[idx].code;
  onEditorInput();
  switchTab('playground');
}

function navigateLesson(d) {
  const t = currentLessonIdx + d;
  if (t >= 0 && t < LESSONS.length) { currentLessonIdx = t; loadLesson(t); renderLessonList(LESSONS); }
}

function toggleDone(idx) {
  if (userProgress.has(idx)) userProgress.delete(idx);
  else userProgress.add(idx);
  try { localStorage.setItem('jslearn_v2', JSON.stringify([...userProgress])); } catch(e) {}
  updateProgressBar();
  loadLesson(idx);
  renderLessonList(LESSONS);
}

function updateProgressBar() {
  const n = userProgress.size;
  document.getElementById('progress-fill').style.width = `${(n/LESSONS.length)*100}%`;
  document.getElementById('progress-text').innerText = `${n} / ${LESSONS.length}`;
  document.getElementById('streak-num').innerText = n;
}

function checkAnswer(btn, sel, correct) {
  const fb = document.getElementById('quiz-fb');
  const exp = document.getElementById('quiz-exp');
  document.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
  const L = LESSONS[currentLessonIdx];
  if (sel === correct) {
    btn.classList.add('correct');
    fb.className = 'quiz-feedback show ok';
    fb.innerHTML = '✓ Excellente réponse !';
    if (!userProgress.has(currentLessonIdx)) toggleDone(currentLessonIdx);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.quiz-opt')[correct].classList.add('correct');
    fb.className = 'quiz-feedback show ko';
    fb.innerHTML = '✗ Pas tout à fait — bonne réponse en vert.';
  }
  if (L.quiz.explanation) {
    exp.className = 'quiz-explanation show';
    exp.innerHTML = `<strong>Explication :</strong> ${L.quiz.explanation}`;
  }
}

function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── TABS ─────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-pane').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.etab').forEach(e => e.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  document.getElementById(`tab-btn-${name}`).classList.add('active');
}

// ─── EDITOR ───────────────────────────────────────────────────────────
function onEditorInput() {
  updateGutter();
  updateStatusBar();
}

function updateGutter() {
  const code = document.getElementById('code-editor').value;
  const lines = code.split('\n');
  const gutter = document.getElementById('gutter');
  gutter.innerHTML = lines.map((_, i) =>
    `<div class="gutter-line">${i+1}</div>`
  ).join('');
}

function syncGutter() {
  const editor = document.getElementById('code-editor');
  const gutter = document.getElementById('gutter');
  gutter.scrollTop = editor.scrollTop;
}

function updateStatusBar() {
  const editor = document.getElementById('code-editor');
  const val = editor.value;
  const lines = val.split('\n');
  document.getElementById('char-count').innerText = val.length + ' car.';
  document.getElementById('lines-count').innerText = lines.length + ' ligne' + (lines.length>1?'s':'');
}

function updateCursor() {
  const editor = document.getElementById('code-editor');
  const val = editor.value.substring(0, editor.selectionStart);
  const lines = val.split('\n');
  const ln = lines.length;
  const col = lines[lines.length - 1].length + 1;
  document.getElementById('cursor-pos').innerText = `Ln ${ln}, Col ${col}`;
}

function clearEditor() {
  document.getElementById('code-editor').value = '';
  onEditorInput();
}

function changeFontSize(delta) {
  editorFontSize = Math.max(10, Math.min(20, editorFontSize + delta));
  const editor = document.getElementById('code-editor');
  editor.style.fontSize = editorFontSize + 'px';
  const consoleBox = document.getElementById('console-box');
  consoleBox.style.fontSize = editorFontSize + 'px';
  updateGutter();
}

function clearConsole() {
  document.getElementById('console-box').innerHTML = "<div class='console-empty'>En attente d'exécution… (Ctrl+Entrée)</div>";
  document.getElementById('console-count').innerText = '';
  document.getElementById('console-dot').classList.remove('active');
}

// ─── RUN CODE ─────────────────────────────────────────────────────────
function runCode() {
  const code = document.getElementById('code-editor').value;
  const box = document.getElementById('console-box');
  const dot = document.getElementById('console-dot');
  box.innerHTML = '';
  switchTab('output');
  dot.classList.add('active');
  let logCount = 0;
  const startTime = performance.now();

  const origLog = console.log, origWarn = console.warn, origErr = console.error, origInfo = console.info;

  const append = (msg, cls='') => {
    logCount++;
    const d = document.createElement('div');
    d.className = `console-line ${cls}`;
    if (typeof msg === 'object' && msg !== null) {
      try { d.innerText = JSON.stringify(msg, null, 2); d.className += ' log-obj'; }
      catch(e) { d.innerText = String(msg); }
    } else {
      d.innerText = String(msg);
    }
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
    document.getElementById('console-count').innerText = logCount + ' log' + (logCount>1?'s':'');
  };

  console.log = (...a) => { a.forEach(x => append(x)); origLog(...a); };
  console.warn = (...a) => { a.forEach(x => append(x, 'warn')); origWarn(...a); };
  console.error = (...a) => { a.forEach(x => append(x, 'error')); origErr(...a); };
  console.info = (...a) => { a.forEach(x => append(x, 'info')); origInfo(...a); };

  try {
    new Function(code)();
    const elapsed = (performance.now() - startTime).toFixed(1);
    if (!box.children.length) append('Exécuté — aucun log retourné.', 'warn');
    const sep = document.createElement('div');
    sep.className = 'exec-time';
    sep.innerText = `⏱ Exécution : ${elapsed} ms`;
    box.appendChild(sep);
  } catch(e) {
    append(`${e.name}: ${e.message}`, 'error');
  }

  console.log = origLog; console.warn = origWarn; console.error = origErr; console.info = origInfo;
  dot.classList.remove('active');
}

// ─── KEYBOARD SHORTCUTS ───────────────────────────────────────────────
function setupEditorShortcut() {
  document.getElementById('code-editor').addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = this.selectionStart;
      const indent = '  ';
      this.value = this.value.substring(0, s) + indent + this.value.substring(this.selectionEnd);
      this.selectionStart = this.selectionEnd = s + indent.length;
      onEditorInput();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runCode();
    }
  });
}

// ─── CHEATSHEET ───────────────────────────────────────────────────────
function renderCheatsheet() {
  const pane = document.getElementById('cheatsheet-content');
  pane.innerHTML = Object.entries(CHEATSHEET).map(([section, items]) => `
    <div class="cs-section">
      <div class="cs-title">${section}</div>
      ${items.map(([k, v]) => `
        <div class="cs-item">
          <span class="cs-key">${escapeHTML(k)}</span>
          <span class="cs-val">${escapeHTML(v)}</span>
        </div>`).join('')}
    </div>`).join('');
}
