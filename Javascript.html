   <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprendre JavaScript — 50 Leçons</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #f4f5fa;
  --surface: #ffffff;
  --surface2: #f0f1f8;
  --border: #dde0ef;
  --accent: #6254e8;
  --accent2: #7c6af7;
  --text: #1a1d2e;
  --muted: #6b739a;
  --green: #0e9e6e;
  --amber: #c4870a;
  --red: #d94f4f;
  --code-bg: #eef0f8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 58px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 32px;
  height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: white;
}

.logo-text {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
}

.header-info {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 20px;
}

.progress-bar-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
}

.progress-track {
  width: 120px;
  height: 4px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s;
}

.badge {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--muted);
}

/* MAIN LAYOUT */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* SIDEBAR */
.sidebar {
  width: 72px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 8px;
  flex-shrink: 0;
}

.nav-btn {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all 0.2s;
  position: relative;
}

.nav-btn:hover, .nav-btn.active {
  background: var(--surface2);
  color: var(--accent);
}

.nav-btn.active::before {
  content: '';
  position: absolute;
  left: -1px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 24px;
  background: var(--accent);
  border-radius: 0 3px 3px 0;
}

/* LESSON LIST */
.lessons-panel {
  width: 320px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.search-box {
  margin: 12px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.search-box input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'Sora', sans-serif;
  font-size: 13px;
  width: 100%;
}

.search-box input::placeholder { color: var(--muted); }

.lesson-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.lesson-list::-webkit-scrollbar { width: 4px; }
.lesson-list::-webkit-scrollbar-track { background: transparent; }
.lesson-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.chapter-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  padding: 14px 12px 6px;
}

.lesson-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
}

.lesson-item:hover {
  background: var(--surface2);
}

.lesson-item.active {
  background: rgba(98, 84, 232, 0.08);
  border-color: rgba(98, 84, 232, 0.2);
}

.lesson-num {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--muted);
  transition: all 0.15s;
}

.lesson-item.active .lesson-num,
.lesson-item:hover .lesson-num {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.lesson-item.done .lesson-num {
  background: rgba(14, 158, 110, 0.12);
  border-color: var(--green);
  color: var(--green);
}

.lesson-title {
  font-size: 13px;
  color: var(--text);
  line-height: 1.4;
  flex: 1;
}

.lesson-item.active .lesson-title { color: var(--accent); }

/* CONTENT AREA */
.content-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.lesson-content {
  flex: 1;
  overflow-y: auto;
  padding: 32px 40px;
}

.lesson-content::-webkit-scrollbar { width: 4px; }
.lesson-content::-webkit-scrollbar-track { background: transparent; }
.lesson-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.lesson-header {
  margin-bottom: 28px;
}

.lesson-number-badge {
  font-size: 12px;
  color: var(--accent2);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.lesson-number-badge::before {
  content: '';
  width: 20px;
  height: 1px;
  background: var(--accent);
}

.lesson-h1 {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.3;
}

.lesson-subtitle {
  font-size: 14px;
  color: var(--muted);
}

/* Info blocks */
.info-block {
  display: flex;
  gap: 14px;
  padding: 16px 20px;
  border-radius: 10px;
  margin: 20px 0;
  font-size: 14px;
  line-height: 1.7;
  border: 1px solid;
}

.info-block.concept {
  background: rgba(98, 84, 232, 0.06);
  border-color: rgba(98, 84, 232, 0.2);
  color: #4a3fc0;
}

.info-block.tip {
  background: rgba(14, 158, 110, 0.06);
  border-color: rgba(14, 158, 110, 0.2);
  color: #0a6e4f;
}

.info-block.warn {
  background: rgba(196, 135, 10, 0.06);
  border-color: rgba(196, 135, 10, 0.2);
  color: #8a5e07;
}

.info-icon {
  font-size: 18px;
  flex-shrink: 0;
  margin-top: 1px;
}

.prose {
  font-size: 15px;
  line-height: 1.85;
  color: #3a3f5c;
  margin-bottom: 18px;
}

.prose strong { color: var(--text); font-weight: 600; }

.prose code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  background: rgba(98, 84, 232, 0.1);
  color: var(--accent);
  padding: 1px 6px;
  border-radius: 4px;
}

/* Code block */
.code-block {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin: 20px 0;
  overflow: hidden;
}

.code-header {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: 8px;
}

.code-dots { display: flex; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-r { background: #f87171; }
.dot-y { background: #fbbf24; }
.dot-g { background: #34d399; }

.code-lang {
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.code-copy {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-family: 'Sora', sans-serif;
  transition: all 0.15s;
}

.code-copy:hover { color: var(--text); border-color: var(--accent); }

.code-body {
  padding: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  line-height: 1.7;
  overflow-x: auto;
  color: #2d3152;
  white-space: pre;
}

/* Syntax highlighting */
.kw  { color: #7c3aed; }   /* keywords */
.ty  { color: #2563eb; }   /* types */
.st  { color: #059669; }   /* strings */
.cm  { color: #9ca3af; }   /* comments */
.nm  { color: #d97706; }   /* numbers */
.fn  { color: #6254e8; }   /* functions */
.cls { color: #0284c7; }   /* classes */

/* Lesson nav */
.lesson-nav {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 40px;
  padding-top: 28px;
  border-top: 1px solid var(--border);
}

.nav-arrow {
  padding: 10px 20px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'Sora', sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-arrow:hover { border-color: var(--accent); color: var(--accent); }
.nav-arrow.primary { background: var(--accent); border-color: var(--accent); color: white; margin-left: auto; }
.nav-arrow.primary:hover { background: #5244d0; }

/* EDITOR PANEL */
.editor-panel {
  width: 400px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.editor-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}

.editor-tabs {
  display: flex;
  gap: 2px;
}

.etab {
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.15s;
  border: none;
  background: transparent;
  font-family: 'Sora', sans-serif;
}

.etab.active {
  background: var(--surface2);
  color: var(--text);
}

.run-btn {
  margin-left: auto;
  padding: 6px 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Sora', sans-serif;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s;
}

.run-btn:hover { background: #5244d0; }

.editor-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.tab-pane { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.tab-pane.active { display: flex; }

textarea#code-editor {
  flex: 1;
  background: var(--code-bg);
  border: none;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  padding: 20px;
  resize: none;
  outline: none;
  line-height: 1.7;
  tab-size: 4;
}

.output-box {
  background: var(--code-bg);
  flex: 1;
  overflow: auto;
  padding: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
  color: var(--green);
  border-bottom: 1px solid var(--border);
}

.output-box.empty { color: var(--muted); }

/* AI Assistant */
.ai-pane {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}

.ai-pane.active { display: flex; }

.ai-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--bg);
}

.ai-messages::-webkit-scrollbar { width: 3px; }
.ai-messages::-webkit-scrollbar-thumb { background: var(--border); }

.msg {
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.65;
  max-width: 95%;
}

.msg.user {
  background: rgba(98, 84, 232, 0.1);
  border: 1px solid rgba(98, 84, 232, 0.2);
  color: #3f35b8;
  align-self: flex-end;
}

.msg.ai {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  align-self: flex-start;
}

.msg.ai code {
  font-family: 'JetBrains Mono', monospace;
  background: rgba(98, 84, 232, 0.1);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 12px;
  color: var(--accent);
}

.ai-input-row {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.ai-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-family: 'Sora', sans-serif;
  font-size: 13px;
  outline: none;
  resize: none;
  line-height: 1.5;
  min-height: 40px;
  max-height: 100px;
  transition: border 0.15s;
}

.ai-input:focus { border-color: var(--accent); }
.ai-input::placeholder { color: var(--muted); }

.send-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--accent);
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  flex-shrink: 0;
}

.send-btn:hover { background: #5244d0; }

.typing-indicator {
  display: none;
  align-items: center;
  gap: 4px;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: fit-content;
}

.typing-indicator span {
  width: 6px;
  height: 6px;
  background: var(--muted);
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* Concept grid */
.concept-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0;
}

.concept-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
}

.cc-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 8px;
}

.cc-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: var(--accent);
}

.cc-desc {
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.5;
}

/* Section title */
.section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-weight: 600;
  margin: 28px 0 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Done button */
.done-btn {
  padding: 8px 16px;
  border-radius: 8px;
  background: rgba(14, 158, 110, 0.08);
  border: 1px solid rgba(14, 158, 110, 0.25);
  color: var(--green);
  font-family: 'Sora', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.done-btn:hover { background: rgba(14, 158, 110, 0.15); }

/* Responsive */
@media (max-width: 1100px) {
  .editor-panel { width: 340px; }
  .lessons-panel { width: 280px; }
}

@media (max-width: 800px) {
  .sidebar { display: none; }
  .lessons-panel { width: 100%; position: absolute; z-index: 5; transform: translateX(-100%); transition: transform 0.3s; }
  .lessons-panel.open { transform: none; }
  .editor-panel { display: none; }
}

/* Quiz */
.quiz-block {
  border: 1px solid rgba(98, 84, 232, 0.25);
  border-radius: 10px;
  padding: 18px;
  margin: 20px 0;
  background: rgba(98, 84, 232, 0.04);
}

.quiz-q {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text);
}

.quiz-opt {
  padding: 9px 14px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--surface2);
  margin-bottom: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  transition: all 0.15s;
  display: block;
  width: 100%;
  text-align: left;
  font-family: 'Sora', sans-serif;
}

.quiz-opt:hover  { border-color: var(--accent); color: var(--accent); }
.quiz-opt.correct { border-color: var(--green); background: rgba(14, 158, 110, 0.08); color: var(--green); }
.quiz-opt.wrong   { border-color: var(--red);   background: rgba(217, 79, 79, 0.08);  color: var(--red); }

.quiz-feedback {
  margin-top: 10px;
  font-size: 13px;
  display: none;
}

const lessons = [
  {
    title: "Introduction à JavaScript",
    desc: `
      <p>JavaScript est le <strong>langage de programmation du web</strong>. Il permet d'ajouter de l'interactivité à vos pages HTML : animations, boutons, formulaires dynamiques, jeux, et bien plus encore.</p>
      <p>Il s'exécute directement dans le navigateur, sans installation. C'est pourquoi c'est l'un des langages les plus populaires au monde.</p>
      <p><strong>console.log()</strong> est la première instruction à connaître : elle affiche un message dans la console du navigateur (ouvrez les DevTools avec F12 pour la voir).</p>
      <div class="tip">💡 JavaScript est différent de Java. Ce sont deux langages distincts malgré leur nom similaire.</div>

    code: `// Afficher un message dans la console

    starter: `console.log("Bonjour JavaScript")\nconsole.log("Mon premier programme")`
  },
  {
    title: "Variables avec let",
    desc: `
      <p>Une <strong>variable</strong> est une boîte qui stocke une valeur. Le mot-clé <strong>let</strong> permet de créer une variable dont la valeur peut changer au cours du programme.</p>
      <p>On utilise le symbole <code>=</code> pour <strong>assigner</strong> une valeur. Ce n'est pas une égalité mathématique, c'est une affectation : « mets cette valeur dans cette boîte ».</p>
      <div class="tip">💡 Vous pouvez changer la valeur d'une variable <code>let</code> à n'importe quel moment.</div>
    `,
    code: `let nom = "Ali"
console.log(nom) // Affiche : Ali

// Modifier la variable
nom = "Fatou"
console.log(nom) // Affiche : Fatou`,
    starter: `let prenom = "Votre prénom"\nlet ville = "Dakar"\nconsole.log(prenom)\nconsole.log(ville)`
  },
  {
    title: "Constantes avec const",
    desc: `
      <p><strong>const</strong> crée une variable dont la valeur <strong>ne peut pas être changée</strong> après sa création. On l'utilise pour les valeurs fixes comme l'âge de majorité, un taux de TVA, une couleur de thème.</p>
      <p>Si vous essayez de modifier une <code>const</code>, JavaScript affichera une erreur.</p>
      <div class="warning">⚠️ const ne peut pas être réassignée. Utilisez let si vous devez modifier la valeur plus tard.</div>
      <div class="tip">💡 Bonne pratique : utilisez const par défaut, et let seulement si vous avez besoin de modifier la valeur.</div>
    `,
    code: `const age = 20
console.log(age) // 20

// Ceci provoquerait une erreur :

let currentLesson = 0
let doneLessons = new Set(JSON.parse(localStorage.getItem("doneLessons") || "[]"))

function buildSidebar() {
  const sb = document.getElementById("sidebar")
  sb.innerHTML = ""
  CATEGORIES.forEach(cat => {
    let section = document.createElement("div")
    section.className = "sidebar-section"
    section.textContent = cat.label
    sb.appendChild(section)
    for (let i = cat.range[0]; i <= cat.range[1]; i++) {
      let item = document.createElement("div")
      item.className = "sidebar-item" + (i === currentLesson ? " active" : "") + (doneLessons.has(i) ? " done" : "")
      item.dataset.idx = i
      item.innerHTML = `<span class="num">${String(i+1).padStart(2,"0")}</span><span>${lessons[i].title.replace(/🎓 /,"")}</span>`
      item.addEventListener("click", () => goTo(i))
      sb.appendChild(item)
    }
  })
}

function renderLesson() {
  const l = lessons[currentLesson]
  const panel = document.getElementById("lesson-panel")
  panel.innerHTML = `
    <div class="lesson-number">Leçon ${String(currentLesson+1).padStart(2,"0")} / 50</div>
    <div class="lesson-title">${l.title}</div>
    <div class="lesson-desc">${l.desc}</div>
    <div class="code-block">
      <div class="code-header">
        <span>Exemple</span>
        <button class="try-btn" onclick="loadExample()">Essayer dans le playground →</button>
      </div>
      <pre>${highlight(l.code)}</pre>
    </div>
    <div class="nav-buttons">
      ${currentLesson > 0 ? `<button class="nav-btn prev" onclick="goTo(${currentLesson-1})">← Précédent</button>` : ""}
      ${currentLesson < lessons.length-1 ? `<button class="nav-btn next" onclick="markAndNext()">Suivant →</button>` : `<button class="nav-btn next" onclick="markDone()">✅ Terminer</button>`}
    </div>
  `
  panel.scrollTop = 0
  document.getElementById("editor").value = lessons[currentLesson].starter
  runCode()
  updateProgress()
}

function highlight(code) {
  return code
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\/\/.*/g, m => `<span class="cmt">${m}</span>`)
    .replace(/\b(let|const|var|function|return|if|else|for|while|class|new|this|async|await|import|export|default|switch|case|break|try|catch|finally|extends|super|typeof|of|in)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(console|document|Math|Date|localStorage|JSON|fetch|alert|setTimeout|setInterval|clearInterval)\b/g, '<span class="fn">$1</span>')
    .replace(/"([^"]*)"/g, '<span class="str">"$1"</span>')
    .replace(/`([^`]*)`/g, (m, s) => `<span class="str">\`${s}\`</span>`)
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="num-lit">$1</span>')
}

function goTo(idx) {
  currentLesson = idx
  buildSidebar()
  renderLesson()
}

function markAndNext() {
  doneLessons.add(currentLesson)
  localStorage.setItem("doneLessons", JSON.stringify([...doneLessons]))
  goTo(currentLesson + 1)
}

function markDone() {
  doneLessons.add(currentLesson)
  localStorage.setItem("doneLessons", JSON.stringify([...doneLessons]))
  buildSidebar()
  updateProgress()
  document.getElementById("lesson-panel").querySelector(".nav-btn.next").innerHTML = "✅ Terminé !"
}

function loadExample() {
  document.getElementById("editor").value = lessons[currentLesson].code
  runCode()
}

function updateProgress() {
  const pct = (doneLessons.size / 50 * 100).toFixed(0)
  document.getElementById("progress-fill").style.width = pct + "%"
  document.getElementById("progress-text").textContent = `${doneLessons.size} / 50`
}
