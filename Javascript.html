<style>
:root {
  --bg: #f5f4f0; --surface: #ffffff; --surface2: #f8f7f4; --surface3: #eeede9;
  --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);
  --accent: #d97706; --accent2: #b45309; --accent-dim: rgba(217,119,6,0.09);
  --accent-light: #fef3c7;
  --text: #1a1915; --text2: #5a5750; --text3: #999690; --green: #16a34a;
  --green-dim: rgba(22,163,74,0.1); --red: #dc2626; --blue: #2563eb;
  --code-bg: #1e1e2e; --code-text: #cdd6f4;
  --sans: 'Inter', sans-serif; --mono: 'IBM Plex Mono', monospace;
  --radius: 8px; --radius-lg: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);
  --editor-width: 320px;
  --sidebar-width: 240px;
  --header-height: 50px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-size: 14px; }

/* HEADER */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 14px; height: var(--header-height); display: flex; align-items: center; gap: 12px; flex-shrink: 0; z-index: 100; box-shadow: var(--shadow); }
.logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.logo-mark { width: 28px; height: 28px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 10px; font-weight: 600; color: #fff; letter-spacing: -0.5px; }
.logo-text { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -0.03em; }
.logo-text span { color: var(--accent); }
.header-mid { flex: 1; display: flex; align-items: center; justify-content: center; gap: 14px; }
.progress-wrap { display: flex; align-items: center; gap: 8px; }
.progress-track { width: 140px; height: 3px; background: var(--surface3); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #f59e0b, #d97706); border-radius: 99px; transition: width 0.6s ease; }
.progress-label { font-size: 11px; color: var(--text3); font-family: var(--mono); font-weight: 500; white-space: nowrap; }
.streak-badge { display: flex; align-items: center; gap: 4px; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 20px; padding: 4px 10px; font-size: 11px; color: #c2410c; font-weight: 600; }

/* LAYOUT */
.main { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; transition: transform 0.25s ease, width 0.25s ease; }
.sidebar-top { padding: 10px 10px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.search-row { display: flex; align-items: center; gap: 7px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 7px; padding: 7px 10px; }
.search-row svg { flex-shrink: 0; color: var(--text3); }
.search-row input { background: transparent; border: none; outline: none; color: var(--text); font-family: var(--sans); font-size: 12px; width: 100%; }
.search-row input::placeholder { color: var(--text3); }
.lesson-list-wrap { flex: 1; overflow-y: auto; padding: 4px 6px; scrollbar-width: thin; scrollbar-color: var(--surface3) transparent; }
.lesson-list-wrap::-webkit-scrollbar { width: 4px; }
.lesson-list-wrap::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }
.lesson-list-wrap::-webkit-scrollbar-track { background: transparent; }
.chapter-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent2); padding: 12px 6px 4px; display: flex; align-items: center; gap: 6px; }
.chapter-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.lesson-item { display: flex; align-items: center; gap: 7px; padding: 6px 6px; border-radius: 6px; cursor: pointer; transition: all 0.12s; border: 1px solid transparent; }
.lesson-item:hover { background: var(--surface2); }
.lesson-item.active { background: var(--accent-light); border-color: rgba(217,119,6,0.25); }
.lesson-num { width: 20px; height: 20px; border-radius: 4px; background: var(--surface3); font-size: 8px; font-family: var(--mono); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text3); font-weight: 600; }
.lesson-item.active .lesson-num { background: var(--accent); color: #fff; }
.lesson-item.done .lesson-num { background: #dcfce7; color: var(--green); font-size: 10px; }
.lesson-title-text { font-size: 11.5px; color: var(--text2); line-height: 1.3; flex: 1; }
.lesson-item.active .lesson-title-text { color: var(--accent2); font-weight: 500; }
.lesson-item.done .lesson-title-text { color: var(--text3); }

/* CONTENT */
.content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); min-width: 0; }
.content-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px 32px 36px; scrollbar-width: thin; scrollbar-color: var(--surface3) transparent; }
.content-scroll::-webkit-scrollbar { width: 5px; }
.content-scroll::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }
.content-scroll::-webkit-scrollbar-track { background: transparent; }

.lesson-eyebrow { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
.lesson-num-badge { font-family: var(--mono); font-size: 10px; color: var(--accent2); background: var(--accent-light); border: 1px solid rgba(217,119,6,0.2); border-radius: 4px; padding: 2px 8px; font-weight: 600; }
.cat-tag { font-size: 10px; color: var(--text3); background: var(--surface); border: 1px solid var(--border2); border-radius: 4px; padding: 2px 8px; font-weight: 500; }
.lesson-h1 { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 16px; }

.prose { font-size: 13.5px; line-height: 1.8; color: var(--text2); margin-bottom: 12px; }
.prose strong { color: var(--text); font-weight: 600; }
.prose code { font-family: var(--mono); font-size: 11.5px; background: #f1f0ec; color: #b45309; padding: 2px 5px; border-radius: 3px; border: 1px solid #e5e3dc; }
.prose ul { padding-left: 18px; margin-bottom: 12px; }
.prose li { margin-bottom: 5px; color: var(--text2); }
.prose ol { padding-left: 18px; margin-bottom: 12px; }

.callout { display: flex; gap: 10px; padding: 11px 14px; border-radius: var(--radius-lg); margin: 14px 0; font-size: 13px; line-height: 1.7; border-left: 3px solid; background: var(--surface); box-shadow: var(--shadow); }
.callout.tip { border-color: var(--green); }
.callout.warn { border-color: #f59e0b; }
.callout.info { border-color: var(--blue); }
.callout.danger { border-color: var(--red); background: #fff8f8; }
.callout-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.callout-body { color: var(--text2); font-size: 13px; }
.callout-body strong { color: var(--text); }

.section-divider { display: flex; align-items: center; gap: 8px; margin: 22px 0 12px; }
.section-divider span { font-size: 9px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text3); font-weight: 700; white-space: nowrap; }
.section-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* COMPARISON TABLE */
.compare-table { width: 100%; border-collapse: collapse; margin: 14px 0 18px; font-size: 12.5px; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
.compare-table th { background: var(--surface3); padding: 9px 12px; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); font-weight: 700; }
.compare-table td { padding: 9px 12px; border-top: 1px solid var(--border); color: var(--text2); vertical-align: top; }
.compare-table td code { font-family: var(--mono); font-size: 11px; background: #f1f0ec; color: #b45309; padding: 1px 4px; border-radius: 3px; }
.compare-table tr:hover td { background: var(--surface2); }
.badge-green { display: inline-block; background: #dcfce7; color: #15803d; font-size: 9px; padding: 1px 6px; border-radius: 99px; font-weight: 700; }
.badge-red { display: inline-block; background: #fee2e2; color: #b91c1c; font-size: 9px; padding: 1px 6px; border-radius: 99px; font-weight: 700; }
.badge-yellow { display: inline-block; background: #fef9c3; color: #854d0e; font-size: 9px; padding: 1px 6px; border-radius: 99px; font-weight: 700; }

/* STEPS */
.steps-list { counter-reset: step; list-style: none; padding: 0; margin: 14px 0 18px; }
.steps-list li { counter-increment: step; display: flex; gap: 12px; margin-bottom: 10px; align-items: flex-start; }
.steps-list li::before { content: counter(step); width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; font-family: var(--mono); }
.steps-list li .step-text { color: var(--text2); font-size: 13px; line-height: 1.7; padding-top: 1px; }
.steps-list li .step-text code { font-family: var(--mono); font-size: 11px; background: #f1f0ec; color: #b45309; padding: 1px 4px; border-radius: 3px; }

/* PITFALLS */
.pitfall-box { background: #fff8f8; border: 1px solid #fecaca; border-radius: var(--radius-lg); padding: 12px 14px; margin: 14px 0; font-size: 12.5px; line-height: 1.7; }
.pitfall-box .pitfall-title { font-weight: 700; color: var(--red); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
.pitfall-box code { font-family: var(--mono); font-size: 11px; background: #fee2e2; color: #b91c1c; padding: 1px 4px; border-radius: 3px; }

/* QUIZ */
.quiz-block { border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 16px; margin: 0; background: var(--surface); box-shadow: var(--shadow); }
.quiz-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent2); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
.quiz-label::before { content: ''; display: inline-block; width: 5px; height: 5px; background: var(--accent); border-radius: 50%; }
.quiz-q { font-size: 13.5px; font-weight: 600; margin-bottom: 12px; color: var(--text); line-height: 1.5; }
.quiz-opt { padding: 9px 12px; border-radius: 7px; border: 1px solid var(--border2); background: var(--surface2); margin-bottom: 7px; cursor: pointer; font-size: 12.5px; color: var(--text2); text-align: left; width: 100%; display: flex; align-items: center; gap: 8px; transition: all 0.15s; font-family: var(--sans); }
.quiz-opt::before { content: attr(data-letter); font-family: var(--mono); font-size: 10px; font-weight: 700; background: var(--surface3); color: var(--text3); width: 20px; height: 20px; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.quiz-opt:hover:not(:disabled) { border-color: var(--accent); color: var(--text); background: var(--accent-light); }
.quiz-opt.correct { border-color: var(--green); background: #f0fdf4; color: #15803d; }
.quiz-opt.correct::before { background: #dcfce7; color: var(--green); }
.quiz-opt.wrong { border-color: var(--red); background: #fef2f2; color: #b91c1c; }
.quiz-opt.wrong::before { background: #fee2e2; color: var(--red); }
.quiz-feedback { margin-top: 10px; font-size: 12.5px; display: none; padding: 9px 12px; border-radius: 7px; font-weight: 500; }
.quiz-feedback.show { display: flex; align-items: center; gap: 7px; }
.quiz-feedback.ok { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
.quiz-feedback.ko { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
.quiz-explanation { margin-top: 8px; font-size: 12px; color: var(--text2); padding: 9px 12px; background: var(--surface2); border-radius: 7px; line-height: 1.7; display: none; }
.quiz-explanation.show { display: block; }
.quiz-explanation code { font-family: var(--mono); font-size: 10.5px; background: #f1f0ec; color: #b45309; padding: 1px 4px; border-radius: 3px; }

/* LESSON NAV */
.lesson-nav { display: flex; align-items: center; gap: 8px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); }
.nav-prev { padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-size: 12px; font-weight: 500; cursor: pointer; font-family: var(--sans); transition: all 0.15s; }
.nav-prev:hover:not(:disabled) { border-color: var(--text3); color: var(--text); }
.nav-next { padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-size: 12px; font-weight: 500; cursor: pointer; font-family: var(--sans); transition: all 0.15s; margin-left: auto; }
.nav-next.primary { background: var(--text); border-color: var(--text); color: #fff; font-weight: 600; }
.nav-next.primary:hover { background: #2c2b26; }
.mark-done-btn { padding: 8px 14px; border-radius: var(--radius); border: 1px solid #bbf7d0; background: #f0fdf4; color: var(--green); font-size: 12px; cursor: pointer; font-family: var(--sans); font-weight: 500; transition: all 0.15s; }
.mark-done-btn:hover { background: #dcfce7; }

/* ============================================
   EDITOR PANEL — RÉDUIT
   ============================================ */
.editor-panel { width: var(--editor-width); background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.25s ease; }

.editor-topbar { padding: 0 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; height: 40px; background: var(--surface2); gap: 1px; flex-wrap: nowrap; }
.etab { padding: 0 9px; height: 40px; line-height: 40px; font-size: 11.5px; font-weight: 500; cursor: pointer; color: var(--text3); background: transparent; border: none; border-bottom: 2px solid transparent; font-family: var(--sans); transition: all 0.15s; white-space: nowrap; }
.etab.active { color: var(--accent2); border-bottom-color: var(--accent); }
.editor-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.run-btn { padding: 5px 12px; background: var(--text); color: #fff; border: none; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: var(--sans); display: flex; align-items: center; gap: 5px; transition: all 0.15s; }
.run-btn:hover { background: #2c2b26; }
.clear-btn { padding: 5px 8px; background: transparent; color: var(--text3); border: 1px solid var(--border2); border-radius: 6px; font-size: 11px; cursor: pointer; font-family: var(--sans); transition: all 0.15s; }
.clear-btn:hover { color: var(--red); border-color: #fca5a5; background: #fff8f8; }
.font-size-ctrl { display: flex; align-items: center; gap: 2px; }
.font-sz-btn { width: 22px; height: 22px; background: var(--surface3); border: 1px solid var(--border2); border-radius: 4px; font-size: 10px; cursor: pointer; color: var(--text2); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; }
.font-sz-btn:hover { background: var(--accent-light); color: var(--accent2); }

/* EDITOR BODY */
.editor-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.tab-pane { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.tab-pane.active { display: flex; }

/* CODE EDITOR */
.editor-container { flex: 1; display: flex; overflow: hidden; background: var(--code-bg); position: relative; }
.gutter { display: flex; flex-direction: column; padding: 14px 8px; min-width: 38px; border-right: 1px solid rgba(255,255,255,0.06); user-select: none; background: rgba(255,255,255,0.02); overflow: hidden; }
.gutter-line { font-family: var(--mono); font-size: var(--editor-font-size, 12px); line-height: 1.8; color: rgba(205,214,244,0.2); text-align: right; white-space: nowrap; }
.gutter-line.active-line { color: rgba(205,214,244,0.55); }
textarea#code-editor { flex: 1; background: var(--code-bg); border: none; color: var(--code-text); font-family: var(--mono); font-size: var(--editor-font-size, 12px); padding: 14px 14px; resize: none; outline: none; line-height: 1.8; tab-size: 2; }
.editor-statusbar { display: flex; align-items: center; gap: 10px; padding: 4px 10px; background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.05); font-family: var(--mono); font-size: 9px; color: rgba(205,214,244,0.35); flex-shrink: 0; }
.statusbar-item { display: flex; align-items: center; gap: 3px; }
.statusbar-item .dot { width: 4px; height: 4px; border-radius: 50%; background: #28c840; }

/* CONSOLE */
.console-header { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.03); font-family: var(--mono); font-size: 10px; color: rgba(205,214,244,0.4); text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0; }
.console-dot { width: 5px; height: 5px; border-radius: 50%; background: #28c840; }
.console-dot.active { animation: pulse 1.2s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.console-log-box { background: var(--code-bg); padding: 12px 14px; font-family: var(--mono); font-size: var(--editor-font-size, 12px); line-height: 1.75; flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
.console-log-box::-webkit-scrollbar { width: 3px; }
.console-log-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
.console-line { margin-bottom: 3px; white-space: pre-wrap; display: flex; align-items: flex-start; gap: 8px; color: #a6e3a1; padding: 2px 0; }
.console-line::before { content: '>'; color: rgba(205,214,244,0.25); flex-shrink: 0; margin-top: 1px; }
.console-line.error { color: #f38ba8; }
.console-line.warn { color: #f9e2af; }
.console-line.info { color: #89dceb; }
.console-line.log-obj { color: #cba6f7; }
.console-empty { color: rgba(205,214,244,0.2); font-style: italic; font-size: 11px; }
.console-separator { height: 1px; background: rgba(255,255,255,0.06); margin: 6px 0; }
.exec-time { font-size: 9px; color: rgba(205,214,244,0.3); margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,0.05); }

/* CHEATSHEET TAB */
.cheatsheet-pane { background: var(--code-bg); flex: 1; overflow-y: auto; padding: 12px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
.cheatsheet-pane::-webkit-scrollbar { width: 3px; }
.cheatsheet-pane::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
.cs-section { margin-bottom: 14px; }
.cs-title { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(205,214,244,0.4); margin-bottom: 6px; }
.cs-item { font-family: var(--mono); font-size: 10.5px; color: #cdd6f4; line-height: 1.9; display: flex; gap: 6px; }
.cs-item .cs-key { color: #89b4fa; min-width: 120px; flex-shrink: 0; }
.cs-item .cs-val { color: #a6adc8; }

/* CODE BLOCK in lesson */
.code-block { background: var(--code-bg); border-radius: var(--radius-lg); margin: 0 0 18px; overflow: hidden; box-shadow: var(--shadow-md); }
.code-header { display: flex; align-items: center; padding: 8px 14px; background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.06); }
.code-dots { display: flex; gap: 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; }
.dot-r { background: #ff5f57; } .dot-y { background: #febc2e; } .dot-g { background: #28c840; }
.code-lang { font-family: var(--mono); font-size: 10px; color: rgba(205,214,244,0.4); margin-left: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.try-btn { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); color: #f59e0b; font-size: 10px; padding: 3px 9px; border-radius: 4px; cursor: pointer; margin-left: auto; font-weight: 500; transition: all 0.15s; font-family: var(--sans); }
.try-btn:hover { background: rgba(245,158,11,0.28); }
.code-body { padding: 14px 16px; font-family: var(--mono); font-size: 11.5px; line-height: 1.8; overflow-x: auto; white-space: pre; color: var(--code-text); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }

/* Concept pills */
.concept-pills { display: flex; flex-wrap: wrap; gap: 5px; margin: 12px 0 16px; }
.concept-pill { font-size: 11px; background: var(--surface); border: 1px solid var(--border2); color: var(--text2); padding: 3px 9px; border-radius: 99px; font-weight: 500; }
.concept-pill.accent { background: var(--accent-light); border-color: rgba(217,119,6,0.25); color: var(--accent2); }

/* Keyword grid */
.keyword-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; margin: 14px 0 18px; }
.keyword-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 7px; padding: 8px 10px; font-size: 11.5px; }
.keyword-card .kw-name { font-family: var(--mono); color: #b45309; font-weight: 600; margin-bottom: 3px; font-size: 11.5px; }
.keyword-card .kw-desc { color: var(--text3); font-size: 10.5px; line-height: 1.5; }

/* MOBILE TOGGLE */
.sidebar-toggle { display: none; background: var(--surface); border: 1px solid var(--border2); border-radius: 6px; padding: 5px 8px; cursor: pointer; font-size: 11px; color: var(--text2); font-family: var(--sans); align-items: center; gap: 5px; flex-shrink: 0; }
.editor-toggle { display: none; background: var(--surface); border: 1px solid var(--border2); border-radius: 6px; padding: 5px 8px; cursor: pointer; font-size: 11px; color: var(--text2); font-family: var(--sans); align-items: center; gap: 5px; flex-shrink: 0; }

/* OVERLAY (mobile) */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; }
.overlay.active { display: block; }

/* ============ RESPONSIVE ============ */
@media (max-width: 1100px) {
  :root { --editor-width: 280px; --sidebar-width: 220px; }
}
@media (max-width: 900px) {
  :root { --editor-width: 260px; }
  .sidebar { display: none; }
  .sidebar-toggle { display: flex; }
  .progress-track { width: 100px; }
}
@media (max-width: 700px) {
  :root { --editor-width: 0px; --header-height: 48px; }
  .header { padding: 0 10px; gap: 8px; }
  .progress-wrap { display: none; }
  .streak-badge { padding: 3px 8px; }
  .content-scroll { padding: 16px 16px 28px; }
  .lesson-h1 { font-size: 18px; }
  .editor-panel { display: none; position: fixed; right: 0; top: var(--header-height); bottom: 0; width: 100% !important; z-index: 300; max-width: 480px; }
  .editor-panel.mobile-open { display: flex; }
  .editor-toggle { display: flex; }
  .sidebar { position: fixed; left: 0; top: var(--header-height); bottom: 0; width: 260px !important; z-index: 250; display: flex; transform: translateX(-100%); transition: transform 0.25s ease; }
  .sidebar.mobile-open { transform: translateX(0); }
  .overlay.active { display: block; }
  .main { overflow: hidden; }
}
@media (max-width: 480px) {
  .etab { padding: 0 7px; font-size: 10.5px; }
  .editor-topbar { padding: 0 8px; }
}

<div class="header">
  <div class="logo">
    <div class="logo-mark">JS</div>
    <div class="logo-text">JS Learn <span>50</span></div>
  </div>
  <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Menu des leçons">☰ Leçons</button>
  <div class="header-mid">
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-label"><span id="progress-text">0 / 50</span> acquises</div>
    </div>
  </div>
  <button class="editor-toggle" onclick="toggleEditor()" aria-label="Ouvrir l'éditeur">⌨ Éditeur</button>

</div>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<div class="main">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="search-row">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="search-input" type="text" placeholder="Filtrer les leçons..." oninput="filterLessons(this.value)">

  <!-- EDITOR PANEL -->
  <div class="editor-panel" id="editor-panel">
    <div class="editor-topbar">
      <button class="etab active" id="tab-btn-playground" onclick="switchTab('playground')">Éditeur</button>

        <button class="run-btn" onclick="runCode()">
          <svg width="10" height="10" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>

<script>
const LESSONS = [
  {
    cat:"1. Les Fondations",
    title:"Introduction & Architecture Moteur",
    concepts:["JIT Compilation","Event Loop","Monothread","V8 / SpiderMonkey"],
    why:"Comprendre le moteur JS vous permet d'écrire du code plus performant et d'anticiper l'ordre d'exécution — une compétence clé pour tout développeur sérieux.",
    desc:`
<p class="prose">JavaScript utilise une compilation <strong>Just-In-Time (JIT)</strong>. Le moteur (V8, SpiderMonkey) compile le code source en code machine natif juste avant son exécution, offrant des performances proches du code compilé.</p>
<p class="prose">JS est <strong>monothread</strong> : il n'exécute qu'une tâche à la fois. Mais il délègue les tâches asynchrones aux <strong>Web APIs</strong> du navigateur, puis les récupère via la <strong>Event Loop</strong> dès que le thread principal est libre.</p>

<div class="section-divider"><span>Les 3 composants clés</span></div>
<div class="keyword-grid">
  <div class="keyword-card"><div class="kw-name">Call Stack</div><div class="kw-desc">Pile LIFO — exécute le code synchrone séquentiellement</div></div>
  <div class="keyword-card"><div class="kw-name">Web APIs</div><div class="kw-desc">setTimeout, fetch, DOM events — fournis par le navigateur</div></div>
  <div class="keyword-card"><div class="kw-name">Event Loop</div><div class="kw-desc">Surveille la pile vide et pousse les callbacks en attente</div></div>
  <div class="keyword-card"><div class="kw-name">Microtask Queue</div><div class="kw-desc">Promises — priorité haute, vidée avant les macrotâches</div></div>
  <div class="keyword-card"><div class="kw-name">Macrotask Queue</div><div class="kw-desc">setTimeout, setInterval, I/O callbacks</div></div>
  <div class="keyword-card"><div class="kw-name">JIT Compiler</div><div class="kw-desc">Compile à la volée les chemins chauds en code machine</div></div>
</div>

<div class="callout info"><div class="callout-icon">ℹ</div><div class="callout-body"><strong>Ordre d'exécution garanti :</strong> Code synchrone → Microtâches (Promises) → Macrotâches (setTimeout). Ce modèle est défini par la spécification ECMA-262.</div></div>

<div class="pitfall-box"><div class="pitfall-title">⚠ Piège fréquent</div>Croire que <code>setTimeout(fn, 0)</code> exécute <code>fn</code> immédiatement. En réalité, le callback passe d'abord dans la file des macrotâches — il attendra que toutes les microtâches soient résolues.</div>`,
    code:`console.log("① Synchrone A");\nsetTimeout(() => console.log("③ Macrotâche (0ms)"), 0);\nPromise.resolve().then(() => console.log("② Microtâche"));\nconsole.log("① Synchrone B");`,
    starter:`// Prédisez l'ordre avant d'exécuter !\nconsole.log("1. Start");\nsetTimeout(() => console.log("4. setTimeout 0ms"), 0);\nPromise.resolve()\n  .then(() => console.log("2. Promise 1"))\n  .then(() => console.log("3. Promise 2"));\nconsole.log("1. End");`,
    quiz:{
      q:"Quel composant gère les tâches non bloquantes et les réintroduit dans le flux d'exécution ?",
      opts:["Le compilateur JIT","L'Event Loop","Le Garbage Collector","Le multi-thread"],
      answer:1,
      explanation:"L'Event Loop surveille en permanence la Call Stack. Quand elle est vide, il prend le prochain callback de la file des microtâches (puis macrotâches) et le pousse dans la pile pour exécution."
    }
  },
  {
    cat:"1. Les Fondations",
    title:"Variables & Block Scope (let)",
    concepts:["Temporal Dead Zone","Portée de bloc","Hoisting partiel","ReferenceError"],
    why:"La TDZ est l'une des erreurs les plus fréquentes chez les débutants. Maîtriser la portée évite des bugs subtils en production.",
    desc:`
<p class="prose">Le mot-clé <code>let</code> introduit une <strong>portée de bloc</strong> (délimitée par <code>{}</code>). Contrairement à <code>var</code> dont la portée remonte à la fonction entière, <code>let</code> est strictement limité à son bloc.</p>

<div class="section-divider"><span>Comparaison var / let / const</span></div>
<table class="compare-table">
  <thead><tr><th>Aspect</th><th>var</th><th>let</th><th>const</th></tr></thead>
  <tbody>
    <tr><td>Portée</td><td>Fonction</td><td>Bloc <code>{}</code></td><td>Bloc <code>{}</code></td></tr>
    <tr><td>Hoisting</td><td><span class="badge-yellow">undefined</span></td><td><span class="badge-red">TDZ (ReferenceError)</span></td><td><span class="badge-red">TDZ (ReferenceError)</span></td></tr>
    <tr><td>Réassignation</td><td><span class="badge-green">Oui</span></td><td><span class="badge-green">Oui</span></td><td><span class="badge-red">Non</span></td></tr>
    <tr><td>Redéclaration</td><td><span class="badge-green">Oui</span></td><td><span class="badge-red">Non</span></td><td><span class="badge-red">Non</span></td></tr>
    <tr><td>Global (window)</td><td><span class="badge-yellow">Pollue window</span></td><td><span class="badge-green">Non</span></td><td><span class="badge-green">Non</span></td></tr>
  </tbody>
</table>

<div class="callout warn"><div class="callout-icon">⚠</div><div class="callout-body"><strong>Temporal Dead Zone (TDZ) :</strong> Contrairement à <code>var</code> qui renvoie <code>undefined</code>, accéder à une variable <code>let</code> avant sa déclaration lance une <code>ReferenceError</code>. La TDZ commence au début du bloc et se termine à la ligne de déclaration.</div></div>

<div class="pitfall-box"><div class="pitfall-title">⚠ Piège classique — var dans une boucle</div>
<code>for (var i = 0; i &lt; 3; i++) { setTimeout(() => console.log(i), 0); }</code><br>
Affiche <code>3, 3, 3</code> car <code>var</code> est partagé. Avec <code>let</code> → affiche <code>0, 1, 2</code> car chaque itération crée un scope propre.</div>`,
    code:`if (true) {\n  let secret = "1234";\n  console.log("Dans le bloc :", secret);\n}\n// console.log(secret); // ReferenceError !\n\n// Démonstration TDZ\ntry {\n  console.log(avant); // ← TDZ\n  let avant = "déclaré";\n} catch(e) {\n  console.log(e.constructor.name + ":", e.message);\n}`,
    starter:`// Testez la différence var vs let\nfor (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log("var:", i), 0);\n}\n\nfor (let j = 0; j < 3; j++) {\n  setTimeout(() => console.log("let:", j), 0);\n}`,
    quiz:{
      q:"Que se passe-t-il lorsqu'on accède à une variable 'let' avant sa déclaration ?",
      opts:["Elle vaut undefined","Elle vaut null","Une ReferenceError est levée","Elle vaut 0"],
      answer:2,
      explanation:"Avec <code>let</code> (et <code>const</code>), la variable est en Temporal Dead Zone depuis le début du bloc jusqu'à sa ligne de déclaration. Toute tentative d'accès dans cette zone déclenche une <code>ReferenceError</code>, contrairement à <code>var</code> qui retournerait <code>undefined</code>."
    }
  },
  {
    cat:"1. Les Fondations",
    title:"Immuabilité des Références (const)",
    concepts:["Référence vs valeur","Mutabilité interne","Assignation interdite"],
    why:"Confondre const et vraie immutabilité cause des bugs : un tableau const peut être vidé avec .splice() !",
    desc:`
<p class="prose">Le mot-clé <code>const</code> protège la <strong>référence mémoire</strong>, non le contenu. Vous ne pouvez pas réassigner la variable, mais vous pouvez librement modifier les propriétés d'un objet ou les éléments d'un tableau.</p>

<div class="section-divider"><span>Référence vs Contenu</span></div>
<table class="compare-table">
  <thead><tr><th>Opération</th><th>Autorisé avec const ?</th></tr></thead>
  <tbody>
    <tr><td><code>const x = 5; x = 10;</code></td><td><span class="badge-red">TypeError</span></td></tr>
    <tr><td><code>const obj = {}; obj.a = 1;</code></td><td><span class="badge-green">✓ Oui</span></td></tr>
    <tr><td><code>const arr = []; arr.push(1);</code></td><td><span class="badge-green">✓ Oui</span></td></tr>
    <tr><td><code>const obj = {}; obj = {};</code></td><td><span class="badge-red">TypeError</span></td></tr>
  </tbody>
</table>

<div class="callout tip"><div class="callout-icon">✓</div><div class="callout-body"><strong>Pour une vraie immutabilité :</strong> utilisez <code>Object.freeze(obj)</code>. Attention : le gel est <strong>superficiel</strong> — les objets imbriqués restent mutables. Pour un gel profond, il faut une fonction récursive.</div></div>

<div class="callout info"><div class="callout-icon">ℹ</div><div class="callout-body"><strong>Bonne pratique :</strong> Utilisez <code>const</code> par défaut, <code>let</code> uniquement si la variable doit être réassignée, et n'utilisez plus <code>var</code> dans du nouveau code.</div></div>`,
    code:`const user = { nom: "Alice", role: "admin" };\nuser.nom = "Bob";  // ✓ Autorisé\nconsole.log(user);\n// user = {};  // ✗ TypeError\n\nconst liste = [1, 2, 3];\nliste.push(4);\nconsole.log("Tableau modifié :", liste);\n\n// Vraie immutabilité\nconst config = Object.freeze({ debug: true, env: "prod" });\ntry {\n  config.debug = false;\n} catch(e) { console.log(e.message); }\nconsole.log("Config après freeze :", config);`,
    starter:`const liste = [1, 2, 3];\nliste.push(4);\nconsole.log(liste);\n\n// Essayez de réassigner liste :\n// liste = []; // TypeError !`,
    quiz:{
      q:"Qu'est-ce qui est strictement interdit avec const ?",
      opts:["Modifier une propriété","Ajouter un élément","Réassigner la variable elle-même","Appeler une méthode"],
      answer:2,
      explanation:"<code>const</code> lie un nom à une adresse mémoire — cette liaison est permanente. Mais le contenu pointé par cette adresse (objet, tableau) peut être modifié librement. Seule la <strong>réassignation</strong> (changer l'adresse) est interdite."
    }
  },
  {
    cat:"1. Les Fondations",
    title:"Le Type Number & Standard IEEE 754",
    concepts:["IEEE 754 64-bit","Imprécision flottante","NaN","Number.EPSILON"],
    why:"0.1 + 0.2 ≠ 0.3 en JS — ce bug de précision plante des systèmes de paiement si on ne le connaît pas.",
    desc:`
<p class="prose">En JS, tous les nombres sont des <strong>flottants 64 bits</strong> (norme IEEE 754 double précision). La représentation binaire génère des imprécisions : <code>0.1 + 0.2 = 0.30000000000000004</code>.</p>

<div class="section-divider"><span>Valeurs spéciales</span></div>
<table class="compare-table">
  <thead><tr><th>Valeur</th><th>Description</th><th>Exemple</th></tr></thead>
  <tbody>
    <tr><td><code>NaN</code></td><td>Not a Number — résultat d'opération invalide</td><td><code>"abc" * 2</code></td></tr>
    <tr><td><code>Infinity</code></td><td>Dépassement positif</td><td><code>1 / 0</code></td></tr>
    <tr><td><code>-Infinity</code></td><td>Dépassement négatif</td><td><code>-1 / 0</code></td></tr>
    <tr><td><code>Number.MAX_SAFE_INTEGER</code></td><td>2⁵³ − 1 (max entier exact)</td><td><code>9007199254740991</code></td></tr>
    <tr><td><code>Number.EPSILON</code></td><td>Plus petit delta entre 1 et le suivant</td><td><code>2.22e-16</code></td></tr>
  </tbody>
</table>

<div class="callout tip"><div class="callout-icon">✓</div><div class="callout-body"><strong>Calculs monétaires :</strong> Travaillez en <strong>centimes entiers</strong> et divisez par 100 à l'affichage. Pour des besoins critiques, utilisez la bibliothèque <strong>Decimal.js</strong> ou <strong>BigInt</strong> pour les très grands entiers.</div></div>

<div class="pitfall-box"><div class="pitfall-title">⚠ Piège — NaN n'est pas égal à lui-même</div>
<code>NaN === NaN</code> retourne <code>false</code>. Utilisez <code>Number.isNaN(val)</code> (et non <code>isNaN()</code> global qui coerce d'abord en Number).</div>`,
    code:`console.log(0.1 + 0.2);\nconsole.log((0.1+0.2).toFixed(2));\nconst delta = Math.abs((0.1+0.2) - 0.3);\nconsole.log("delta < EPSILON :", delta < Number.EPSILON);\n\nconsole.log("\\n--- Valeurs spéciales ---");\nconsole.log(1/0, -1/0, "abc"*2);\nconsole.log(Number.isNaN(NaN));\nconsole.log(Number.isNaN("hello"));`,
    starter:`let prix = 19.99;\nconsole.log("TVA :", (prix * 0.2).toFixed(2));\n\n// Calcul monétaire correct (en centimes)\nlet prixCentimes = 1999;\nlet tva = Math.round(prixCentimes * 0.2);\nconsole.log("TVA exacte :", tva / 100, "€");`,
    quiz:{
      q:"Méthode recommandée pour stocker des prix sans perte de précision ?",
      opts:["En String","En centimes (entiers)","Avec Math.round","En Float 32"],
      answer:1,
      explanation:"Stocker les montants en centimes (ex. 19.99€ = 1999) garantit des opérations sur des entiers exacts. Les entiers JavaScript sont exacts jusqu'à <code>Number.MAX_SAFE_INTEGER</code> (9 quadrillions de centimes). <code>Math.round</code> et <code>toFixed()</code> sont des palliatifs, non des solutions de fond."
    }
  },
  {
    cat:"1. Les Fondations",
    title:"Chaînes de caractères & Coercition",
    concepts:["Coercition de type","Opérateur +","Concaténation","typeof"],
    why:"La coercition implicite de JS est la source de 30% des bugs débutants.",
    desc:`
<p class="prose">L'opérateur <code>+</code> déclenche une coercition vers <code>String</code> dès qu'un opérande est une chaîne. Les opérateurs <code>-</code>, <code>*</code>, <code>/</code> forcent la conversion vers <code>Number</code>.</p>

<table class="compare-table">
  <thead><tr><th>Expression</th><th>Résultat</th><th>Explication</th></tr></thead>
  <tbody>
    <tr><td><code>"10" + 5</code></td><td><code>"105"</code></td><td>String + Number → concaténation</td></tr>
    <tr><td><code>"10" - 5</code></td><td><code>5</code></td><td><code>-</code> force la conversion Number</td></tr>
    <tr><td><code>[] + []</code></td><td><code>""</code></td><td>Deux tableaux vides → deux chaînes vides</td></tr>
    <tr><td><code>{} + []</code></td><td><code>0</code></td><td><code>{}</code> = bloc vide, <code>+[]</code> = <code>+""</code> = 0</td></tr>
    <tr><td><code>true + true</code></td><td><code>2</code></td><td>Boolean coercé en 1</td></tr>
  </tbody>
</table>

<div class="callout warn"><div class="callout-icon">⚠</div><div class="callout-body"><strong>Conversion explicite recommandée :</strong> <code>Number("42")</code>, <code>parseInt("42px")</code>, <code>String(42)</code>, <code>Boolean(val)</code>. Évitez <code>new Number()</code>, <code>new String()</code> — ils créent des objets wrapper.</div></div>`,
    code:`console.log("10" + 5);\nconsole.log("10" - 5);\nconsole.log("10" * "2");\nconsole.log("abc" - 1);\n\n// Conversions explicites\nconsole.log(Number("  42  "));\nconsole.log(parseInt("42px"));\nconsole.log(+"3.14");`,
    starter:`console.log("40" + 2);\nconsole.log("40" - 2);\n\nconsole.log(1 + "2" + 3);\nconsole.log(1 + 2 + "3");`,
    quiz:{
      q:'Que produit l\'expression : "5" + 5 - 2 ?',
      opts:["53","8","NaN","7"],
      answer:0,
      explanation:'Évaluée de gauche à droite : <code>"5" + 5</code> donne <code>"55"</code> (concaténation), puis <code>"55" - 2</code> donne <code>53</code> car <code>-</code> force la coercition numérique de <code>"55"</code>. Résultat : nombre <code>53</code>.'
    }
  },
  {
    cat:"1. Les Fondations",
    title:"Template Literals & Interpolation",
    concepts:["Backtick","Interpolation ${}","Multilignes","Tagged templates"],
    why:"Les template literals rendent le HTML dynamique et les logs de debug beaucoup plus lisibles.",
    desc:`<p class="prose">La syntaxe backtick (<code>\`...\`</code>) permet l'<strong>interpolation d'expressions JS</strong> via <code>\${...}</code> et préserve les retours à la ligne sans <code>\\n</code>.</p>`,
    code:`const user = { prenom: "Eva", score: 42 };\nconst msg = \`Bienvenue \${user.prenom.toUpperCase()} !\nScore : \${user.score * 2} pts.\`;\nconsole.log(msg);`,
    starter:`const prenom = "Marc";\nconst age = 28;\nconsole.log(\`\${prenom} a \${age} ans.\`);`,
    quiz:{q:"Syntaxe correcte pour interpoler une variable dans un template literal ?",opts:["#{variable}","{{variable}}","${variable}","%variable%"],answer:2,explanation:"La syntaxe <code>\${expression}</code> est spécifique aux template literals (backticks)."}
  },
  {
    cat:"1. Les Fondations",

let currentLessonIdx = 0;
let userProgress = new Set();
let editorFontSize = 12;
try { userProgress = new Set(JSON.parse(localStorage.getItem('jslearn_v3') || '[]')); } catch(e) {}

window.addEventListener('DOMContentLoaded', () => {
  renderLessonList(LESSONS);
  loadLesson(0);
  updateProgressBar();
  setupEditorShortcut();
  renderCheatsheet();
  document.getElementById('code-editor').style.fontSize = editorFontSize + 'px';
});

function renderLessonList(lessonsToRender) {
  const container = document.getElementById('lesson-list');
  container.innerHTML = '';
  let lastCat = '';
  lessonsToRender.forEach(lesson => {
    const idx = LESSONS.findIndex(l => l.title === lesson.title);
    if (lesson.cat !== lastCat) {
      const hdr = document.createElement('div');
      hdr.className = 'chapter-label';
      hdr.innerText = lesson.cat;
      container.appendChild(hdr);
      lastCat = lesson.cat;
    }
    const item = document.createElement('div');
    item.className = `lesson-item ${idx === currentLessonIdx ? 'active' : ''} ${userProgress.has(idx) ? 'done' : ''}`;
    item.onclick = () => {
      currentLessonIdx = idx;
      loadLesson(idx);
      renderLessonList(LESSONS);
      if (window.innerWidth <= 700) { closeSidebar(); }
    };
    const num = document.createElement('div');
    num.className = 'lesson-num';
    num.innerText = userProgress.has(idx) ? '✓' : (idx + 1);
    const title = document.createElement('div');
    title.className = 'lesson-title-text';
    title.innerText = lesson.title;
    item.appendChild(num); item.appendChild(title);
    container.appendChild(item);
  });
}

function filterLessons(q) {
  renderLessonList(LESSONS.filter(l => l.title.toLowerCase().includes(q.toLowerCase()) || l.cat.toLowerCase().includes(q.toLowerCase())));
}

function loadLesson(idx) {
  const L = LESSONS[idx];
  const isDone = userProgress.has(idx);
  const panel = document.getElementById('lesson-panel');
  const pills = L.concepts.map((c, i) => `<span class="concept-pill ${i===0?'accent':''}">${c}</span>`).join('');
  panel.innerHTML = `
    <div class="lesson-eyebrow">
      <span class="lesson-num-badge">Leçon ${idx+1} / 50</span>
      <span class="cat-tag">${L.cat}</span>
    </div>
    <h1 class="lesson-h1">${L.title}</h1>
    <div class="concept-pills">${pills}</div>
    <div class="callout info" style="margin-top:0;margin-bottom:14px;">
      <div class="callout-icon">💡</div>
      <div class="callout-body"><strong>Pourquoi l'apprendre ?</strong> ${L.why}</div>
    </div>
    ${L.desc}
    <div class="section-divider"><span>Exemple de code</span></div>
    <div class="code-block">
      <div class="code-header">
        <div class="code-dots"><div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div></div>
        <span class="code-lang">JavaScript</span>
        <button class="try-btn" onclick="injectExample(${idx})">▶ Ouvrir dans l'éditeur</button>
      </div>
      <div class="code-body">${escapeHTML(L.code)}</div>
    </div>
    <div class="section-divider"><span>Quiz d'assimilation</span></div>
    <div class="quiz-block">
      <div class="quiz-label">Testez votre compréhension</div>
      <div class="quiz-q">${L.quiz.q}</div>
      <div id="quiz-opts">
        ${L.quiz.opts.map((opt,i)=>`<button class="quiz-opt" data-letter="${String.fromCharCode(65+i)}" onclick="checkAnswer(this,${i},${L.quiz.answer})">${opt}</button>`).join('')}
      </div>
      <div class="quiz-feedback" id="quiz-fb"></div>
      <div class="quiz-explanation" id="quiz-exp"></div>
    </div>
    <div class="lesson-nav">
      <button class="nav-prev" onclick="navigateLesson(-1)" ${idx===0?'disabled style="opacity:0.35;cursor:not-allowed;"':''}>← Préc.</button>
      <button class="mark-done-btn" onclick="toggleDone(${idx})">${isDone?'✓ Acquise':'✓ Marquer'}</button>
      <button class="nav-next primary" onclick="navigateLesson(1)" ${idx===LESSONS.length-1?'disabled style="opacity:0.35;"':''}>Suiv. →</button>
    </div>`;
  document.getElementById('code-editor').value = L.starter;
  onEditorInput();
  clearConsole();
  document.getElementById('content-scroll').scrollTop = 0;
}

function injectExample(idx) {
  document.getElementById('code-editor').value = LESSONS[idx].code;
  onEditorInput();
  switchTab('playground');
  if (window.innerWidth <= 700) { openEditor(); }
}

function navigateLesson(d) {
  const t = currentLessonIdx + d;
  if (t >= 0 && t < LESSONS.length) { currentLessonIdx = t; loadLesson(t); renderLessonList(LESSONS); }
}

function toggleDone(idx) {
  if (userProgress.has(idx)) userProgress.delete(idx);
  else userProgress.add(idx);
  try { localStorage.setItem('jslearn_v3', JSON.stringify([...userProgress])); } catch(e) {}
  updateProgressBar();
  loadLesson(idx);
  renderLessonList(LESSONS);
}

function updateProgressBar() {
  const n = userProgress.size;
  document.getElementById('progress-fill').style.width = `${(n/LESSONS.length)*100}%`;
  document.getElementById('progress-text').innerText = `${n} / ${LESSONS.length}`;
  document.getElementById('streak-num').innerText = n;
}

function checkAnswer(btn, sel, correct) {
  const fb = document.getElementById('quiz-fb');
  const exp = document.getElementById('quiz-exp');
  document.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
  const L = LESSONS[currentLessonIdx];
  if (sel === correct) {
    btn.classList.add('correct');
    fb.className = 'quiz-feedback show ok';
    fb.innerHTML = '✓ Excellente réponse !';
    if (!userProgress.has(currentLessonIdx)) toggleDone(currentLessonIdx);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.quiz-opt')[correct].classList.add('correct');
    fb.className = 'quiz-feedback show ko';
    fb.innerHTML = '✗ Pas tout à fait — bonne réponse en vert.';
  }
  if (L.quiz.explanation) {
    exp.className = 'quiz-explanation show';
    exp.innerHTML = `<strong>Explication :</strong> ${L.quiz.explanation}`;
  }
}

function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function switchTab(name) {
  document.querySelectorAll('.tab-pane').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.etab').forEach(e => e.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  document.getElementById(`tab-btn-${name}`).classList.add('active');
}

function onEditorInput() { updateGutter(); updateStatusBar(); }

function updateGutter() {
  const code = document.getElementById('code-editor').value;
  const lines = code.split('\n');
  document.getElementById('gutter').innerHTML = lines.map((_, i) => `<div class="gutter-line">${i+1}</div>`).join('');
}

function syncGutter() {
  const editor = document.getElementById('code-editor');
  document.getElementById('gutter').scrollTop = editor.scrollTop;
}

function updateStatusBar() {
  const val = document.getElementById('code-editor').value;
  const lines = val.split('\n');
  document.getElementById('char-count').innerText = val.length + ' car.';
  document.getElementById('lines-count').innerText = lines.length + ' lg';
}

function updateCursor() {
  const editor = document.getElementById('code-editor');
  const val = editor.value.substring(0, editor.selectionStart);
  const lines = val.split('\n');
  document.getElementById('cursor-pos').innerText = `Ln ${lines.length}, Col ${lines[lines.length-1].length+1}`;
}

function clearEditor() {
  document.getElementById('code-editor').value = '';
  onEditorInput();
}

function changeFontSize(delta) {
  editorFontSize = Math.max(10, Math.min(18, editorFontSize + delta));
  document.getElementById('code-editor').style.fontSize = editorFontSize + 'px';
  document.getElementById('console-box').style.fontSize = editorFontSize + 'px';
  updateGutter();
}

function clearConsole() {
  document.getElementById('console-box').innerHTML = "<div class='console-empty'>En attente… (Ctrl+Entrée)</div>";
  document.getElementById('console-count').innerText = '';
  document.getElementById('console-dot').classList.remove('active');
}

function runCode() {
  const code = document.getElementById('code-editor').value;
  const box = document.getElementById('console-box');
  const dot = document.getElementById('console-dot');
  box.innerHTML = '';
  switchTab('output');
  dot.classList.add('active');
  let logCount = 0;
  const startTime = performance.now();
  const orig = { log: console.log, warn: console.warn, error: console.error, info: console.info };
  const append = (msg, cls='') => {
    logCount++;
    const d = document.createElement('div');
    d.className = `console-line ${cls}`;
    if (typeof msg === 'object' && msg !== null) {
      try { d.innerText = JSON.stringify(msg, null, 2); d.className += ' log-obj'; }
      catch(e) { d.innerText = String(msg); }
    } else { d.innerText = String(msg); }
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
    document.getElementById('console-count').innerText = logCount + ' log' + (logCount>1?'s':'');
  };
  console.log = (...a) => { a.forEach(x => append(x)); orig.log(...a); };
  console.warn = (...a) => { a.forEach(x => append(x, 'warn')); orig.warn(...a); };
  console.error = (...a) => { a.forEach(x => append(x, 'error')); orig.error(...a); };
  console.info = (...a) => { a.forEach(x => append(x, 'info')); orig.info(...a); };
  try {
    new Function(code)();
    const elapsed = (performance.now() - startTime).toFixed(1);
    if (!box.children.length) append('Exécuté — aucun log.', 'warn');
    const sep = document.createElement('div');
    sep.className = 'exec-time';
    sep.innerText = `⏱ ${elapsed} ms`;
    box.appendChild(sep);
  } catch(e) {
    append(`${e.name}: ${e.message}`, 'error');
  }
  Object.assign(console, orig);
  dot.classList.remove('active');
}

function setupEditorShortcut() {
  document.getElementById('code-editor').addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = this.selectionStart;
      this.value = this.value.substring(0, s) + '  ' + this.value.substring(this.selectionEnd);
      this.selectionStart = this.selectionEnd = s + 2;
      onEditorInput();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runCode();
    }
  });
}

function renderCheatsheet() {
  document.getElementById('cheatsheet-content').innerHTML = Object.entries(CHEATSHEET).map(([section, items]) => `
    <div class="cs-section">
      <div class="cs-title">${section}</div>
      ${items.map(([k, v]) => `<div class="cs-item"><span class="cs-key">${escapeHTML(k)}</span><span class="cs-val">${escapeHTML(v)}</span></div>`).join('')}
    </div>`).join('');
}

  else { sb.classList.add('mobile-open'); ov.classList.add('active'); }
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('overlay').classList.remove('active');
}

function toggleEditor() {
  const ep = document.getElementById('editor-panel');
  const ov = document.getElementById('overlay');
  const isOpen = ep.classList.contains('mobile-open');
  if (isOpen) { closeEditor(); }
  else { ep.classList.add('mobile-open'); ov.classList.add('active'); }
}

function openEditor() {
  if (window.innerWidth <= 700) {
    document.getElementById('editor-panel').classList.add('mobile-open');
    document.getElementById('overlay').classList.add('active');
  }
}

function closeEditor() {
  document.getElementById('editor-panel').classList.remove('mobile-open');
  document.getElementById('overlay').classList.remove('active');
}

function closeAll() {
  closeSidebar();
  closeEditor();
}
</script>
</body>
</html>
