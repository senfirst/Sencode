<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sencode — Éditeur en ligne</title>
<style>
  :root{
    --bg: #0f1115;
    --panel: #171a21;
    --panel-alt: #1d2129;
    --border: #2a2f3a;
    --text: #e8e6df;
    --text-dim: #9a9fab;
    --amber: #d4a017;
    --amber-soft: rgba(212,160,23,0.14);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: "Söhne", "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .container{
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .section-pad{
    padding: 72px 0 96px;
  }

  .section-heading{
    text-align: left;
    max-width: 560px;
    margin-bottom: 40px;
  }

  .eyebrow{
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    color: var(--amber);
    letter-spacing: 0.02em;
  }

  .section-heading h2{
    font-size: 34px;
    line-height: 1.15;
    margin: 10px 0 12px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .section-heading p{
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1.6;
    margin: 0;
  }

  /* --- editor shell --- */

  .code-editor{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 60px -30px rgba(0,0,0,0.6);
  }

  .editor-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 12px 16px;
    background: var(--panel-alt);
    border-bottom: 1px solid var(--border);
  }

  .dot{
    display:inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border);
    margin-right: 6px;
  }
  .dot:nth-child(1){ background:#e5534b; }
  .dot:nth-child(2){ background:#d4a017; }
  .dot:nth-child(3){ background:#3fb950; }

  .btn{
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .btn:active{ transform: translateY(1px); }

  .btn-primary{
    background: var(--amber);
    color: #1a1300;
  }
  .btn-primary:hover{ background:#e2ab1f; }

  /* --- panels --- */

  .editor-body{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-bottom: 1px solid var(--border);
  }

  .code-panel{
    border-right: 1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .code-panel:last-child{ border-right:none; }

  .code-title{
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--text-dim);
    padding: 10px 14px;
    background: var(--panel-alt);
    border-bottom: 1px solid var(--border);
  }

  .code-panel textarea{
    flex:1;
    min-height: 220px;
    resize: vertical;
    background: var(--panel);
    color: var(--text);
    border: none;
    outline: none;
    padding: 14px;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    tab-size: 2;
    caret-color: var(--amber);
  }

  .code-panel textarea::selection{
    background: var(--amber-soft);
  }

  .preview-title{
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--text-dim);
    padding: 10px 14px;
    background: var(--panel-alt);
    border-bottom: 1px solid var(--border);
  }

  #preview{
    width: 100%;
    height: 320px;
    border: none;
    display: block;
    background: #ffffff;
  }

  @media (max-width: 760px){
    .editor-body{ grid-template-columns: 1fr; }
    .code-panel{ border-right:none; border-bottom:1px solid var(--border); }
    .section-heading h2{ font-size: 26px; }
  }
</style>
</head>
<body>

<section class="section-pad" id="editor">
  <div class="container">

    <div class="section-heading">
      <span class="eyebrow">Éditeur en ligne</span>
      <h2>Écris et teste ton code</h2>
      <p>
        Expérimente directement dans ton navigateur avec HTML, CSS et JavaScript.
      </p>
    </div>

    <div class="code-editor">

      <div class="editor-toolbar">
        <div>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>

        <button onclick="runCode()" class="btn btn-primary">
          ▶ Exécuter
        </button>
      </div>

      <div class="editor-body">

        <div class="code-panel">
          <div class="code-title">HTML</div>
          <textarea id="htmlCode" spellcheck="false">&lt;h1&gt;Bonjour Sencode 👋&lt;/h1&gt;
&lt;p&gt;Ma première page web.&lt;/p&gt;</textarea>
        </div>

        <div class="code-panel">
          <div class="code-title">CSS</div>
          <textarea id="cssCode" spellcheck="false">body {
  font-family: Arial;
  text-align: center;
}

h1 {
  color: #d4a017;
}</textarea>
        </div>

        <div class="code-panel">
          <div class="code-title">JavaScript</div>
          <textarea id="jsCode" spellcheck="false">console.log("Bienvenue sur Sencode !");</textarea>
        </div>

      </div>

      <div class="preview-title">
        Aperçu
      </div>

      <iframe id="preview"></iframe>

    </div>

  </div>
</section>

<script>
  function runCode(){
    const html = document.getElementById('htmlCode').value;
    const css  = document.getElementById('cssCode').value;
    const js   = document.getElementById('jsCode').value;

    const doc = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>${css}</style>
</head>
<body>
${html}
<script>
  // capture les erreurs et les logs pour ne pas casser l'aperçu
  window.onerror = function(msg){ console.log('Erreur :', msg); };
  try {
    ${js}
  } catch (e) {
    console.log('Erreur :', e.message);
  }
<\/script>
</body>
</html>`;

    const iframe = document.getElementById('preview');
    iframe.srcdoc = doc;
  }

  // Permet d'utiliser Tab pour indenter dans les zones de code
  document.querySelectorAll('#editor textarea').forEach(function(ta){
    ta.addEventListener('keydown', function(e){
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end);
        ta.selectionStart = ta.selectionEnd = start + 2;
      }
    });
  });

  // Premier rendu au chargement
  runCode();
</script>

</body>
</html>
