<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprendre C# - 50 Leçons</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f1a;
  --surface: #131627;
  --surface2: #1a1e35;
  --border: #252a45;
  --accent: #7c6af7;
  --accent2: #a78bfa;
  --text: #e2e8f8;
  --muted: #7a85a8;
  --green: #34d399;
  --amber: #fbbf24;
  --red: #f87171;
  --code-bg: #0a0c18;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 58px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--accent), #c084fc);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: white;
}

.logo-text {
  font-size: 16px;
  font-weight: 700;
  background: linear-gradient(90deg, var(--accent2), #e879f9);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-info {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 20px;
}

.progress-bar-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
}

.progress-track {
  width: 120px;
  height: 4px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #c084fc);
  border-radius: 99px;
  transition: width 0.4s;
}

.badge {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--muted);
}

/* MAIN LAYOUT */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* SIDEBAR */
.sidebar {
  width: 72px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 8px;
  flex-shrink: 0;
}

.nav-btn {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all 0.2s;
  position: relative;
}

.nav-btn:hover, .nav-btn.active {
  background: var(--surface2);
  color: var(--accent2);
}

.nav-btn.active::before {
  content: '';
  position: absolute;
  left: -1px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 24px;
  background: var(--accent);
  border-radius: 0 3px 3px 0;
}

/* LESSON LIST */
.lessons-panel {
  width: 320px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.search-box {
  margin: 12px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.search-box input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'Sora', sans-serif;
  font-size: 13px;
  width: 100%;
}

.search-box input::placeholder { color: var(--muted); }

.lesson-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.lesson-list::-webkit-scrollbar { width: 4px; }
.lesson-list::-webkit-scrollbar-track { background: transparent; }
.lesson-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.chapter-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  padding: 14px 12px 6px;
}

.lesson-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
}

.lesson-item:hover {
  background: var(--surface2);
}

.lesson-item.active {
  background: rgba(124, 106, 247, 0.15);
  border-color: rgba(124, 106, 247, 0.3);
}

.lesson-num {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--muted);
  transition: all 0.15s;
}

.lesson-item.active .lesson-num,
.lesson-item:hover .lesson-num {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.lesson-item.done .lesson-num {
  background: rgba(52, 211, 153, 0.15);
  border-color: var(--green);
  color: var(--green);
}

.lesson-title {
  font-size: 13px;
  color: var(--text);
  line-height: 1.4;
  flex: 1;
}

.lesson-item.active .lesson-title { color: var(--accent2); }

/* CONTENT AREA */
.content-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.lesson-content {
  flex: 1;
  overflow-y: auto;
  padding: 32px 40px;
}

.lesson-content::-webkit-scrollbar { width: 4px; }
.lesson-content::-webkit-scrollbar-track { background: transparent; }
.lesson-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.lesson-header {
  margin-bottom: 28px;
}

.lesson-number-badge {
  font-size: 12px;
  color: var(--accent2);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.lesson-number-badge::before {
  content: '';
  width: 20px;
  height: 1px;
  background: var(--accent);
}

.lesson-h1 {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.3;
}

.lesson-subtitle {
  font-size: 14px;
  color: var(--muted);
}

/* Info blocks */
.info-block {
  display: flex;
  gap: 14px;
  padding: 16px 20px;
  border-radius: 10px;
  margin: 20px 0;
  font-size: 14px;
  line-height: 1.7;
  border: 1px solid;
}

.info-block.concept {
  background: rgba(124, 106, 247, 0.08);
  border-color: rgba(124, 106, 247, 0.25);
  color: #c4b5fd;
}

.info-block.tip {
  background: rgba(52, 211, 153, 0.07);
  border-color: rgba(52, 211, 153, 0.25);
  color: #6ee7b7;
}

.info-block.warn {
  background: rgba(251, 191, 36, 0.07);
  border-color: rgba(251, 191, 36, 0.2);
  color: #fde68a;
}

.info-icon {
  font-size: 18px;
  flex-shrink: 0;
  margin-top: 1px;
}

.prose {
  font-size: 15px;
  line-height: 1.85;
  color: #c8d0e8;
  margin-bottom: 18px;
}

.prose strong { color: var(--text); font-weight: 600; }

.prose code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  background: rgba(124, 106, 247, 0.15);
  color: var(--accent2);
  padding: 1px 6px;
  border-radius: 4px;
}

/* Code block */
.code-block {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin: 20px 0;
  overflow: hidden;
}

.code-header {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: 8px;
}

.code-dots { display: flex; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-r { background: #f87171; }
.dot-y { background: #fbbf24; }
.dot-g { background: #34d399; }

.code-lang {
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.code-copy {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-family: 'Sora', sans-serif;
  transition: all 0.15s;
}

.code-copy:hover { color: var(--text); border-color: var(--accent); }

.code-body {
  padding: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  line-height: 1.7;
  overflow-x: auto;
  color: #e2e8f8;
  white-space: pre;
}

/* Syntax highlighting */
.kw { color: #c084fc; }   /* keywords */
.ty { color: #60a5fa; }   /* types */
.st { color: #34d399; }   /* strings */
.cm { color: #4a5577; }   /* comments */
.nm { color: #fb923c; }   /* numbers */
.fn { color: #a78bfa; }   /* functions */
.cls { color: #38bdf8; }  /* classes */

/* Lesson nav */
.lesson-nav {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 40px;
  padding-top: 28px;
  border-top: 1px solid var(--border);
}

.nav-arrow {
  padding: 10px 20px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'Sora', sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-arrow:hover { border-color: var(--accent); color: var(--accent2); }
.nav-arrow.primary { background: var(--accent); border-color: var(--accent); color: white; margin-left: auto; }
.nav-arrow.primary:hover { background: #6d5de0; }

/* EDITOR PANEL */
.editor-panel {
  width: 400px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.editor-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}

.editor-tabs {
  display: flex;
  gap: 2px;
}

.etab {
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.15s;
  border: none;
  background: transparent;
  font-family: 'Sora', sans-serif;
}

.etab.active {
  background: var(--surface2);
  color: var(--text);
}

.run-btn {
  margin-left: auto;
  padding: 6px 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Sora', sans-serif;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s;
}

.run-btn:hover { background: #6d5de0; }

.editor-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.tab-pane { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.tab-pane.active { display: flex; }

textarea#code-editor {
  flex: 1;
  background: var(--code-bg);
  border: none;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  padding: 20px;
  resize: none;
  outline: none;
  line-height: 1.7;
  tab-size: 4;
}

.output-box {
  background: var(--code-bg);
  flex: 1;
  overflow: auto;
  padding: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
  color: var(--green);
  border-bottom: 1px solid var(--border);
}

.output-box.empty { color: var(--muted); }

/* AI Assistant */
.ai-pane {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}

.ai-pane.active { display: flex; }

.ai-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.ai-messages::-webkit-scrollbar { width: 3px; }
.ai-messages::-webkit-scrollbar-thumb { background: var(--border); }

.msg {
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.65;
  max-width: 95%;
}

.msg.user {
  background: rgba(124, 106, 247, 0.18);
  border: 1px solid rgba(124, 106, 247, 0.3);
  color: #d0c4ff;
  align-self: flex-end;
}

.msg.ai {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  align-self: flex-start;
}

.msg.ai code {
  font-family: 'JetBrains Mono', monospace;
  background: rgba(0,0,0,0.4);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 12px;
  color: var(--accent2);
}

.ai-input-row {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.ai-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-family: 'Sora', sans-serif;
  font-size: 13px;
  outline: none;
  resize: none;
  line-height: 1.5;
  min-height: 40px;
  max-height: 100px;
  transition: border 0.15s;
}

.ai-input:focus { border-color: var(--accent); }
.ai-input::placeholder { color: var(--muted); }

.send-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--accent);
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  flex-shrink: 0;
}

.send-btn:hover { background: #6d5de0; }

.typing-indicator {
  display: none;
  align-items: center;
  gap: 4px;
  padding: 10px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: fit-content;
}

.typing-indicator span {
  width: 6px;
  height: 6px;
  background: var(--muted);
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* Notion-style concept cards */
.concept-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0;
}

.concept-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
}

.cc-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 8px;
}

.cc-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: var(--accent2);
}

.cc-desc {
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.5;
}

/* Section title */
.section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-weight: 600;
  margin: 28px 0 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Done checkmark */
.done-btn {
  padding: 8px 16px;
  border-radius: 8px;
  background: rgba(52, 211, 153, 0.1);
  border: 1px solid rgba(52, 211, 153, 0.3);
  color: var(--green);
  font-family: 'Sora', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.done-btn:hover { background: rgba(52, 211, 153, 0.2); }

/* Responsive */
@media (max-width: 1100px) {
  .editor-panel { width: 340px; }
  .lessons-panel { width: 280px; }
}

@media (max-width: 800px) {
  .sidebar { display: none; }
  .lessons-panel { width: 100%; position: absolute; z-index: 5; transform: translateX(-100%); transition: transform 0.3s; }
  .lessons-panel.open { transform: none; }
  .editor-panel { display: none; }
}

/* Highlighted quiz */
.quiz-block {
  border: 1px solid rgba(124, 106, 247, 0.3);
  border-radius: 10px;
  padding: 18px;
  margin: 20px 0;
  background: rgba(124, 106, 247, 0.05);
}

.quiz-q {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text);
}

.quiz-opt {
  padding: 9px 14px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--surface2);
  margin-bottom: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  transition: all 0.15s;
  display: block;
  width: 100%;
  text-align: left;
  font-family: 'Sora', sans-serif;
}

.quiz-opt:hover { border-color: var(--accent); color: var(--accent2); }
.quiz-opt.correct { border-color: var(--green); background: rgba(52, 211, 153, 0.1); color: var(--green); }
.quiz-opt.wrong { border-color: var(--red); background: rgba(248, 113, 113, 0.1); color: var(--red); }

.quiz-feedback {
  margin-top: 10px;
  font-size: 13px;
  display: none;
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">C#</div>
    <span class="logo-text">CSharp Academy</span>
  </div>
  <div class="header-info">
    <div class="progress-bar-wrap">
      <span id="progress-text">0 / 50 leçons</span>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <div class="badge" id="xp-badge">0 XP</div>
  </div>
</div>

<div class="main">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <button class="nav-btn active" title="Leçons" onclick="setTab('lessons')">📚</button>
    <button class="nav-btn" title="Éditeur" onclick="setTab('editor')">⌨️</button>
    <button class="nav-btn" title="Assistant IA" onclick="setTab('ai')">✨</button>
  </div>

  <!-- LESSON LIST -->
  <div class="lessons-panel" id="lessons-panel">
    <div class="panel-header">
      <span>50 Leçons</span>
      <span id="done-count" style="font-size:11px;color:var(--green)">0 complétées</span>
    </div>
    <div class="search-box">
      <span style="color:var(--muted);font-size:14px">🔍</span>
      <input type="text" id="search-input" placeholder="Rechercher une leçon..." oninput="filterLessons()">
    </div>
    <div class="lesson-list" id="lesson-list"></div>
  </div>

  <!-- CONTENT -->
  <div class="content-area">
    <div class="lesson-content" id="lesson-content">
      <!-- Filled by JS -->
    </div>
  </div>

  <!-- EDITOR PANEL -->
  <div class="editor-panel">
    <div class="editor-header">
      <div class="editor-tabs">
        <button class="etab active" onclick="switchEditorTab('code')">Éditeur</button>
        <button class="etab" onclick="switchEditorTab('output')">Sortie</button>
        <button class="etab" onclick="switchEditorTab('ai')">✨ IA</button>
      </div>
      <button class="run-btn" onclick="showCode()">▶ Afficher</button>
    </div>
    <div class="editor-body">
      <div class="tab-pane active" id="tab-code">
        <textarea id="code-editor">using System;

class Program {
    static void Main() {
        Console.WriteLine("Bonjour et bienvenue en C# !");
    }
}</textarea>
      </div>

    code: `using System;

    content: `
<p class="prose">Une <strong>classe</strong> est un modèle (blueprint) qui définit la structure et le comportement d'un type de données. Un <strong>objet</strong> est une instance concrète d'une classe. C'est le cœur de la <strong>Programmation Orientée Objet (POO)</strong>.</p>

<div class="info-block concept"><span class="info-icon">💡</span><div>Analogie : la classe est le plan d'architecte d'une maison. L'objet est la maison construite à partir de ce plan. On peut construire plusieurs maisons (objets) avec le même plan (classe).</div></div>`,
    code: `using System;

// Définition de la classe
class Etudiant {
    // ──── Champs (données) ───────────────────────
    public string Prenom;
    public string Nom;
    public int Age;
    private double[] _notes;  // Privé : accessible seulement dans la classe

    // ──── Constructeur ───────────────────────────
    public Etudiant(string prenom, string nom, int age) {
        Prenom = prenom;
        Nom = nom;
        Age = age;
        _notes = new double[0];
    }

    // ──── Propriété calculée ─────────────────────
    public string NomComplet => $"{Prenom} {Nom}";

    // ──── Méthodes ───────────────────────────────
    public void AjouterNote(double note) {
        Array.Resize(ref _notes, _notes.Length + 1);
        _notes[_notes.Length - 1] = note;
    }

    public double CalculerMoyenne() {
        if (_notes.Length == 0) return 0;
        double total = 0;
        foreach (var n in _notes) total += n;
        return total / _notes.Length;
    }

    public void AfficherInfo() {
        Console.WriteLine($"Étudiant : {NomComplet}, {Age} ans");
        Console.WriteLine($"Moyenne  : {CalculerMoyenne():F2}/20");
    }
}

class Program {
    static void Main() {

        // ──── Créer des objets ────────────────────
        Etudiant e1 = new Etudiant("Thierno", "Diallo", 22);
        Etudiant e2 = new Etudiant("Amina", "Bah", 20);

        // ──── Utiliser les méthodes ───────────────
        e1.AjouterNote(14);
        e1.AjouterNote(17);
        e1.AjouterNote(15);

        e2.AjouterNote(18);
        e2.AjouterNote(19);

        e1.AfficherInfo();
        Console.WriteLine();
        e2.AfficherInfo();
    }
}`,

    subtitle: "Réutiliser et étendre des classes existantes",
    content: `
<p class="prose">L'héritage permet à une classe (<strong>classe fille</strong>) d'hériter des propriétés et méthodes d'une autre classe (<strong>classe mère</strong>). Cela évite la duplication de code et permet de créer des hiérarchies de classes logiques.</p>

<div class="info-block concept"><span class="info-icon">💡</span><div>Analogie : "Animal → Chien → Labrador". Chaque niveau hérite des caractéristiques du niveau précédent et en ajoute de nouvelles. Un Labrador EST un Chien, qui EST un Animal.</div></div>`,

// ──── Classe de base ─────────────────────────────

    public int Age { get; set; }

        Nom = nom;
        Age = age;
    }

    public virtual void FaireDuBruit() {  // virtual = peut être redéfini
        Console.WriteLine($"{Nom} fait un bruit...");
    }

    public void Respirer() {
        Console.WriteLine($"{Nom} respire.");
    }
}

// ──── Classe fille ────────────────────────────────
class Chien : Animal {  // Chien hérite de Animal
    public string Race { get; set; }

    public Chien(string nom, int age, string race)
        : base(nom, age) {  // base() appelle le constructeur parent
        Race = race;
    }

    public override void FaireDuBruit() {  // Redéfinition
        Console.WriteLine($"{Nom} aboie : Wouf Wouf !");
    }

    public void Fetch() {
        Console.WriteLine($"{Nom} rapporte la balle !");
    }
}

class Chat : Animal {
    public Chat(string nom, int age) : base(nom, age) { }

    public override void FaireDuBruit() {
        Console.WriteLine($"{Nom} miaule : Miaou !");
    }
}

    static void Main() {

        Animal generique = new Animal("Animal", 1);
        Chien rex = new Chien("Rex", 3, "Berger allemand");
        Chat mimi = new Chat("Mimi", 5);

        // Polymorphisme : même méthode, comportements différents
        Animal[] animaux = { generique, rex, mimi };

        foreach (Animal a in animaux) {
            a.FaireDuBruit();  // Chaque animal a son propre bruit
            a.Respirer();      // Héritée de la classe mère

        }

        // Méthode spécifique à Chien

    }
}`,

// ─── STATE ────────────────────────────────────────
let currentLesson = 0;
let completedLessons = new Set();
let xp = 0;

// ─── BUILD LESSON LIST ────────────────────────────
function buildLessonList() {
  const container = document.getElementById('lesson-list');
  let lastChapter = '';
  let html = '';

  lessonsFull.forEach((lesson, i) => {
    if (lesson.chapter !== lastChapter) {
      html += `<div class="chapter-label">${lesson.chapter}</div>`;
      lastChapter = lesson.chapter;
    }
    const done = completedLessons.has(i) ? 'done' : '';
    const active = i === currentLesson ? 'active' : '';
    const numDisplay = completedLessons.has(i) ? '✓' : (i + 1);
    html += `<div class="lesson-item ${active} ${done}" onclick="goToLesson(${i})" id="li-${i}">
      <div class="lesson-num">${numDisplay}</div>
      <div class="lesson-title">${lesson.title}</div>
    </div>`;
  });

  container.innerHTML = html;
}

// ─── RENDER LESSON ────────────────────────────────
function renderLesson(i) {
  const lesson = lessonsFull[i];
  const editor = document.getElementById('code-editor');
  editor.value = lesson.code || '';

  const quizHTML = lesson.quiz ? `
    <div class="section-title">Mini Quiz</div>
    <div class="quiz-block" id="quiz-${i}">
      <div class="quiz-q">🎯 ${lesson.quiz.q}</div>
      ${lesson.quiz.opts.map((opt, j) => `<button class="quiz-opt" onclick="checkQuiz(${i}, ${j})">${opt}</button>`).join('')}
      <div class="quiz-feedback" id="qf-${i}"></div>
    </div>` : '';

  document.getElementById('lesson-content').innerHTML = `
    <div class="lesson-header">
      <div class="lesson-number-badge">Leçon ${i + 1} / ${lessonsFull.length}</div>
      <h1 class="lesson-h1">${lesson.title}</h1>
      <p class="lesson-subtitle">${lesson.subtitle}</p>
    </div>
    ${lesson.content}
    <div class="section-title">Code Complet</div>
    <div class="code-block">
      <div class="code-header">
        <div class="code-dots"><div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div></div>
        <span class="code-lang">C#</span>
        <button class="code-copy" onclick="copyCode(${i})">Copier</button>
      </div>
      <div class="code-body">${highlightCode(lesson.code)}</div>
    </div>
    ${quizHTML}
    <div class="lesson-nav">
      ${i > 0 ? `<button class="nav-arrow" onclick="goToLesson(${i - 1})">← Précédent</button>` : ''}
      <button class="done-btn" onclick="markDone(${i})">✓ Marquer comme apprise</button>
      ${i < lessonsFull.length - 1 ? `<button class="nav-arrow primary" onclick="goToLesson(${i + 1})">Suivant →</button>` : '<span style="margin-left:auto;color:var(--green);font-weight:600">🎉 Cours terminé !</span>'}
    </div>
  `;

  // Scroll top
  document.getElementById('lesson-content').scrollTop = 0;
}

function highlightCode(code) {
  return code
    .replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\/\/.*/g, m => `<span class="cm">${m}</span>`)
    .replace(/\b(using|namespace|class|static|void|return|new|if|else|for|foreach|while|do|switch|case|break|continue|default|throw|try|catch|finally|public|private|protected|override|virtual|abstract|interface|var|in|out|ref|const|this|base)\b/g, m => `<span class="kw">${m}</span>`)
    .replace(/\b(int|string|double|float|bool|char|decimal|long|byte|short|List|Dictionary|Array|Math|Console|DateTime|Task|void)\b/g, m => `<span class="ty">${m}</span>`)
    .replace(/"([^"]*)"/g, m => `<span class="st">${m}</span>`)
    .replace(/\b(\d+\.?\d*)\b/g, m => `<span class="nm">${m}</span>`);
}

function goToLesson(i) {
  currentLesson = i;
  renderLesson(i);
  buildLessonList();
  document.getElementById(`li-${i}`)?.scrollIntoView({ block: 'nearest' });
}

function markDone(i) {
  if (!completedLessons.has(i)) {
    completedLessons.add(i);
    xp += 20;
    document.getElementById('xp-badge').textContent = xp + ' XP';
    updateProgress();
    buildLessonList();
  }
}

function updateProgress() {
  const pct = (completedLessons.size / lessonsFull.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${completedLessons.size} / ${lessonsFull.length} leçons`;
  document.getElementById('done-count').textContent = completedLessons.size + ' complétées';
}

function copyCode(i) {
  navigator.clipboard.writeText(lessonsFull[i].code);
}

function checkQuiz(lessonIdx, optIdx) {
  const q = lessonsFull[lessonIdx].quiz;
  const block = document.getElementById(`quiz-${lessonIdx}`);
  const feedback = document.getElementById(`qf-${lessonIdx}`);
  const btns = block.querySelectorAll('.quiz-opt');

  btns.forEach(b => b.disabled = true);
  btns[optIdx].classList.add(optIdx === q.ans ? 'correct' : 'wrong');
  if (optIdx !== q.ans) btns[q.ans].classList.add('correct');

  feedback.style.display = 'block';
  feedback.textContent = q.exp;
  feedback.style.color = optIdx === q.ans ? 'var(--green)' : 'var(--red)';

  if (optIdx === q.ans) {
    xp += 10;
    document.getElementById('xp-badge').textContent = xp + ' XP';
  }
}

function filterLessons() {
  const q = document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('.lesson-item').forEach((el, i) => {
    const title = lessonsFull[i].title.toLowerCase();
    el.style.display = title.includes(q) ? '' : 'none';

  document.querySelectorAll('.chapter-label').forEach(el => {

// ─── AI ───────────────────────────────────────────
async function sendAI() {
  const input = document.getElementById('ai-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';

  const lesson = lessonsFull[currentLesson];
  appendMsg(msg, 'user');
  document.getElementById('typing').style.display = 'flex';

  const systemPrompt = `Tu es un assistant pédagogique expert en C#, répondant en français. L'utilisateur apprend C# et est actuellement à la leçon "${lesson.title}" (${lesson.subtitle}). Réponds de façon claire, concise et pédagogique. Utilise des exemples de code courts si utile. Si l'utilisateur colle du code, explique-le.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: msg }]
      })
    });
    const data = await res.json();
    const reply = data.content?.map(c => c.text || '').join('') || "Désolé, je n'ai pas pu répondre.";
    document.getElementById('typing').style.display = 'none';
    appendMsg(reply, 'ai');
  } catch {
    document.getElementById('typing').style.display = 'none';
    appendMsg("Erreur de connexion. Vérifiez votre connexion internet.", 'ai');
  }
}

function appendMsg(text, role) {
  const container = document.getElementById('ai-messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = text
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function handleAiKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendAI();
  }
