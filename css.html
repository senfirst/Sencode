<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprendre CSS — 50 Leçons</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,800;1,9..144,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f9f8f6;
  --surface: #ffffff;
  --surface2: #f4f2ff;
  --surface3: #fef9f0;
  --border: #e8e4de;
  --border-light: #f0ede8;

  --accent: #5b47e0;
  --accent-soft: #ede9ff;
  --accent2: #d4467a;
  --accent2-soft: #fdeef5;
  --accent3: #1a9e6e;
  --accent3-soft: #e8faf4;
  --accent4: #d97706;
  --accent4-soft: #fef3e2;

  --text: #1a1714;
  --text-muted: #7a7469;
  --text-light: #b0a89e;

  --code-bg: #17161a;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 12px 40px rgba(0,0,0,0.05);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.10), 0 24px 64px rgba(0,0,0,0.06);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  height: 100vh;
  overflow: hidden;
}

/* ── HEADER ── */
.header {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 10;
}

.header-logo { display: flex; align-items: center; gap: 14px; }

.logo-icon {
  width: 40px; height: 40px;
  background: var(--accent);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: white;
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  font-size: 12px;
  letter-spacing: -0.5px;
  box-shadow: 0 4px 14px rgba(91,71,224,0.35);
}

.header h1 {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.3px;
  color: var(--text);
}
.header h1 span { color: var(--accent); }

.header-meta { display: flex; align-items: center; gap: 24px; }

.progress-wrap { display: flex; align-items: center; gap: 10px; }

.progress-bar {
  width: 160px; height: 6px;
  background: var(--border);
  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 20px;
  transition: width .4s cubic-bezier(.4,0,.2,1);
}

.progress-label {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
}

.current-badge {
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid rgba(91,71,224,0.18);
  padding: 5px 14px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.2px;
}

/* ── LAYOUT ── */
.container { display: flex; height: calc(100vh - 68px); }

/* ── SIDEBAR ── */
.sidebar {
  width: 248px;
  background: white;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  padding: 16px 0 24px;
}

.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 20px; }

.sidebar-section {
  padding: 12px 20px 6px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-light);
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 20px;
  cursor: pointer;
  transition: all .2s;
  border-left: 2px solid transparent;
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-item:hover {
  background: var(--surface2);
  color: var(--accent);
  border-left-color: rgba(91,71,224,0.3);
}

.sidebar-item.active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
  border-left-color: var(--accent);
}

.sidebar-item.done { color: var(--accent3); }
.sidebar-item.done .s-num { background: var(--accent3-soft); color: var(--accent3); }

.s-num {
  width: 24px; height: 24px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  background: var(--border-light);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  color: var(--text-muted);
  flex-shrink: 0;
}
.sidebar-item.active .s-num { background: var(--accent); color: white; }

/* ── LESSON PANEL ── */
.lessons-panel {
  flex: 1;
  overflow-y: auto;
  padding: 36px 40px;
  background: var(--bg);
}
.lessons-panel::-webkit-scrollbar { width: 6px; }
.lessons-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 20px; }

/* ── LESSON ── */
.lesson { display: none; animation: fadeUp .3s ease; }
.lesson.active { display: block; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.lesson-header { margin-bottom: 30px; }

.lesson-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--accent-soft);
  border: 1px solid rgba(91,71,224,0.15);
  color: var(--accent);
  padding: 5px 13px;
  border-radius: 30px;
  font-size: 11.5px;
  font-weight: 700;
  margin-bottom: 14px;
  letter-spacing: 0.3px;
}

.lesson h2 {
  font-family: 'Fraunces', serif;
  font-size: 38px;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -1.2px;
  color: var(--text);
  margin-bottom: 10px;
}

.lesson-subtitle {
  color: var(--text-muted);
  font-size: 16px;
  line-height: 1.7;
  max-width: 580px;
}

/* ── BLOCKS ── */
.block {
  background: white;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 26px 28px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s, transform .2s;
}
.block:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }

.block-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.block-title .dot { width: 8px; height: 8px; border-radius: 50%; }

.block.explain .dot { background: var(--accent2); }
.block.syntax  .dot { background: var(--accent); }
.block.tip     .dot { background: var(--accent3); }
.block.example .dot { background: var(--accent4); }
.block.warn    .dot { background: #ef4444; }

.block.explain .block-title { color: var(--accent2); }
.block.syntax  .block-title { color: var(--accent); }
.block.tip     .block-title { color: var(--accent3); }
.block.example .block-title { color: var(--accent4); }
.block.warn    .block-title { color: #ef4444; }

.block.explain { border-left: 3px solid var(--accent2); background: var(--accent2-soft); }
.block.tip     { border-left: 3px solid var(--accent3); background: var(--accent3-soft); }
.block.warn    { border-left: 3px solid #ef4444; background: #fff5f5; }

.block p { font-size: 14.5px; line-height: 1.85; color: #3d3730; margin-bottom: 8px; }
.block p:last-child { margin-bottom: 0; }
.block p code, .block li code {
  font-family: 'DM Mono', monospace;
  font-size: 12.5px;
  background: rgba(91,71,224,0.09);
  color: var(--accent);
  padding: 2px 6px;
  border-radius: 5px;
}
.block.tip p code { background: rgba(26,158,110,0.12); color: var(--accent3); }

.block ul { list-style: none; margin-top: 4px; }
.block ul li {
  position: relative;
  padding: 6px 0 6px 22px;
  color: #3d3730;
  font-size: 14.5px;
  line-height: 1.75;
}
.block ul li::before {
  content: '▸';
  position: absolute;
  left: 0;
  color: var(--accent);
  font-size: 11px;
  top: 9px;
}
.block.tip ul li::before { color: var(--accent3); }

/* Enrichment: callout */
.callout {
  background: var(--accent-soft);
  border: 1px solid rgba(91,71,224,0.2);
  border-radius: 12px;
  padding: 14px 18px;
  margin-top: 14px;
  font-size: 13.5px;
  color: var(--accent);
  line-height: 1.7;
}
.callout strong { font-weight: 700; }

/* Enrichment: comparison row */
.compare-row {
  display: flex;
  gap: 12px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.compare-item {
  flex: 1;
  min-width: 140px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
}
.compare-item strong {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.compare-item p { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.6; }

/* Enrichment: do/dont */
.do-dont { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.do-block, .dont-block {
  flex: 1;
  min-width: 160px;
  border-radius: 10px;
  padding: 14px 16px;
}
.do-block { background: #f0fdf4; border: 1px solid #bbf7d0; }
.dont-block { background: #fff5f5; border: 1px solid #fecaca; }
.do-block .label { font-size: 11px; font-weight: 800; color: var(--accent3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.dont-block .label { font-size: 11px; font-weight: 800; color: #ef4444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.do-block code, .dont-block code {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  display: block;
  line-height: 1.7;
  color: #1a1714;
}

/* Enrichment: visual demo strip */
.demo-strip {
  display: flex;
  gap: 10px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.demo-strip .chip {
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
}

/* ── CODE BLOCK ── */
.code-wrap { position: relative; margin-top: 10px; }
.code-wrap pre {
  background: var(--code-bg);
  border-radius: 14px;
  border: 1px solid #2a2731;
  padding: 22px 24px;
  overflow-x: auto;
  font-family: 'DM Mono', monospace;
  font-size: 12.5px;
  line-height: 1.85;
  color: #e4dfe8;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
}
.code-wrap pre .prop { color: #79c7ff; }
.code-wrap pre .val  { color: #ffa5c8; }
.code-wrap pre .sel  { color: #c4b5fd; }
.code-wrap pre .at   { color: #fb7185; }
.code-wrap pre .com  { color: #5a5465; font-style: italic; }
.code-wrap pre .punc { color: #e4dfe8; }

.copy-btn {
  position: absolute;
  top: 10px; right: 10px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  color: #8a8096;
  padding: 5px 12px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 11.5px;
  font-family: 'DM Sans', sans-serif;
  transition: all .18s;
}
.copy-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

/* ── TABLE ── */
.values-table { width: 100%; border-collapse: collapse; border-radius: 12px; overflow: hidden; margin-top: 4px; }
.values-table th {
  background: var(--accent-soft);
  color: var(--accent);
  padding: 11px 14px;
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 700;
}
.values-table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border-light);
  color: #3d3730;
  font-size: 13.5px;
  line-height: 1.6;
}
.values-table tr:last-child td { border-bottom: none; }
.values-table tr:hover td { background: var(--bg); }
.values-table td:first-child { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent); font-weight: 500; }

/* ── BUTTONS ── */
.try-btn, .run-btn {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: 0.2px;
  box-shadow: 0 4px 14px rgba(91,71,224,0.28);
}
.try-btn { padding: 11px 22px; margin-top: 10px; font-size: 13.5px; }
.try-btn:hover, .run-btn:hover { background: #4a38cc; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(91,71,224,0.38); }

/* ── NAVIGATION ── */
.lesson-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 36px;
  padding-top: 22px;
  border-top: 1px solid var(--border);
}

.nav-btn, .mark-done-btn, .reset-btn {
  border-radius: 10px;
  cursor: pointer;
  transition: all .2s;
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
}
.nav-btn {
  background: white;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 10px 18px;
  font-weight: 600;
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.mark-done-btn {
  background: var(--accent3-soft);
  border: 1px solid rgba(26,158,110,0.25);
  color: var(--accent3);
  padding: 10px 20px;
  font-weight: 700;
}
.mark-done-btn:hover { background: rgba(26,158,110,0.15); }
.mark-done-btn.done { background: var(--accent3); color: white; border-color: var(--accent3); }

.reset-btn {
  background: white;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 10px 14px;
}
.reset-btn:hover { border-color: var(--accent2); color: var(--accent2); }

/* ── EDITOR ── */
.editor-section {
  width: 380px;
  background: white;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  box-shadow: -4px 0 20px rgba(0,0,0,0.04);
}

.editor-header {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.editor-header h3 {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 7px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.editor-tabs { display: flex; gap: 4px; }
.editor-tab {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--text-muted);
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  transition: all .18s;
  font-family: 'DM Sans', sans-serif;
}
.editor-tab.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  box-shadow: 0 3px 10px rgba(91,71,224,0.25);
}

.editor-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

textarea#editor, textarea#html-editor {
  width: 100%;
  height: 100%;
  background: var(--code-bg);
  border: none;
  outline: none;
  color: #e4dfe8;
  padding: 18px 20px;
  resize: none;
  font-family: 'DM Mono', monospace;
  font-size: 12.5px;
  line-height: 1.8;
}

#htmlWrap { display: none; height: 100%; }
#htmlWrap.visible { display: flex; flex-direction: column; }

.editor-footer {
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  background: white;
}

.run-btn { flex: 1; padding: 10px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }

.preview-wrap { height: 220px; border-top: 1px solid var(--border); overflow: hidden; flex-shrink: 0; }

.preview-label {
  padding: 8px 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

iframe#result {
  width: 100%;
  height: calc(220px - 34px);
  border: none;
  background: white;
}

/* ── RESPONSIVE ── */
@media(max-width: 1100px) { .sidebar { display: none; } }
@media(max-width: 820px) {
  body { overflow: auto; }
  .container { flex-direction: column; height: auto; }
  .lessons-panel { min-height: 60vh; padding: 24px 20px; }
  .editor-section { width: 100%; height: 55vh; }
  .lesson h2 { font-size: 28px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <div class="logo-icon">CSS</div>
    <h1>Apprendre <span>CSS</span></h1>
  </div>
  <div class="header-meta">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressText">0 / 50</span>
    </div>
    <div class="current-badge" id="currentBadge">Leçon 1</div>
  </div>
</div>

<div class="container">
  <div class="sidebar" id="sidebar"></div>
  <div class="lessons-panel" id="lessonsPanel"></div>

  <div class="editor-section">
    <div class="editor-header">
      <h3>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        Éditeur
      </h3>
      <div class="editor-tabs">
        <button class="editor-tab active" onclick="switchTab('css')">CSS</button>
        <button class="editor-tab" onclick="switchTab('html')">HTML</button>
      </div>
    </div>
    <div class="editor-body">
      <div id="cssWrap" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
        <textarea id="editor">body {
  background: #f0f4ff;
  color: #1a1a2e;
  font-family: sans-serif;
  text-align: center;
  padding: 40px;
}

h1 {
  color: #5b47e0;
  font-size: 2rem;
  margin-bottom: 16px;
}

p {
  color: #5a5a7a;
  line-height: 1.7;
}

button {
  margin-top: 20px;
  padding: 10px 24px;
  background: #5b47e0;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
}</textarea>
      </div>
      <div id="htmlWrap">
        <textarea id="html-editor">&lt;h1&gt;Bonjour CSS !&lt;/h1&gt;
&lt;p&gt;Modifie le CSS à gauche pour voir les changements ici.&lt;/p&gt;
&lt;button&gt;Clique-moi&lt;/button&gt;</textarea>
      </div>
    </div>
    <div class="editor-footer">
      <button class="run-btn" onclick="runCode()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Exécuter
      </button>
      <button class="reset-btn" onclick="resetCode()">↺ Reset</button>
    </div>
    <div class="preview-wrap">
      <div class="preview-label">▸ Aperçu en direct</div>
      <iframe id="result"></iframe>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
//  LESSONS DATA — enrichies avec contenu informatif
// ════════════════════════════════════════════════
const lessons = [
{
  title: "Introduction au CSS",
  subtitle: "Comprendre ce qu'est le CSS, pourquoi il existe et comment il s'intègre dans le web",
  blocks: [
    { type: "explain", title: "Qu'est-ce que le CSS ?", content: `
      <p>CSS signifie <strong>Cascading Style Sheets</strong> — feuilles de style en cascade. C'est un langage de présentation qui contrôle l'apparence visuelle des pages HTML : couleurs, typographie, espacement, mise en page, animations…</p>
      <p>Sans CSS, le web ressemblerait à un document texte des années 90. CSS sépare le <em>contenu</em> (HTML) de la <em>présentation</em> — un principe fondamental du développement web moderne.</p>
      <div class="compare-row">
        <div class="compare-item"><strong>HTML</strong><p>Structure et contenu : titres, paragraphes, images, liens.</p></div>
        <div class="compare-item"><strong>CSS</strong><p>Présentation : couleurs, tailles, positions, animations.</p></div>

{
  title: "Font Size",
  subtitle: "Contrôler la taille du texte et comprendre la différence entre les unités absolues et relatives",
  blocks: [
    { type: "explain", title: "Changer la taille du texte", content: `
      <p><code>font-size</code> définit la taille du texte. Le choix de l'unité est crucial : certaines sont <strong>absolues</strong> (px), d'autres <strong>relatives</strong> (rem, em, %) et s'adaptent au contexte.</p>
      <p>La taille de base du navigateur est généralement <strong>16px</strong> — c'est la valeur de <code>1rem</code>.</p>
    `},
    { type: "syntax", title: "Les unités avec exemples", code: `/* ABSOLU — ne change pas */
h1 { font-size: 48px; }   /* Toujours 48 pixels */

/* RELATIF au :root (html) */
h1 { font-size: 3rem; }   /* 3 × 16px = 48px */
p  { font-size: 1rem; }   /* 16px — taille de base */

/* RELATIF au parent */
.card p { font-size: 0.9em; } /* 90% de la taille du parent */

/* RELATIF au viewport */
h1 { font-size: 5vw; }    /* 5% de la largeur d'écran */
h1 { font-size: 4vh; }    /* 4% de la hauteur d'écran */

/* FLUIDE avec clamp */
h1 { font-size: clamp(24px, 5vw, 60px); }` },
    { type: "example", title: "Quand utiliser quelle unité ?", table: [
      ["Unité","Valeur relative à","Recommandé pour"],

      ["rem","html (racine)","Texte — respecte zoom navigateur"],
      ["em","Élément parent","Composants auto-scalables"],
      ["vw","Largeur viewport","Titres responsives"],
      ["vh","Hauteur viewport","Sections plein écran"],
      ["%","Élément parent","Mises en page fluides"],
    ]},
    { type: "tip", title: "💡 Accessibilité et rem", content: `
      <p>Si un utilisateur a configuré une grande taille de police dans son navigateur (accessibilité, malvoyance), <code>rem</code> respecte ce réglage, <code>px</code> l'ignore. C'est pourquoi <strong>rem est recommandé pour les tailles de texte</strong>.</p>
    `}
  ],

      <p><code>font-family</code> définit la police du texte. On liste plusieurs polices par ordre de préférence : si la première n'est pas disponible, CSS essaie la suivante, etc. On finit toujours par une famille générique.</p>
      <p>Il existe des <strong>polices système</strong> (toujours disponibles) et des <strong>polices web</strong> (à charger, ex: Google Fonts).</p>
    `},
    { type: "syntax", title: "Polices système et web", code: `/* Polices système — toujours disponibles */
body { font-family: Arial, Helvetica, sans-serif; }
body { font-family: Georgia, 'Times New Roman', serif; }
body { font-family: 'Courier New', Courier, monospace; }

/* Stack moderne (sans téléchargement) */
body {
  font-family: -apple-system, BlinkMacSystemFont,
    'Segoe UI', Roboto, Oxygen, sans-serif;
}

p { font-family: sans-serif; }    /* Arial-like */

p { font-family: fantasy; }       /* Décoratif */` },

  blocks: [
    { type: "explain", title: "Contrôler la largeur", content: `
      <p><code>width</code> définit la largeur d'un élément bloc. Les éléments bloc occupent par défaut 100% de leur parent (<code>width: auto</code>). Les éléments inline ne peuvent pas avoir de width.</p>

div { width: 50%; }       /* 50% de la largeur du parent */

div { width: auto; }      /* Défaut : s'adapte au contenu/parent */
div { width: fit-content; }/* S'adapte au contenu (moderne) */

/* Contraintes (plus robustes que width seul) */
.container {
  width: 100%;
  max-width: 1200px; /* Ne dépasse jamais 1200px */

{
  title: "Display",

    { type: "explain", title: "La propriété la plus fondamentale", content: `
      <p><code>display</code> définit le <strong>modèle de rendu</strong> d'un élément. C'est la propriété la plus structurante du CSS — elle détermine comment un élément interagit avec ses voisins et ses enfants.</p>
    `},
    { type: "syntax", title: "Les valeurs essentielles", code: `/* Éléments bloc : prennent toute la largeur, retour à la ligne */

/* Modèles de layout modernes */
.flex-container { display: flex; }
.grid-container { display: grid; }

/* Cacher complètement (supprime du flux) */
.hidden { display: none; }

.invisible { visibility: hidden; }` },

{
  title: "Flexbox",
  subtitle: "Le système de mise en page 1D le plus utilisé en CSS moderne",
  blocks: [
    { type: "explain", title: "Le modèle Flexbox", content: `
      <p>Flexbox (Flexible Box Layout) est un système de mise en page <strong>uni-dimensionnel</strong> (une ligne OU une colonne). Il gère l'alignement et la distribution d'espace entre éléments.</p>
      <p>On applique <code>display: flex</code> au <strong>conteneur parent</strong> (flex container). Les enfants directs deviennent des <strong>flex items</strong> et réagissent aux règles flex.</p>
    `},
    { type: "syntax", title: "Les propriétés essentielles", code: `/* Sur le CONTENEUR */
.container {
  display: flex;
  flex-direction: row;       /* row | column | row-reverse | column-reverse */
  justify-content: center;   /* Axe principal (horizontal si row) */
  align-items: center;       /* Axe secondaire */
  flex-wrap: wrap;           /* Retour à la ligne si débordement */
  gap: 16px;                 /* Espace entre tous les items */
  align-content: flex-start; /* Alignement des lignes si flex-wrap */
}

/* Sur les ITEMS */
.item {
  flex: 1;           /* Grandit pour remplir l'espace (= flex-grow: 1) */
  flex: 0 0 200px;   /* Taille fixe : ne grandit ni ne rétrécit */
  align-self: flex-end; /* Override l'align-items du parent */
  order: 2;          /* Changer l'ordre visuel sans modifier le HTML */
}` },
    { type: "tip", title: "💡 Centrage parfait — la technique la plus demandée", content: `
      <p>Pour centrer un élément horizontalement ET verticalement dans son conteneur :</p>
      <div class="callout">.parent { display: flex; justify-content: center; align-items: center; }</div>

    `}

{
  title: "Justify Content",

    { type: "syntax", title: "Les 6 valeurs", code: `.flex { display: flex; }

/* Regroupement */

  blocks: [

{
  title: "Position",
  subtitle: "Comprendre les 5 modes de positionnement et quand utiliser chacun",
  blocks: [
    { type: "explain", title: "Le flux normal et les alternatives", content: `
      <p>Par défaut, les éléments suivent le <strong>flux normal</strong> du document (static). <code>position</code> permet de sortir du flux ou d'ajuster la position dans le flux.</p>
      <p>Les propriétés <code>top</code>, <code>left</code>, <code>right</code>, <code>bottom</code> n'ont d'effet que si <code>position</code> est différent de <code>static</code>.</p>
    `},
    { type: "syntax", title: "Les 5 valeurs", code: `/* Flux normal (défaut) — top/left ignorés */
div { position: static; }

/* Dans le flux + déplaçable */
div { position: relative; top: 10px; left: 20px; }

/* Hors du flux, ancré au parent positionné */
.child { position: absolute; top: 0; right: 0; }
.parent { position: relative; } /* Établit le référentiel */

/* Hors du flux, ancré à la fenêtre (ne scroll pas) */
.header { position: fixed; top: 0; left: 0; width: 100%; }

/* Dans le flux MAIS reste visible en scrollant */
.nav { position: sticky; top: 0; }` },
    { type: "example", title: "Référentiels de positionnement", table: [

{

      <p><code>top</code>, <code>right</code>, <code>bottom</code>, <code>left</code> déplacent un élément positionné. Ces valeurs peuvent être positives, négatives ou en pourcentage.</p>

    { type: "syntax", title: "Patterns courants", code: `.box { position: absolute; }

.top-right    { top: 0; right: 0; }
.bottom-right { bottom: 0; right: 0; }

  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

{

{

  subtitle: "Créer des états interactifs avec la pseudo-classe :hover",
  blocks: [
    { type: "explain", title: "La pseudo-classe :hover", content: `
      <p><code>:hover</code> s'applique quand la souris survole un élément. C'est la base de l'interactivité CSS. Elle peut cibler l'élément survolé ou agir sur ses enfants.</p>
    `},
    { type: "syntax", title: "Patterns hover courants", code: `/* Bouton */

  background: #5b47e0;
  transition: all 0.2s ease;

  background: #4a38cc;
  transform: translateY(-2px);

.card {

}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}

/* Révéler un élément enfant au survol du parent */
.card .overlay { opacity: 0; transition: opacity 0.2s; }
.card:hover .overlay { opacity: 1; }

/* Soulignement animé */
a { text-decoration: none; }
a::after { content:''; display:block; height:2px; background:currentColor; transform:scaleX(0); transition:transform 0.2s; }
a:hover::after { transform:scaleX(1); }` },
    { type: "tip", title: "💡 :focus et :focus-visible pour l'accessibilité", content: `
      <p>Ne stylisez jamais <code>:hover</code> seul sans penser à <code>:focus</code> — les utilisateurs clavier ont besoin d'un état focus visible. Utilisez <code>:hover, :focus-visible</code> ensemble.</p>
      <div class="callout">button:hover, button:focus-visible { background: #4a38cc; outline: 2px solid #5b47e0; }</div>
    `}
  ],
  demo: `body { background: #f9f8f6; font-family: sans-serif; padding: 50px; display: flex; gap: 20px; }\nbutton { padding: 12px 24px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: sans-serif; }\n.b1 { background: #5b47e0; color: white; }\n.b1:hover { background: #4a38cc; transform: translateY(-2px); box-shadow: 0 6px 18px rgba(91,71,224,0.4); }\n.b2 { background: transparent; border: 2px solid #d4467a; color: #d4467a; }\n.b2:hover { background: #d4467a; color: white; }`
},
{
  title: "Transition",
  subtitle: "Animer les changements de propriété CSS avec contrôle de timing et de courbe",
  blocks: [
    { type: "explain", title: "Animer les changements d'état", content: `
      <p><code>transition</code> anime le passage d'un état CSS à un autre (typiquement lors d'un <code>:hover</code> ou changement de classe). Elle se déclare sur l'<strong>état initial</strong> de l'élément, pas sur le :hover.</p>
    `},
    { type: "syntax", title: "Syntaxe et timing functions", code: `/* propriété | durée | timing-function | délai */
div { transition: all 0.3s ease 0s; }

/* Plusieurs propriétés (recommandé : plus performant) */
div {
  transition:
    background 0.3s ease,
    transform 0.2s ease-in-out,
    box-shadow 0.3s ease;
}

/* Courbes de vitesse */
/* ease        → lent-rapide-lent (défaut, naturel) */
/* linear      → vitesse constante */
/* ease-in     → commence lentement */
/* ease-out    → finit lentement (le plus naturel) */
/* ease-in-out → lent au début ET à la fin */
/* cubic-bezier(0.4, 0, 0.2, 1) → courbe personnalisée */` },
    { type: "example", title: "Durées recommandées par type d'animation", table: [
      ["Type d'interaction","Durée recommandée","Timing function"],
      ["Micro-interaction (hover)","100-200ms","ease-out"],
      ["Transition de page","200-300ms","ease-in-out"],
      ["Animation décorative","300-500ms","ease"],
      ["Loading/skeleton","600-1000ms","linear (loop)"],
    ]},
    { type: "tip", title: "💡 Évitez transition: all", content: `
      <p><code>transition: all</code> anime <em>toutes</em> les propriétés, y compris des propriétés coûteuses comme <code>width</code> ou <code>height</code>. Cibler explicitement : <code>transition: transform 0.2s, opacity 0.2s</code>. Ces deux propriétés sont animées sur le GPU — performantes !</p>
    `}
  ],
  demo: `body { background: #f9f8f6; font-family: sans-serif; padding: 50px; }\n.box { width: 120px; height: 120px; background: #5b47e0; border-radius: 16px; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; cursor: pointer; font-size: 13px; }\n.box:hover { transform: scale(1.15) rotate(5deg); background: #d4467a; box-shadow: 0 0 40px rgba(212,70,122,0.4); border-radius: 50%; }`
},
{
  title: "Transform",
  subtitle: "Déplacer, faire pivoter, agrandir et incliner les éléments sans affecter le flux",
  blocks: [
    { type: "explain", title: "Transformations 2D et 3D", content: `
      <p><code>transform</code> applique des transformations géométriques à un élément. Avantage clé : <strong>ne modifie pas le flux</strong> du document — l'espace occupé reste le même.</p>
      <p>Les transformations sont appliquées dans leur ordre de déclaration (de droite à gauche).</p>
    `},
    { type: "syntax", title: "Toutes les fonctions", code: `/* DÉPLACEMENT */
div { transform: translateX(50px); }       /* Horizontal */
div { transform: translateY(-20px); }      /* Vertical (négatif = vers le haut) */
div { transform: translate(20px, -30px); } /* X et Y */
div { transform: translateZ(10px); }       /* Axe de profondeur (3D) */

/* MISE À L'ÉCHELLE */
div { transform: scale(1.5); }     /* Uniforme */
div { transform: scaleX(2); }      /* Seulement en largeur */
div { transform: scale(0.8, 1.2); }/* X et Y différents */

/* ROTATION */
div { transform: rotate(45deg); }       /* 2D */
div { transform: rotateX(60deg); }      /* 3D (axe X) */
div { transform: rotateY(180deg); }     /* Effet "flip carte" */

/* INCLINAISON */
div { transform: skewX(15deg); }
div { transform: skewY(-5deg); }

/* COMBINAISON (ordre = droite vers gauche) */
div { transform: translateY(-4px) scale(1.05); }` },
    { type: "tip", title: "💡 transform-origin — changer le point de pivot", content: `
      <p>Par défaut, les transformations s'appliquent depuis le centre. Pour un effet de flip de carte ou une rotation depuis un coin :</p>
      <div class="callout">.btn { transform-origin: left center; }  /* Rotation depuis le bord gauche */</div>
    `}
  ],
  demo: `body { background: #f9f8f6; font-family: sans-serif; padding: 50px; display: flex; gap: 30px; flex-wrap: wrap; align-items: center; }\n.box { width: 80px; height: 80px; background: #5b47e0; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: 700; border-radius: 10px; text-align: center; }\n.a { transform: none; }\n.b { transform: rotate(30deg); background: #d4467a; }\n.c { transform: scale(1.4); background: #1a9e6e; }\n.d { transform: skewX(15deg); background: #d97706; }`
},
{
  title: "Animation",
  subtitle: "Créer des animations CSS autonomes avec @keyframes et contrôle complet",
  blocks: [
    { type: "explain", title: "Animations sans JavaScript", content: `
      <p>Les animations CSS avec <code>@keyframes</code> permettent de créer des mouvements continus ou ponctuels sans JavaScript. On définit les étapes de l'animation, puis on l'applique à un élément.</p>
      <p>Contrairement à <code>transition</code> (déclenchée par un changement d'état), les animations peuvent démarrer automatiquement et se répéter.</p>
    `},
    { type: "syntax", title: "Syntaxe @keyframes", code: `/* 1. Définir les étapes */
@keyframes bounce {
  0%   { transform: translateY(0); }
  50%  { transform: translateY(-40px); }
  100% { transform: translateY(0); }
}

/* Ou : from / to */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 2. Appliquer l'animation */
div {
  animation: bounce 1s ease infinite;
  /* nom | durée | timing | itération */
}

/* Propriétés séparées */
div {
  animation-name: fadeIn;
  animation-duration: 0.5s;
  animation-timing-function: ease-out;
  animation-delay: 0.2s;          /* Délai avant démarrage */
  animation-iteration-count: 1;   /* infinite ou un nombre */
  animation-direction: normal;    /* alternate = aller-retour */
  animation-fill-mode: both;      /* Garde l'état final */
  animation-play-state: running;  /* paused pour stopper */
}` },
    { type: "tip", title: "💡 animation-fill-mode: both — presque toujours utile", content: `
      <p><code>forwards</code> : garde l'état de la dernière keyframe une fois terminée. <code>backwards</code> : applique l'état de la 1ère keyframe pendant le délai. <code>both</code> : les deux — à utiliser par défaut.</p>
    `}
  ],
  demo: `body { background: #f9f8f6; font-family: sans-serif; padding: 60px; display: flex; gap: 40px; }\n@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-28px)} }\n@keyframes spin { to{transform:rotate(360deg)} }\n@keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.2);opacity:0.7} }\n.a { width: 60px; height: 60px; background: #5b47e0; border-radius: 50%; animation: bounce 1s ease infinite; }\n.b { width: 60px; height: 60px; background: #d4467a; border-radius: 10px; animation: spin 2s linear infinite; }\n.c { width: 60px; height: 60px; background: #1a9e6e; border-radius: 16px; animation: pulse 1.5s ease infinite; }`
},
{
  title: "Overflow",
  subtitle: "Contrôler ce qui se passe quand le contenu dépasse les limites de son conteneur",
  blocks: [
    { type: "explain", title: "Gestion du débordement", content: `
      <p><code>overflow</code> contrôle le comportement du contenu qui dépasse les dimensions de son conteneur. Par défaut, le contenu déborde librement (<code>visible</code>).</p>
    `},
    { type: "syntax", title: "Les valeurs et cas spéciaux", code: `div { overflow: visible; }  /* Défaut : dépasse librement */
div { overflow: hidden; }   /* Cache ce qui dépasse — utile ! */
div { overflow: scroll; }   /* Scrollbar toujours affichée */
div { overflow: auto; }     /* Scrollbar seulement si nécessaire */
div { overflow: clip; }     /* Comme hidden sans créer de bloc */

/* Axe séparé */
div { overflow-x: auto; overflow-y: hidden; }

/* Couper le texte avec ellipsis "..." */
p {
  overflow: hidden;
  white-space: nowrap;       /* Empêche le retour à la ligne */
  text-overflow: ellipsis;   /* Ajoute "..." */
}

/* Multi-lignes (moderne) */
p {
  display: -webkit-box;
  -webkit-line-clamp: 3;     /* Nombre de lignes max */
  -webkit-box-orient: vertical;
  overflow: hidden;
}` },
    { type: "tip", title: "💡 overflow: hidden comme outil de mise en page", content: `
      <p><code>overflow: hidden</code> sert aussi à :</p>
      <ul>
        <li>Contenir les éléments flottants (<em>clearfix moderne</em>)</li>
        <li>Découper les images dans leurs conteneurs (<code>border-radius</code> + <code>overflow: hidden</code>)</li>
        <li>Masquer les barres de défilement tout en permettant le scroll JS</li>
      </ul>
    `}
  ],
  demo: `body { background: #f9f8f6; font-family: sans-serif; padding: 24px; display: flex; gap: 16px; align-items: flex-start; }\n.box { width: 150px; height: 100px; background: white; border: 1px solid #e8e4de; border-radius: 10px; padding: 12px; color: #1a1714; font-size: 12px; }\n.a { overflow: visible; }\n.b { overflow: hidden; }\n.c { overflow: auto; }`
},
{
  title: "Cursor",
  subtitle: "Personnaliser le curseur pour communiquer l'interactivité à l'utilisateur",
  blocks: [
    { type: "explain", title: "Signal visuel d'interactivité", content: `
      <p><code>cursor</code> change l'apparence du pointeur souris au survol d'un élément. C'est un signal UX important : il communique à l'utilisateur ce qu'il peut faire avec un élément.</p>
    `},
    { type: "syntax", title: "Les curseurs essentiels", code: `button { cursor: pointer; }     /* Main ☞ — éléments cliquables */
div    { cursor: default; }     /* Flèche — comportement normal */
input  { cursor: text; }        /* Barre I — saisie de texte */
.drag  { cursor: grab; }        /* Main ouverte — glissable */
.drag:active { cursor: grabbing; }/* Main fermée — en cours */
.disabled { cursor: not-allowed; }/* Interdit ⊘ */
.resize { cursor: resize; }     /* Redimensionnement */
.move  { cursor: move; }        /* Déplacement ✥ */
.help  { cursor: help; }        /* Point d'interrogation ? */

/* Curseurs de redimensionnement */
.e-resize { cursor: e-resize; } /* ↔ horizontal */
.n-resize { cursor: n-resize; } /* ↕ vertical */
.nw-resize { cursor: nw-resize; }/* ↖ diagonal */

/* Curseur personnalisé */
div { cursor: url('cursor.png') 8 8, auto; }
/* Le 8 8 = point chaud (hotspot) */` },
    { type: "tip", title: "💡 Erreur fréquente : oublier pointer", content: `
      <p>Tout élément cliquable (bouton, lien, card cliquable, tag filtre) doit avoir <code>cursor: pointer</code>. Sans cela, l'utilisateur ne sait pas qu'il peut cliquer. Vérifiez systématiquement vos éléments interactifs.</p>
    `}
  ],
  demo: `body { background: #f9f8f6; font-family: sans-serif; padding: 40px; display: flex; gap: 12px; flex-wrap: wrap; }\n.box { padding: 12px 18px; background: white; border: 1px solid #e8e4de; border-radius: 8px; color: #3d3730; font-size: 13px; font-weight: 600; }\n.a { cursor: pointer; }\n.b { cursor: not-allowed; }\n.c { cursor: grab; }\n.d { cursor: crosshair; }\n.e { cursor: move; }`
},
{
  title: "Z-index",
  subtitle: "Maîtriser la profondeur et les contextes d'empilement",
  blocks: [
    { type: "explain", title: "L'ordre de superposition", content: `
      <p><code>z-index</code> contrôle l'ordre de superposition (avant/arrière) des éléments. Un z-index plus élevé = l'élément est devant. <strong>Ne fonctionne que sur des éléments positionnés</strong> (position ≠ static).</p>
      <p>Concept clé : les éléments avec <code>position</code>, <code>opacity &lt; 1</code>, <code>transform</code>, ou <code>filter</code> créent un nouveau <strong>contexte d'empilement</strong>.</p>
    `},
    { type: "syntax", title: "Architecture de z-index recommandée", code: `/* Convention : z-index par couches sémantiques */
:root {
  --z-base:    1;
  --z-dropdown: 10;
  --z-sticky:  100;
  --z-modal:   1000;
  --z-toast:   10000;
}

.header { position: sticky; z-index: var(--z-sticky); }
.dropdown { position: absolute; z-index: var(--z-dropdown); }
.modal-overlay { position: fixed; z-index: var(--z-modal); }
.toast { position: fixed; z-index: var(--z-toast); }` },
    { type: "tip", title: "💡 Le piège du contexte d'empilement", content: `
      <p>Un z-index très élevé ne sert à rien si l'élément parent a créé un nouveau contexte d'empilement avec un z-index bas. L'enfant ne peut pas dépasser les limites du contexte de son parent.</p>
      <div class="callout"><strong>Solution :</strong> Si un z-index ne fonctionne pas, vérifiez les parents : ont-ils transform, opacity, filter ou position avec z-index ?</div>
    `}
  ],
  demo: `body { background: #f9f8f6; padding: 60px; }\n.layer { position: absolute; width: 110px; height: 110px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: white; font-family: sans-serif; font-weight: 800; font-size: 13px; }\n.l1 { background: #5b47e0; top: 60px; left: 60px; z-index: 1; }\n.l2 { background: #d4467a; top: 90px; left: 90px; z-index: 2; }\n.l3 { background: #1a9e6e; top: 120px; left: 120px; z-index: 3; color: white; }`
},
{
  title: "Text Shadow",
  subtitle: "Ajouter profondeur et caractère au texte avec des ombres et effets néon",
  blocks: [
    { type: "explain", title: "Ombres sur le texte", content: `
      <p><code>text-shadow</code> fonctionne comme <code>box-shadow</code> mais s'applique aux caractères du texte. On peut empiler plusieurs ombres pour des effets dramatiques.</p>
    `},
    { type: "syntax", title: "Syntaxe et effets", code: `/* offset-x | offset-y | flou | couleur */

/* Ombre subtile (lisibilité sur image) */
h1 { text-shadow: 1px 2px 4px rgba(0,0,0,0.5); }

}

/* Supprimer text-shadow héritée */

    { type: "tip", title: "💡 Utilisation éditoriale moderne", content: `
      <p>Dans le design moderne, <code>text-shadow</code> est utilisé avec parcimonie. Préférez les effets subtils pour la lisibilité (texte sur image) et gardez les effets dramatiques pour les titres hero ou les contextes gaming/néon.</p>

  demo: `body { background: #1a1714; font-family: sans-serif; padding: 40px; }\nh1 { font-size: 36px; margin: 20px 0; }\n.a { color: white; text-shadow: 2px 3px 6px rgba(0,0,0,0.8); }\n.b { color: #c4b5fd; text-shadow: 0 0 20px rgba(91,71,224,0.9), 0 0 40px rgba(91,71,224,0.5); }\n.c { color: #fda4af; text-shadow: 0 0 10px #fff, 0 0 20px #d4467a, 0 0 40px #d4467a; }`
},
{
  title: "Gradient",
  subtitle: "Maîtriser les dégradés linéaires, radiaux et coniques en CSS",
  blocks: [
    { type: "explain", title: "Les 3 types de dégradés", content: `
      <p>CSS permet 3 types de dégradés : <code>linear-gradient</code> (directionnel), <code>radial-gradient</code> (rayonnant depuis un point) et <code>conic-gradient</code> (en secteurs, comme une tarte). Ils s'utilisent comme valeur de <code>background</code>.</p>
    `},
    { type: "syntax", title: "Syntaxe des 3 types", code: `/* LINÉAIRE */
div { background: linear-gradient(red, blue); }         /* Bas vers haut */
div { background: linear-gradient(to right, red, blue); }/* Gauche vers droite */
div { background: linear-gradient(135deg, #667eea, #764ba2); }/* Angle */

/* Avec des stops de couleur positionnés */
div { background: linear-gradient(90deg, red 0%, blue 50%, green 100%); }

/* RADIAL */
div { background: radial-gradient(circle, #667eea, #764ba2); }
div { background: radial-gradient(circle at 30% 50%, #667eea, transparent); }
div { background: radial-gradient(ellipse at top, #667eea, transparent); }

/* CONIQUE */
div { background: conic-gradient(red, yellow, green, blue, red); }
/* Pie chart : */

    { type: "tip", title: "💡 Dégradé sur le texte", content: `
      <p>Pour appliquer un dégradé au texte :</p>
      <div class="callout">h1 { background: linear-gradient(135deg, #5b47e0, #d4467a);<br>-webkit-background-clip: text;<br>-webkit-text-fill-color: transparent; }</div>
    `}

  demo: `body { background: #f9f8f6; padding: 24px; display: flex; flex-direction: column; gap: 12px; }\n.box { height: 64px; border-radius: 12px; }\n.a { background: linear-gradient(90deg, #5b47e0, #d4467a); }\n.b { background: linear-gradient(135deg, #f093fb, #f5576c, #fda085); }\n.c { background: radial-gradient(circle at 30% 50%, #1a9e6e, #0f172a); }\n.d { background: conic-gradient(#5b47e0, #d4467a, #d97706, #1a9e6e, #5b47e0); border-radius: 50%; width: 80px; height: 80px; }`
},
{
  title: "CSS Grid",
  subtitle: "Le système de mise en page 2D le plus puissant de CSS",
  blocks: [
    { type: "explain", title: "Grid — mise en page 2D", content: `
      <p>CSS Grid est un système de mise en page <strong>bi-dimensionnel</strong> : il gère simultanément lignes ET colonnes. Idéal pour les layouts de pages entières, là où Flexbox gère une seule direction.</p>
      <p>On applique <code>display: grid</code> au <strong>conteneur</strong>. Les enfants directs deviennent des <em>grid items</em> et se placent automatiquement dans les cellules.</p>
    `},
    { type: "syntax", title: "Syntaxe complète", code: `.container {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr;   /* 3 colonnes */
  grid-template-rows: 80px auto 60px;    /* 3 lignes */
  gap: 16px;                             /* Espace entre cellules */
}

/* Placer un item sur plusieurs cellules */
.item {
  grid-column: 1 / 3;    /* Colonnes 1 à 3 */
  grid-row: 1 / 2;       /* Ligne 1 */
  grid-column: span 2;   /* Occupe 2 colonnes depuis sa position */
  grid-column: 1 / -1;   /* Toute la largeur */
}

/* Named areas — layout lisible */
.container {
  grid-template-areas:
    "header header"
    "sidebar main"
    "footer footer";
}
.header { grid-area: header; }
.sidebar { grid-area: sidebar; }` },
    { type: "tip", title: "💡 L'unité fr — flexible et puissante", content: `
      <p><code>fr</code> (fraction) divise l'espace <em>disponible</em> proportionnellement. <code>1fr 2fr 1fr</code> = 25% / 50% / 25%. Elle tient compte du gap contrairement aux pourcentages.</p>
    `}
  ],
  demo: `body { background: #f9f8f6; padding: 24px; }\n.grid { display: grid; grid-template-columns: 1fr 2fr 1fr; grid-template-rows: 72px 110px; gap: 12px; }\n.item { background: white; border: 1px solid #e8e4de; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #5b47e0; font-family: sans-serif; font-weight: 700; font-size: 13px; }\n.span { grid-column: 1 / -1; background: #ede9ff; color: #5b47e0; border-color: #c4b5fd; }`
},
{
  title: "Grid Columns",
  subtitle: "Définir des colonnes flexibles et créer des layouts responsives sans media queries",
  blocks: [
    { type: "explain", title: "grid-template-columns", content: `
      <p><code>grid-template-columns</code> définit le nombre et la taille des colonnes. C'est la propriété grid la plus utilisée. Elle accepte des tailles fixes, des fractions, des valeurs <code>auto</code> et les fonctions <code>repeat()</code> et <code>minmax()</code>.</p>
    `},
    { type: "syntax", title: "Toutes les syntaxes", code: `/* Tailles fixes */
.g { grid-template-columns: 200px 400px 200px; }

/* Fractions (répartition de l'espace disponible) */
.g { grid-template-columns: 1fr 2fr 1fr; }

/* Mélange fixe + fluide (sidebar + contenu) */
.g { grid-template-columns: 250px 1fr; }

/* Répétition */
.g { grid-template-columns: repeat(3, 1fr); }          /* 3 colonnes égales */
.g { grid-template-columns: repeat(3, 200px); }        /* 3 × 200px fixes */

/* RESPONSIVE sans media queries ! */
.g {
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
}
/* auto-fit : crée autant de colonnes que possible
   minmax(250px, 1fr) : min 250px, max 1fr */

/* auto-fill vs auto-fit */
/* auto-fill : garde les colonnes vides */
/* auto-fit  : collapse les colonnes vides */` },
    { type: "tip", title: "💡 Le layout responsive le plus élégant", content: `
      <p><code>repeat(auto-fit, minmax(280px, 1fr))</code> est probablement la ligne CSS la plus puissante pour les grilles responsives. Elle crée automatiquement 1, 2, 3+ colonnes selon la largeur disponible, <strong>sans aucune media query</strong>.</p>

  .container { flex-direction: row; }
  .sidebar { width: 240px; }

@media (min-width: 1024px) {
  .container { max-width: 1200px; margin: 0 auto; }

  h1 { font-size: 4rem; }

  width: 100%;
  max-width: 100%;
  height: auto; /* Garde les proportions */

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let current = 0;
let done = new Set(JSON.parse(localStorage.getItem('cssDone') || '[]'));

function saveDone() { localStorage.setItem('cssDone', JSON.stringify([...done])); }

// ═══════════════════════════════════════════════
//  SIDEBAR
// ═══════════════════════════════════════════════
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  lessons.forEach((l, i) => {
    const div = document.createElement('div');
    div.className = `sidebar-item${i === current ? ' active' : ''}${done.has(i) ? ' done' : ''}`;
    div.innerHTML = `<span class="s-num">${done.has(i) ? '✓' : i+1}</span><span style="overflow:hidden;text-overflow:ellipsis">${l.title}</span>`;
    div.onclick = () => goTo(i);
    sb.appendChild(div);
  });
}

// ═══════════════════════════════════════════════
//  RENDER LESSON
// ═══════════════════════════════════════════════
function renderLesson(i) {
  const panel = document.getElementById('lessonsPanel');
  const l = lessons[i];

  const blockHTML = l.blocks.map(b => {
    if (b.type === 'syntax') {
      return `<div class="block syntax">
        <div class="block-title"><span class="dot"></span>Syntaxe CSS</div>
        <div class="code-wrap">
          <button class="copy-btn" onclick="copyCode(this)">Copier</button>
          <pre>${escHTML(b.code)}</pre>
        </div>
      </div>`;
    }
    if (b.table) {
      const [header, ...rows] = b.table;
      return `<div class="block ${b.type}">
        <div class="block-title"><span class="dot"></span>${escHTML(b.title)}</div>
        <table class="values-table">
          <tr>${header.map(h=>`<th>${escHTML(h)}</th>`).join('')}</tr>
          ${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
        </table>
      </div>`;
    }
    return `<div class="block ${b.type}">
      <div class="block-title"><span class="dot"></span>${escHTML(b.title)}</div>
      ${b.content}
    </div>`;
  }).join('');

  panel.innerHTML = `
    <div class="lesson active">
      <div class="lesson-header">
        <div class="lesson-badge">Leçon ${i+1} / ${lessons.length}</div>
        <h2>${escHTML(l.title)}</h2>
        <p class="lesson-subtitle">${escHTML(l.subtitle)}</p>
      </div>
      ${blockHTML}
      <div style="margin-top:20px">
        <button class="try-btn" onclick="loadDemo(${i})">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="margin-right:6px"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Essayer l'exemple dans l'éditeur
        </button>
      </div>
      <div class="lesson-nav">
        <button class="nav-btn" onclick="goTo(${i-1})" ${i===0?'disabled':''}>← Précédent</button>
        <button class="mark-done-btn ${done.has(i)?'done':''}" onclick="markDone(${i})">
          ${done.has(i) ? '✓ Terminé' : 'Marquer terminé'}
        </button>
        <button class="nav-btn" onclick="goTo(${i+1})" ${i===lessons.length-1?'disabled':''}>Suivant →</button>
      </div>
    </div>
  `;
  panel.scrollTop = 0;
}

// ═══════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════
function goTo(i) {
  if (i < 0 || i >= lessons.length) return;
  current = i;
  renderSidebar();
  renderLesson(i);
  updateProgress();
  document.getElementById('currentBadge').textContent = `Leçon ${i+1}`;
  setTimeout(() => {
    const active = document.querySelector('.sidebar-item.active');
    if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 50);
}

function updateProgress() {
  const pct = (done.size / lessons.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done.size} / ${lessons.length}`;
}

function markDone(i) {
  if (done.has(i)) { done.delete(i); } else { done.add(i); }
  saveDone();
  renderSidebar();
  updateProgress();
  const btn = document.querySelector('.mark-done-btn');
  if (btn) {
    btn.classList.toggle('done', done.has(i));
    btn.textContent = done.has(i) ? '✓ Terminé' : 'Marquer terminé';
  }
}

// ═══════════════════════════════════════════════
//  EDITOR
// ═══════════════════════════════════════════════
let activeTab = 'css';

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.editor-tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0 && tab==='css') || (i===1 && tab==='html'));
  });
  document.getElementById('cssWrap').style.display = tab === 'css' ? 'flex' : 'none';
  const htmlWrap = document.getElementById('htmlWrap');
  htmlWrap.classList.toggle('visible', tab === 'html');
  if (tab === 'html') htmlWrap.style.display = 'flex';
  else htmlWrap.style.display = 'none';
}

function runCode() {
  const css = document.getElementById('editor').value;
  const html = document.getElementById('html-editor').value;
  document.getElementById('result').srcdoc = `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>*{margin:0;padding:0;box-sizing:border-box;} ${css}</style>
</head><body>${html}</body></html>`;

function resetCode() {

function escHTML(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyCode(btn) {
  const code = btn.nextElementSibling.textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✓ Copié !';
    setTimeout(() => btn.textContent = 'Copier', 1600);
  });
}
